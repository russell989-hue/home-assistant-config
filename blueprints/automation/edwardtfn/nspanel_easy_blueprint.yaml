blueprint:
  name: NSPanel Easy Configuration (v2026.5.3)
  author: Edward Firmo (https://github.com/edwardtfn)
  description: '# NSPanel Easy Configuration via Blueprint


    This project enables comprehensive configuration of your NSPanel through a Blueprint
    featuring a user interface.

    '
  source_url: https://raw.githubusercontent.com/edwardtfn/NSPanel-Easy/refs/tags/latest/nspanel_easy_blueprint.yaml
  domain: automation
  homeassistant:
    min_version: 2026.3.0
  input:
    nspanel_name:
      name: NSPanel device (REQUIRED)
      description: Please select the ESPHome device related to the NSPanel to be controlled
        by this automation.
      default: []
      selector:
        device:
          multiple: false
          filter:
          - integration: esphome
            model: NSPanel-Easy
          - integration: esphome
            model: esp32dev
          - integration: esphome
            model: NSPanel_HA_Blueprint
          - integration: esphome
            model: Wall_Display
    localization:
      name: Localization (optional)
      icon: mdi:earth
      description: Select the language and date/time formats to be displayed in your
        panel.
      collapsed: true
      input:
        date_format:
          name: Date Format
          description: Select the format for date to display.
          default: '%A, %d.%m'
          selector:
            select:
              multiple: false
              custom_value: true
              options:
              - label: Weekday, DD MMMM YYYY  (ex. "Friday, 22 March 2024")
                value: '%A, %d %B %Y'
              - label: Weekday, DD MMMM  (ex. "Friday, 22 March")
                value: '%A, %d %B'
              - label: Weekday, DD MMM YYYY  (ex. "Friday, 22 Mar 2024")
                value: '%A, %d %b %Y'
              - label: Weekday, DD MMM  (ex. "Friday, 22 Mar")
                value: '%A, %d %b'
              - label: Weekday DD MMM  (ex. "Friday 22 Mar")
                value: '%A %d %b'
              - label: Weekday, DD.MM.YYYY  (ex. "Friday, 22.03.2024")
                value: '%A, %d.%m.%Y'
              - label: Weekday, DD.MM.  (ex. "Friday, 22.03.")
                value: '%A, %d.%m.'
              - label: Weekday, DD.MM  (ex. "Friday, 22.03")
                value: '%A, %d.%m'
              - label: Weekday D.M.  (ex. "Friday 22.3.")
                value: '%A %-d.%-m.'
              - label: Weekday D.M  (ex. "Friday 22.3")
                value: '%A %-d.%-m'
              - label: Weekday, DD/MM  (ex. "Friday, 22/03")
                value: '%A, %d/%m'
              - label: Weekday, D/M  (ex. "Friday, 22/3")
                value: '%A, %-d/%-m'
              - label: Weekday, M/D  (ex. "Friday, 3/22")
                value: '%A, %-m/%-d'
              - label: Weekday D-M  (ex. "Friday 22-3")
                value: '%A %-d-%-m'
              - label: Weekday M-D  (ex. "Friday 3-22")
                value: '%A %-m-%-d'
              - label: Wkd, DD MMMM YYYY  (ex. "Fri, 22 March 2024")
                value: '%a, %d %B %Y'
              - label: Wkd, DD MMMM  (ex. "Fri, 22 March")
                value: '%a, %d %B'
              - label: Wkd, DD MMM YYYY  (ex. "Fri, 22 Mar 2024")
                value: '%a, %d %b %Y'
              - label: Wkd, DD MMM  (ex. "Fri, 22 Mar")
                value: '%a, %d %b'
              - label: Wkd DD MMM  (ex. "Fri 22 Mar")
                value: '%a %d %b'
              - label: Wkd, DD.MM.YYYY  (ex. "Fri, 22.03.2024")
                value: '%a, %d.%m.%Y'
              - label: Wkd, DD.MM.  (ex. "Fri, 22.03.")
                value: '%a, %d.%m.'
              - label: Wkd, DD.MM  (ex. "Fri, 22.03")
                value: '%a, %d.%m'
              - label: Wkd D.M.  (ex. "Fri 22.3.")
                value: '%a %-d.%-m.'
              - label: Wkd D.M  (ex. "Fri 22.3")
                value: '%a %-d.%-m'
              - label: Wkd, DD/MM  (ex. "Fri, 22/03")
                value: '%a, %d/%m'
              - label: Wkd, D/M  (ex. "Fri, 22/3")
                value: '%a, %-d/%-m'
              - label: Wkd, M/D  (ex. "Fri, 3/22")
                value: '%a, %-m/%-d'
              - label: Wkd D-M  (ex. "Fri 22-3")
                value: '%a %-d-%-m'
              - label: Wkd M-D  (ex. "Fri 3-22")
                value: '%a %-m-%-d'
              - label: DD MMMM YYYY  (ex. "22 March 2024")
                value: '%d %B %Y'
              - label: DD MMMM  (ex. "22 March")
                value: '%d %B'
              - label: MMMM DD, YYYY  (ex. "March 22, 2024")
                value: '%B %d, %Y'
              - label: DD.MM.YYYY  (ex. "22.03.2024")
                value: '%d.%m.%Y'
              - label: DD.MM.  (ex. "22.03.")
                value: '%d.%m.'
              - label: DD.MM  (ex. "22.03")
                value: '%d.%m'
              - label: D.M  (ex. "22.3")
                value: '%-d.%-m'
              - label: DD/MM/YYYY  (ex. "22/03/2024")
                value: '%d/%m/%Y'
              - label: DD/MM  (ex. "22/03")
                value: '%d/%m'
              - label: D/M  (ex. "22/3")
                value: '%-d/%-m'
              - label: MM/DD/YYYY  (ex. "03/22/2024")
                value: '%m/%d/%Y'
              - label: M/D  (ex. "3/22")
                value: '%-m/%-d'
              - label: DD-MM-YYYY  (ex. "22-03-2024")
                value: '%d-%m-%Y'
              - label: DD-MM  (ex. "22-03")
                value: '%d-%m'
              - label: YYYY-MM-DD  (ex. "2024-03-22")  [ISO 8601]
                value: '%Y-%m-%d'
              sort: false
        time_format:
          name: Time Format
          description: Choose how time should be displayed.
          default: '%H:%M'
          selector:
            select:
              multiple: false
              custom_value: true
              options:
              - label: HH:MM  (ex. "08:30" and "20:30")
                value: '%H:%M'
              - label: H:MM  (ex. "8:30" and "20:30")
                value: '%-H:%M'
              - label: HH.MM  (ex. "08.30" and "20.30")
                value: '%H.%M'
              - label: H.MM  (ex. "8.30" and "20.30")
                value: '%-H.%M'
              - label: HH:MM AM/PM  (ex. "08:30 AM" and "08:30 PM")
                value: '%I:%M %p'
              - label: H:MM AM/PM  (ex. "8:30 AM" and "8:30 PM")
                value: '%-I:%M %p'
              - label: AM/PM H:MM  (ex. "AM 8:30" and "PM 8:30")
                value: '%p %-I:%M'
              sort: false
        temperature_unit:
          name: Temperature Unit
          description: Select the temperature unit to display.
          default: °C
          selector:
            select:
              multiple: false
              options:
              - °C
              - °F
              sort: false
              custom_value: false
        decimal_separator:
          name: System settings - Decimal Separator
          description: Choose the decimal separator for displaying numbers.
          default: .
          selector:
            select:
              multiple: false
              options:
              - label: . (Dot)
                value: .
              - label: ', (Comma)'
                value: ','
              sort: false
              custom_value: false
        compact_unit_display:
          name: Compact unit display
          description: When enabled, numeric values and their units are displayed
            without a space between them (e.g., `21°C` instead of `21 °C`).
          default: false
          selector:
            boolean: {}
    weather_temperature:
      name: Weather and temperature (optional)
      icon: mdi:weather-partly-snowy-rainy
      description: Select the weather provider and how the ambient temperatures will
        be displayed.
      collapsed: true
      input:
        weather_entity:
          name: Weather entity from HA
          description: 'Select your weather entity.

            This will be used for weather information on Home page and all the weather
            pages.

            *Only one entity may be selected.*

            '
          default: &id001 []
          selector:
            entity:
              multiple: false
              filter:
              - domain:
                - weather
              reorder: false
        outdoortemp:
          name: Home page - Outdoor Temperature Sensor (Optional)
          description: '`Optional`

            If no outdoor sensor is available, leave this field empty and the value
            from the selected weather integration will be used automatically.

            *Only one entity may be selected.*'
          default: *id001
          selector:
            entity:
              multiple: false
              filter:
              - domain:
                - sensor
                device_class:
                - temperature
              reorder: false
        home_outdoor_temp_label_color:
          name: Home page - Outdoor Temperature Sensor - Text color
          description: Choose a color for the sensor's display text.
          default:
          - 255
          - 255
          - 255
          selector:
            color_rgb: {}
        home_outdoor_temp_font:
          name: Home page - Outdoor Temperature Sensor font size
          description: 'The size of the outdoor temperature font

            ***ATTENTION!** Depending on the value shown and the font size, the text
            may exceed the available space.*

            '
          default: '4'
          selector:
            select:
              multiple: false
              options:
              - label: 16px
                value: '0'
              - label: 18px
                value: '1'
              - label: 22px
                value: '2'
              - label: 26px
                value: '3'
              - label: 36px
                value: '4'
              - label: 48px
                value: '5'
              - label: 72px
                value: '6'
              sort: false
              custom_value: false
        home_indoor_temp_visible:
          name: Home Page - Indoor Temperature Sensor Visibility
          description: Toggle to display the indoor temperature on the Home page.
          default: true
          selector:
            boolean: {}
        indoortemp:
          name: Home page - Indoor Temperature Sensor - Entity (Optional)
          description: '`Optional`

            An indoor temperature sensor is not necessary.

            Leave the field empty if you want to use the temperature sensor of the
            NSPanel.

            Additionally a temperature correction for the NSPanel sensor is possible
            under HA Devices.

            You may select either a temperature `sensor` entity or a `climate` entity,
            in which case the **current temperature** reported by the climate entity
            will be used, not its target temperature.

            *Only one entity may be selected.*'
          default: *id001
          selector:
            entity:
              multiple: false
              filter:
              - domain:
                - sensor
                device_class:
                - temperature
              - domain:
                - climate
              reorder: false
        home_indoor_temp_icon:
          name: Home page - Indoor Temperature Sensor - Icon (Optional)
          description: Icon which should be displayed (Default mdi:thermometer)
          default: mdi:thermometer
          selector:
            icon: {}
        home_indoor_temp_icon_color:
          name: Home page - Indoor Temperature Sensor - Icon color
          description: Icon color which should be displayed.
          default:
          - 255
          - 255
          - 255
          selector:
            color_rgb: {}
        home_indoor_temp_label_color:
          name: Home page - Indoor Temperature Sensor - Text color
          description: Choose a color for the sensor's display text.
          default:
          - 255
          - 255
          - 255
          selector:
            color_rgb: {}
    home_page_entites_states:
      name: Home page - Entities states (optional)
      icon: mdi:home
      description: Select the entities to be displayed on the Home page.
      collapsed: true
      input:
        home_value01:
