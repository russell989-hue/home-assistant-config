                val: '{{ curr_brightness }}'
              continue_on_error: true
            - *id004
            - action: esphome.{{ nspanel_name }}_component_text_list
              data:
                page: light
                id: light_value
                txt_list:
                - '{{ curr_brightness ~ units_separator ~ "%" }}'
              continue_on_error: true
            - *id004
            - action: esphome.{{ nspanel_name }}_component_text_list
              data:
                page: light
                id: light_value_2
                txt_list:
                - '{{ curr_brightness ~ units_separator ~ "%" }}'
              continue_on_error: true
            - *id004
            - if: '{{ color_mode_color_temp }}'
              then:
              - variables:
                  curr_color_temp: '{{ state_attr(entity_id, "color_temp_kelvin")
                    | int(-1) }}'
                  min_color_temp_kelvin: '{{ state_attr(entity_id, "min_color_temp_kelvin")
