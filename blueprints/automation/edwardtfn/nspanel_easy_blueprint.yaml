                  max_color_temp_kelvin: '{{ state_attr(entity_id, "max_color_temp_kelvin")
                    | int(6535) }}'
              - variables:
                  curr_color_temp: "{{\n  curr_color_temp\n  if curr_color_temp >=
                    min_color_temp_kelvin and curr_color_temp <= max_color_temp_kelvin\n
                    \ else ((min_color_temp_kelvin+max_color_temp_kelvin)/2) | int(4268)\n}}\n"
              - condition: '{{ is_number(curr_color_temp) }}'
              - action: esphome.{{ nspanel_name }}_component_text_list
                data:
                  page: light
                  id: temp_value
                  txt_list:
                  - '{{ curr_color_temp }}K'
