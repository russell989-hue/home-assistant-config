                - *id004
            - &id016
              alias: variables_light_modes
              variables:
                entity_id_valid: '{{ entity_id is defined and entity_id is string
                  and entity_id.split(".") | count == 2 }}'
                entity_domain: '{{ entity_id.split(".")[0] if entity_id_valid }}'
                supported_features: '{{ state_attr(entity_id, "supported_features")
                  | int(0) }}'
                supported_color_modes_temp: '{{ state_attr(entity_id, "supported_color_modes")
                  | default([]) }}'
                supported_color_modes: '{{ supported_color_modes_temp if supported_color_modes_temp
                  else [] }}'
                color_mode_brightness: "{{\n  entity_domain == \"light\" and\n  (\n
                  \   supported_features | bitwise_and(1) > 0 or\n    enum.ColorMode.BRIGHTNESS
                  in supported_color_modes or\n    \"brightness\" in supported_color_modes
                  or\n    state_attr(entity_id, \"brightness\") | int(-1) >= 0\n  )\n}}\n"
                color_mode_color: "{{\n  entity_domain == \"light\" and\n  (\n    supported_features
                  | bitwise_and(16) > 0 or\n    enum.ColorMode.HS in supported_color_modes
                  or\n    enum.ColorMode.XY in supported_color_modes or\n    enum.ColorMode.RGB
                  in supported_color_modes or\n    enum.ColorMode.RGBW in supported_color_modes
                  or\n    enum.ColorMode.RGBWW in supported_color_modes or\n    \"hs\"
                  in supported_color_modes or\n    \"xy\" in supported_color_modes
                  or\n    \"rgb\" in supported_color_modes or\n    \"rgbw\" in supported_color_modes
                  or\n    \"rgbww\" in supported_color_modes or\n    state_attr(entity_id,
                  \"rgb_color\") | default(\"unknown\") is list\n  )\n}}\n"
                color_mode_color_temp: "{{\n  entity_domain == \"light\" and\n  (\n
                  \   supported_features | bitwise_and(2) > 0 or\n    enum.ColorMode.COLOR_TEMP
                  in supported_color_modes or\n    \"color_temp\" in supported_color_modes
                  or\n    state_attr(entity_id, \"color_temp_kelvin\") | int(-1) >=
                  0\n  )\n}}\n"
            - variables:
                curr_brightness: '{{ (state_attr(entity_id, "brightness") | int(0)
                  * 100 / 255) | round(0) }}'
            - action: esphome.{{ nspanel_name }}_component_val
