                  \"none\")\n        | rejectattr(\"datetime\", \"eq\", \"\")\n        |
                  selectattr(\"datetime\", \">=\", (today_at(\"00:00\") + timedelta(days=
                  page_index)) | as_timestamp | as_datetime )\n        | selectattr(\"datetime\",
                  \"<\", (today_at(\"00:00\") + timedelta(days= (page_index+1))) |
                  as_timestamp | as_datetime )\n        | map(attribute=\"precipitation\")
                  | list | first\n        if forecast | default([])\n        | selectattr(\"precipitation\",
                  \"defined\")\n        | rejectattr(\"precipitation\", \"none\")\n
                  \       | rejectattr(\"precipitation\", \"eq\", \"\")\n        |
                  selectattr(\"datetime\", \"defined\")\n        | rejectattr(\"datetime\",
                  \"none\")\n        | rejectattr(\"datetime\", \"eq\", \"\")\n        |
                  selectattr(\"datetime\", \">=\", (today_at(\"00:00\") + timedelta(days=
                  page_index)) | as_timestamp | as_datetime )\n        | selectattr(\"datetime\",
                  \"<\", (today_at(\"00:00\") + timedelta(days= (page_index+1))) |
                  as_timestamp | as_datetime )\n        | map(attribute=\"precipitation\")
                  | list | count > 0\n        else \"\" }}',\n      'wind_speed':
                  '{{ forecast | default([])\n        | selectattr(\"wind_speed\",
                  \"defined\")\n        | rejectattr(\"wind_speed\", \"none\")\n        |
                  rejectattr(\"wind_speed\", \"eq\", \"\")\n        | selectattr(\"datetime\",
                  \"defined\")\n        | rejectattr(\"datetime\", \"none\")\n        |
                  rejectattr(\"datetime\", \"eq\", \"\")\n        | selectattr(\"datetime\",
                  \">=\", (today_at(\"00:00\") + timedelta(days= page_index)) | as_timestamp
                  | as_datetime )\n        | selectattr(\"datetime\", \"<\", (today_at(\"00:00\")
                  + timedelta(days= (page_index+1))) | as_timestamp | as_datetime
                  )\n        | map(attribute=\"wind_speed\") | list | first\n        if
                  forecast | default([])\n        | selectattr(\"wind_speed\", \"defined\")\n
                  \       | rejectattr(\"wind_speed\", \"none\")\n        | rejectattr(\"wind_speed\",
                  \"eq\", \"\")\n        | selectattr(\"datetime\", \"defined\")\n
                  \       | rejectattr(\"datetime\", \"none\")\n        | rejectattr(\"datetime\",
                  \"eq\", \"\")\n        | selectattr(\"datetime\", \">=\", (today_at(\"00:00\")
                  + timedelta(days= page_index)) | as_timestamp | as_datetime )\n
                  \       | selectattr(\"datetime\", \"<\", (today_at(\"00:00\") +
                  timedelta(days= (page_index+1))) | as_timestamp | as_datetime )\n
                  \       | map(attribute=\"wind_speed\") | list | count > 0\n        else
                  \"\" }}'\n    }\n  ]\n{% endif %}\n"
            - if: '{{ forecast_day | count > 0 or page_index == 0 }}'
              then:
              - variables:
                  forecast_day: "{% if forecast_day | count > 0 %}{{ forecast_day
                    }} {% elif page_index == 0 %}\n  [\n    {\n      'condition':
                    '{{ states(weather_entity) }}',\n      'temperature': '{{ state_attr(weather_entity,
                    \"temperature\") }}',\n      'wind_speed': '{{ state_attr(weather_entity,
                    \"wind_speed\") }}'\n    }\n  ]\n{% endif %}\n"
              - if: '{{ forecast_day | count > 0 }}'
                then:
                - variables:
                    temp_min: "{{\n  forecast_day\n    | selectattr(\"templow\", \"defined\")\n
                      \   | rejectattr(\"templow\", \"none\")\n    | map(attribute=\"templow\")
                      | map(\"float\") | list | min\n  if forecast_day\n      | selectattr(\"templow\",
                      \"defined\")\n      | rejectattr(\"templow\", \"none\")\n      |
                      map(attribute=\"templow\") | map(\"float\") | list | count >
                      0\n  else\n    forecast_day\n    | selectattr(\"temperature\",
                      \"defined\")\n    | rejectattr(\"temperature\", \"none\")\n
                      \   | rejectattr(\"temperature\", \"eq\", \"\")\n    | map(attribute=\"temperature\")\n
                      \   | map(\"float\") | list | min | default(\"unknown\")\n}}\n"
                    temp_max: "{{\n  forecast_day\n  | selectattr(\"temperature\",
                      \"defined\")\n  | rejectattr(\"temperature\", \"none\")\n  |
                      rejectattr(\"temperature\", \"eq\", \"\")\n  | map(attribute=\"temperature\")\n
                      \ | map(\"float\") | list | max\n  if\n    forecast_day\n    |
                      selectattr(\"temperature\", \"defined\")\n    | rejectattr(\"temperature\",
                      \"none\")\n    | rejectattr(\"temperature\", \"eq\", \"\")\n
                      \   | map(attribute=\"temperature\")\n    | map(\"float\") |
                      list | count > 0\n  else None\n}}\n"
                    condition: "{{\n  forecast_day\n  | selectattr(\"condition\",
                      \"defined\")\n  | rejectattr(\"condition\", \"none\")\n  | rejectattr(\"condition\",
                      \"eq\", \"\")\n  | map(attribute=\"condition\") | list | first\n
                      \ if\n    forecast_day\n    | selectattr(\"condition\", \"defined\")\n
                      \   | rejectattr(\"condition\", \"none\")\n    | rejectattr(\"condition\",
                      \"eq\", \"\")\n    | map(attribute=\"condition\") | list | count
                      > 0\n  else None\n}}\n"
                    precipitation: "{{\n  forecast_day\n  | selectattr(\"precipitation\",
                      \"defined\")\n  | rejectattr(\"precipitation\", \"none\")\n
                      \ | rejectattr(\"precipitation\", \"eq\", \"\")\n  | map(attribute=\"precipitation\")\n
                      \ | map(\"float\") | list | sum | round(0)\n  if\n    forecast_day\n
                      \   | selectattr(\"precipitation\", \"defined\")\n    | rejectattr(\"precipitation\",
                      \"none\")\n    | rejectattr(\"precipitation\", \"eq\", \"\")\n
                      \   | map(attribute=\"precipitation\")\n    | map(\"float\")
                      | list | count > 0\n  else None\n}}\n"
                    precipitation_probability: "{{\n  forecast_day\n  | selectattr(\"precipitation_probability\",
                      \"defined\")\n  | rejectattr(\"precipitation_probability\",
                      \"none\")\n  | rejectattr(\"precipitation_probability\", \"eq\",
                      \"\")\n  | map(attribute=\"precipitation_probability\")\n  |
                      map(\"float\") | list | max | round(0)\n  if\n    forecast_day\n
                      \   | selectattr(\"precipitation_probability\", \"defined\")\n
                      \   | rejectattr(\"precipitation_probability\", \"none\")\n
                      \   | rejectattr(\"precipitation_probability\", \"eq\", \"\")\n
                      \   | map(attribute=\"precipitation_probability\")\n    | map(\"float\")
                      | list | count > 0\n  else None\n}}\n"
                    pressure: "{{\n  forecast_day\n  | selectattr(\"pressure\", \"defined\")\n
                      \ | rejectattr(\"pressure\", \"none\")\n  | rejectattr(\"pressure\",
                      \"eq\", \"\")\n  | map(attribute=\"pressure\")\n  | map(\"float\")
                      | list | max | round(0)\n  if\n    forecast_day\n    | selectattr(\"pressure\",
                      \"defined\")\n    | rejectattr(\"pressure\", \"none\")\n    |
                      rejectattr(\"pressure\", \"eq\", \"\")\n    | map(attribute=\"pressure\")\n
                      \   | map(\"float\") | list | count > 0\n  else None\n}}\n"
                    wind_speed: "{{\n  forecast_day\n  | selectattr(\"wind_speed\",
                      \"defined\")\n  | rejectattr(\"wind_speed\", \"none\")\n  |
                      rejectattr(\"wind_speed\", \"eq\", \"\")\n  | map(attribute=\"wind_speed\")\n
                      \ | map(\"float\") | list | max | round(0)\n  if\n    forecast_day\n
                      \   | selectattr(\"wind_speed\", \"defined\")\n    | rejectattr(\"wind_speed\",
                      \"none\")\n    | rejectattr(\"wind_speed\", \"eq\", \"\")\n
                      \   | map(attribute=\"wind_speed\")\n    | map(\"float\") |
                      list | count > 0\n  else None\n}}\n"
                    hours_of_sun: "{{\n  forecast_day\n  | selectattr(\"hours_of_sun\",
                      \"defined\")\n  | rejectattr(\"hours_of_sun\", \"none\")\n  |
                      rejectattr(\"hours_of_sun\", \"eq\", \"\")\n  | map(attribute=\"hours_of_sun\")\n
                      \ | map(\"float\")\n  | list\n  | sum\n  | round(0)\n  if\n
                      \   forecast_day\n    | selectattr(\"hours_of_sun\", \"defined\")\n
                      \   | rejectattr(\"hours_of_sun\", \"none\")\n    | rejectattr(\"hours_of_sun\",
                      \"eq\", \"\")\n    | map(attribute=\"hours_of_sun\")\n    |
                      map(\"float\")\n    | list\n    | count > 0\n  else None\n}}\n"
                    uv_index: "{{\n  forecast_day\n  | selectattr(\"uv_index\", \"defined\")\n
                      \ | rejectattr(\"uv_index\", \"none\")\n  | rejectattr(\"uv_index\",
                      \"eq\", \"\")\n  | map(attribute=\"uv_index\")\n  | map(\"float\")\n
                      \ | list\n  | max\n  | round(0)\n  if\n    forecast_day\n    |
                      selectattr(\"uv_index\", \"defined\")\n    | rejectattr(\"uv_index\",
                      \"none\")\n    | rejectattr(\"uv_index\", \"eq\", \"\")\n    |
                      map(attribute=\"uv_index\")\n    | map(\"float\")\n    | list\n
                      \   | count > 0\n  else None\n}}\n"
                    thunderstorm_probability: "{{\n  forecast_day\n  | selectattr(\"thunderstorm_probability\",
                      \"defined\")\n  | rejectattr(\"thunderstorm_probability\", \"none\")\n
                      \ | rejectattr(\"thunderstorm_probability\", \"eq\", \"\")\n
                      \ | map(attribute=\"thunderstorm_probability\") | map(\"float\")\n
                      \ | list\n  | max\n  | round(0)\n  if\n    forecast_day\n    |
                      selectattr(\"thunderstorm_probability\", \"defined\")\n    |
                      rejectattr(\"thunderstorm_probability\", \"none\")\n    | rejectattr(\"thunderstorm_probability\",
                      \"eq\", \"\")\n    | map(attribute=\"thunderstorm_probability\")\n
                      \   | map(\"float\")\n    | list\n    | count > 0\n  else None\n}}\n"
                    humidity: "{{\n  forecast_day\n  | selectattr(\"humidity\", \"defined\")\n
                      \ | rejectattr(\"humidity\", \"none\")\n  | rejectattr(\"humidity\",
                      \"eq\", \"\")\n  | map(attribute=\"humidity\")\n  | map(\"float\")\n
                      \ | list\n  | max\n  | round(0)\n  if\n    forecast_day\n    |
                      selectattr(\"humidity\", \"defined\")\n    | rejectattr(\"humidity\",
                      \"none\")\n    | rejectattr(\"humidity\", \"eq\", \"\")\n    |
                      map(attribute=\"humidity\")\n    | map(\"float\")\n    | list\n
                      \   | count > 0\n  else None\n}}\n"
                    parameters:
                    - name: hours_of_sun
                      visibility: '{{ is_number(hours_of_sun) }}'
                      value: '{{ (hours_of_sun ~ units_separator ~ weather_units.hours_of_sun)
                        if is_number(hours_of_sun) }}'
                      icon: '{{ nextion.icon.weather.sun }}'
                    - name: thunderstorm_probability
                      visibility: '{{ is_number(thunderstorm_probability) }}'
                      value: '{{ (thunderstorm_probability ~ units_separator ~ weather_units.thunderstorm_probability)
                        if is_number(thunderstorm_probability) }}'
                      icon: '{{ nextion.icon.weather.lightning }}'
                    - name: precipitation
                      visibility: '{{ is_number(precipitation) or is_number(precipitation_probability)
                        }}'
                      value: '{{ (precipitation ~ units_separator ~ weather_units.precipitation)
                        if is_number(precipitation) }} {{ "-" if is_number(precipitation)
                        and is_number(precipitation_probability) }} {{ (precipitation_probability
                        ~ units_separator ~ weather_units.precipitation_probability)
                        if is_number(precipitation_probability) }}

                        '
                      icon: '{{ nextion.icon.weather.rain }}'
                    - name: uv_index
                      visibility: '{{ is_number(uv_index) }}'
                      value: '{{ (uv_index ~ units_separator ~ weather_units.uv_index)
                        if is_number(uv_index) }}'
                      icon: '{{ nextion.icon.weather.protect }}'
                    - name: wind_speed
                      visibility: '{{ is_number(wind_speed) }}'
                      value: '{{ (wind_speed ~ units_separator ~ weather_units.wind_speed)
                        if is_number(wind_speed) }}'
                      icon: '{{ nextion.icon.weather.wind }}'
                    - name: humidity
                      visibility: '{{ is_number(humidity) }}'
                      value: '{{ (humidity ~ units_separator ~ weather_units.humidity)
                        if is_number(humidity) }}'
                      icon: '{{ all_icons["water-percent"] }}'
                    - name: pressure
                      visibility: '{{ is_number(pressure) }}'
                      value: '{{ (pressure ~ units_separator ~ weather_units.pressure)
                        if is_number(pressure) }}'
                      icon: '{{ nextion.icon.weather.gauge }}'
                - if: '{{ condition not in ["unknown", None] }}'
                  then:
                  - action: esphome.{{ nspanel_name }}_component_val
                    data:
                      page: mem
                      id: weather_icon
                      val: "{{\n  nextion.pic.weather[\n    states(weather_entity)
                        | default(\"unavailable\")\n    if weather_entity is string\n
                        \   else \"unavailable\"\n  ] | int(1)\n  if condition ==
                        \"unknown\" and page_name == pages.weatherpages[0]\n  else
                        nextion.pic.weather[condition] | int(1)\n}}"
                    continue_on_error: true
                  - *id004
                - variables:
                    temperature_string: '{{ (temp_min | round(0) ~ units_separator
                      ~ weather_temp_units) if is_number(temp_min) }} {{ "/" if is_number(temp_min)
                      and is_number(temp_max) and temp_min != temp_max }} {{ (temp_max
                      | round(0) ~ units_separator ~ weather_temp_units) if is_number(temp_max)
                      and temp_min != temp_max }}

                      '
                - if: '{{ (is_number(temp_min) or is_number(temp_max)) and temperature_string
                    is string and temperature_string | length > 0 }}'
                  then:
                  - action: esphome.{{ nspanel_name }}_component_text_list
                    data:
                      page: '{{ page_name }}'
                      id: temperature
                      txt_list:
                      - '{{ temperature_string }}'
                    continue_on_error: true
                  - *id004
                - repeat:
                    for_each: '{{ (parameters | selectattr("visibility", "eq", true)
                      | list)[:5] }}'
                    sequence:
                    - action: esphome.{{ nspanel_name }}_component_text_list
                      data:
                        page: '{{ page_name }}'
                        id: value0{{ repeat.index }}
                        txt_list:
                        - '{{ repeat.item.value }}'
                      continue_on_error: true
                    - *id004
                    - action: esphome.{{ nspanel_name }}_component_text_list
                      data:
                        page: '{{ page_name }}'
                        id: value0{{ repeat.index }}_icon
                        txt_list:
                        - '{{ repeat.item.icon }}'
                      continue_on_error: true
                    - *id004
                else: &id010
                - action: esphome.{{ nspanel_name }}_component_text_list
                  data:
                    page: '{{ page_name }}'
                    id: value01
                    txt_list:
                    - _{_unavailable_}_
                  continue_on_error: true
              else: *id010
          - alias: Utilities page
            conditions: '{{ nspanel_event.page == pages.utilities }}'
            sequence:
            - alias: Utilities page - Title
              sequence:
              - variables:
                  page_icon: '{{ pages_utilities.title.icon.split("mdi:")[1] if pages_utilities.title.icon
                    is string and pages_utilities.title.icon.split("mdi:") | count
                    == 2 }}'
              - action: esphome.{{ nspanel_name }}_component_text_list
                data:
                  page: utilities
                  id: title_icon
                  txt_list:
                  - '{{ all_icons[page_icon] if page_icon in all_icons else all_icons.gauge
                    }}'
                continue_on_error: true
              - *id004
              - action: esphome.{{ nspanel_name }}_component_text_list
                data:
                  page: utilities
                  id: title
                  txt_list:
                  - '{{ pages_utilities.title.label }}'
                continue_on_error: true
              - *id004
            - variables:
                utilities_constructor_init: true
            - alias: Utilities page - Groups
              repeat:
                for_each: '{{ pages_utilities.groups | list }}'
                sequence: &id045
                - variables:
                    utilities_constructor: '{{ utilities_constructor_init is defined
                      and utilities_constructor_init }}'
                    icon_enabled: "{{\n  utilities_constructor and\n  repeat.item.icon
                      is defined and\n  repeat.item.icon is string and\n  repeat.item.icon.split(\"mdi:\")[1]
                      in all_icons\n}}\n"
                    value1_enabled: "{{\n  repeat.item.value1 is defined and\n  repeat.item.value1
                      is string and\n  repeat.item.value1.split(\".\") | count ==
                      2 and\n  (utilities_constructor or (trigger.entity_id == repeat.item.value1))\n}}\n"
                    value2_enabled: "{{\n  repeat.item.value2 is defined and\n  repeat.item.value2
                      is string and\n  repeat.item.value2.split(\".\") | count ==
                      2 and\n  (utilities_constructor or (trigger.entity_id == repeat.item.value2))\n}}\n"
                    label_enabled: '{{ utilities_constructor and repeat.item.label
                      is defined and repeat.item.label is string and repeat.item.label
                      | length > 0 }}'
                - alias: Utilities - Display icon
                  if: '{{ icon_enabled }}'
                  then:
                  - variables:
                      icon_code: '{{ repeat.item.icon.split("mdi:")[1] }}'
                  - action: esphome.{{ nspanel_name }}_icon
                    data:
                      page: utilities
                      id: '{{ repeat.item.name }}_icon'
                      icon: '{{ all_icons[icon_code] if icon_code in all_icons else
                        "" }}'
                      icon_color: "{{\n  repeat.item.color\n  if repeat.item.color
                        is defined and repeat.item.color is list and repeat.item.color
                        | count == 3\n  else [0, 0, 0]\n}}\n"
                      visible: '{{ icon_code in all_icons }}'
                    continue_on_error: true
                  - *id004
                - alias: Utilities - Label
                  if: '{{ label_enabled }}'
                  then:
                  - action: esphome.{{ nspanel_name }}_component_text_list
                    data:
                      page: utilities
                      id: '{{ repeat.item.name }}_label'
                      txt_list:
                      - '{{ repeat.item.label }}'
                    continue_on_error: true
                  - *id004
                  - action: esphome.{{ nspanel_name }}_component_color
                    data:
                      page: utilities
                      id: '{{ repeat.item.name }}_label'
                      color: '{{ repeat.item.color }}'
                    continue_on_error: true
                  - *id004
                  - action: esphome.{{ nspanel_name }}_components_visibility
                    data:
                      page: utilities
                      ids: '{{ [repeat.item.name ~ "_label"] }}'
                      visible: true
                    continue_on_error: true
                  - *id004
                - variables:
                    line_ref_state: "{{\n  states(repeat.item.line_ref) | float(0)\n
                      \ if repeat.item.line_ref is defined and repeat.item.line_ref
                      is string and repeat.item.line_ref.split(\".\") | count == 2\n
                      \ else 0\n}}\n"
                    direction: '{{ (((line_ref_state > 0) - (line_ref_state < 0))
                      * (-3 if repeat.item.line_inverted is defined and repeat.item.line_inverted
                      else 3)) | int(0) }}'
                - alias: Utilities - Display values
                  if: '{{ value1_enabled or value2_enabled }}'
                  then:
                  - variables:
                      value_enabled: '{{ value1_enabled }}'
                      entity_id: '{{ repeat.item.value1 if value1_enabled else ""
                        }}'
                  - variables:
                      unit_of_measurement: "{{ state_attr(entity_id, \"unit_of_measurement\")
                        | default(\"\")\n  if value_enabled and entity_id | length
                        > 0 else \"\" }}\n"
                  - *id005
                  - variables:
                      value1_val: "{{\n  (\n    (states(entity_id, rounded=true) ~
                        (units_separator ~ unit_of_measurement if unit_of_measurement
                        is string and unit_of_measurement | length > 0 else \"\"))\n
                        \   if is_number(entity_state)\n    else state_translated(entity_id)\n
                        \ ) | regex_replace('\\s+', ' ') | trim\n  if value_enabled
                        and entity_id_valid and entity_has_value\n  else \"\"\n}}\n"
                      value_enabled: '{{ value2_enabled }}'
                      entity_id: '{{ repeat.item.value2 if value2_enabled else ""
                        }}'
                  - variables:
                      unit_of_measurement: "{{ state_attr(entity_id, \"unit_of_measurement\")
                        | default(\"\")\n  if value_enabled and entity_id | length
                        > 0 else \"\" }}\n"
                  - *id005
                  - variables:
                      value2_val: "{{\n  (\n    (states(entity_id, rounded=true) ~
                        (units_separator ~ unit_of_measurement if unit_of_measurement
                        is string and unit_of_measurement | length > 0 else \"\"))\n
                        \   if is_number(entity_state)\n    else state_translated(entity_id)\n
                        \ ) | regex_replace('\\s+', ' ') | trim\n  if value_enabled
                        and entity_id_valid and entity_has_value\n  else \"\"\n}}\n"
                  - action: esphome.{{ nspanel_name }}_utilities_group_refresh
                    data:
                      group_id: '{{ repeat.item.name }}'
                      value1: '{{ value1_val }}'
                      value2: '{{ value2_val }}'
                      direction: '{{ direction }}'
                      constructor: '{{ utilities_constructor }}'
                    continue_on_error: true
                  - *id004
                  - if: '{{ utilities_constructor }}'
                    then:
                    - if: '{{ value1_enabled }}'
                      then:
                      - action: esphome.{{ nspanel_name }}_component_color
                        data:
                          page: utilities
                          id: '{{ repeat.item.name }}'
                          color: '{{ repeat.item.color }}'
                        continue_on_error: true
                      - *id004
                      - action: esphome.{{ nspanel_name }}_components_visibility
                        data:
                          page: utilities
                          ids: '{{ [repeat.item.name] }}'
                          visible: true
                        continue_on_error: true
                      - *id004
                    - if: '{{ value2_enabled }}'
                      then:
                      - action: esphome.{{ nspanel_name }}_component_color
                        data:
                          page: utilities
                          id: '{{ repeat.item.name }}b'
                          color: '{{ repeat.item.color }}'
                        continue_on_error: true
                      - *id004
                      - action: esphome.{{ nspanel_name }}_components_visibility
                        data:
                          page: utilities
                          ids: '{{ [repeat.item.name ~ "b"] }}'
                          visible: true
                        continue_on_error: true
                      - *id004
                - alias: Utilities - Line
                  if:
                  - '{{ icon_enabled or value1_enabled or value2_enabled or label_enabled
                    }}'
                  - '{{ repeat.item.name not in ["grid"] }}'
                  - '{{ utilities_constructor }}'
                  then:
                  - variables:
                      rgb565: '{{ int(((repeat.item.color[0] //(2**3)) *(2**11))+((repeat.item.color[1]
                        //(2**2)) *(2**5))+(repeat.item.color[2] //(2**3))) }}'
                  - action: esphome.{{ nspanel_name }}_command
                    data:
                      cmd: '{{ repeat.item.name }}_line.bco={{ rgb565 }}'
                    continue_on_error: true
                  - *id004
                  - action: esphome.{{ nspanel_name }}_command
                    data:
                      cmd: '{{ repeat.item.name }}_line.bco1={{ rgb565 }}'
                    continue_on_error: true
                  - *id004
                  - if: '{{ pages_utilities.cursor.width != 255 }}'
                    then:
                    - action: esphome.{{ nspanel_name }}_command
                      data:
                        cmd: '{{ repeat.item.name }}_line.wid={{ pages_utilities.cursor.width
                          }}'
                      continue_on_error: true
                    - *id004
                  - action: esphome.{{ nspanel_name }}_components_visibility
                    data:
                      page: utilities
                      ids: '{{ [repeat.item.name ~ "_line"] }}'
                      visible: true
                    continue_on_error: true
                  - *id004
          - alias: Select page
            conditions: '{{ nspanel_event.page == pages.select }}'
            sequence: &id029
            - *id006
            - *id005
            - *id007
            - variables:
                entity_id_valid: '{{ entity_id is defined and entity_id is string
                  and entity_id.split(".") | count == 2 }}'
                entity_domain: '{{ entity_id.split(".")[0] if entity_id_valid }}'
                current_option_raw: '{{ states(entity_id) }}'
                current_option: "{{\n  current_option_raw | trim\n  if\n    current_option_raw
                  is defined and\n    current_option_raw is string and\n    current_option_raw
                  | length > 0 and\n    current_option_raw not in [\"unknown\", \"unavailable\"]\n
                  \ else \"\"\n}}"
                picker_title_raw: '{{ entity.name if entity is defined and entity.name
                  is defined else None }}'
                picker_title: "{{\n  picker_title_raw\n  if\n    picker_title_raw
                  is defined and\n    picker_title_raw is string and\n    picker_title_raw
                  | length > 0\n  else entity_id\n}}"
            - if: '{{ nspanel_event is defined and nspanel_event.type == "page_changed"
                }}'
              then:
              - variables:
                  options_raw_attr: '{{ state_attr(entity_id, "options") }}'
                  options_raw: "{{\n  options_raw_attr\n  if\n    options_raw_attr
                    is defined and\n    options_raw_attr is iterable and\n    options_raw_attr
                    is not string\n  else []\n}}\n"
              - variables:
                  options_truncated: "{%- if options_raw | length <= 8 -%}\n  {{ options_raw
                    }}\n{%- elif current_option | length == 0 or current_option in
                    options_raw[:8] -%}\n  {{ options_raw[:8] }}\n{%- else -%}\n  {{
                    [current_option] + (options_raw[:7] | reject(\"equalto\", current_option)
                    | list) }}\n{%- endif -%}\n"
              - action: esphome.{{ nspanel_name }}_component_text_list
                data:
                  page: mem
                  id: popup_select_context
                  txt_list:
                  - select_option
                continue_on_error: true
              - *id004
              - action: esphome.{{ nspanel_name }}_component_val
                data:
                  page: mem
                  id: popup_select_mode
                  val: 0
                continue_on_error: true
              - *id004
              - action: esphome.{{ nspanel_name }}_component_text_list
                data:
                  page: mem
                  id: popup_select_options
                  txt_list: '{{ options_truncated }}'
                continue_on_error: true
              - *id004
              - action: esphome.{{ nspanel_name }}_component_text_list
                data:
                  page: popup_select
                  id: lbl_title
                  txt_list:
                  - '{{ picker_title }}'
                continue_on_error: true
              - *id004
            - action: esphome.{{ nspanel_name }}_component_text_list
              data:
                page: mem
                id: popup_select_current
                txt_list:
                - '{{ current_option }}'
              continue_on_error: true
            - *id004
      - alias: Button click
        conditions:
        - '{{ nspanel_event.type == "button_click" }}'
        sequence:
        - choose:
          - alias: Hardware buttons
            conditions:
            - '{{ nspanel_event is defined }}'
            - '{{ nspanel_event.component is defined }}'
            - '{{ nspanel_event.component in ["hw_bt_left", "hw_bt_right"] }}'
            sequence:
            - *id011
            - variables:
                last_click_button: "{{\n  hardware.buttons.left\n  if nspanel_event.component
                  == \"hw_bt_left\"\n  else hardware.buttons.right\n}}\n"
                entity_id: "{{\n  last_click_button.entity\n  if last_click_button
                  is defined and last_click_button.entity is defined\n  else None\n}}\n"
                entity_domain: "{{\n  \"climate\"\n  if entity_id == \"embedded_climate\"\n
                  \ else (\n    entity_id.split(\".\")[0]\n    if entity_id is string
                  and entity_id.split(\".\") | count == 2\n    else \"unknown\"\n
                  \ )\n}}\n"
            - choose:
              - alias: Long click
                conditions: "{{\n  nspanel_event.command == \"long_click\" or\n  entity_domain
                  in [\"alarm_control_panel\", \"climate\", \"input_select\", \"media_player\",
                  \"select\", \"water_heater\"]\n}}"
                sequence:
                - choose:
                  - alias: Default
                    conditions:
                    - '{{ last_click_button.hold_select == "Default" }}'
                    - '{{ entity_domain in ["alarm_control_panel", "button", "climate",
                      "cover", "fan", "input_boolean", "input_button", "input_select",
                      "light", "media_player", "select", "switch", "water_heater"]
                      }}'
                    sequence:
                    - *id005
                    - variables:
                        back_page: '{{ pages.home }}'
                    - &id013
                      sequence:
                      - action: esphome.{{ nspanel_name }}_entity_details_show
                        data:
                          entity: '{{ "embedded_climate" if entity_id == thermostat_embedded
                            else entity_id }}'
                          back_page: '{{ back_page }}'
                        continue_on_error: true
                      - condition: '{{ entity is defined }}'
                      - condition: '{{ entity.name is defined }}'
                      - condition: '{{ entity.name is string }}'
                      - condition: '{{ entity.name | length > 0 }}'
                      - action: esphome.{{ nspanel_name }}_component_text_list
                        data:
                          page: ''
                          id: page_label
                          txt_list:
                          - '{{ entity.name }}'
                        continue_on_error: true
                  - alias: Custom hold action - Left
                    conditions: '{{ last_click_button.hold_select == "Custom Action"
                      and nspanel_event.component == "hw_bt_left" }}'
                    sequence: !input left_button_hold_custom_action
                  - alias: Custom hold action - Right
                    conditions: '{{ last_click_button.hold_select == "Custom Action"
                      and nspanel_event.component == "hw_bt_right" }}'
                    sequence: !input right_button_hold_custom_action
              - alias: Short click
                conditions:
                - '{{ nspanel_event.command == "short_click" }}'
                - '{{ entity_domain not in ["alarm_control_panel", "climate", "media_player",
                  "water_heater"] }}'
                sequence:
                - alias: Custom click action - Left
                  if: '{{ nspanel_event.component == "hw_bt_left" }}'
                  then:
                  - sequence: !input left_button_click_custom_action
                - alias: Custom click action - Right
                  if: '{{ nspanel_event.component == "hw_bt_right" }}'
                  then:
                  - sequence: !input right_button_click_custom_action
                - condition: '{{ last_click_button is defined }}'
                - condition: '{{ last_click_button.entity is defined }}'
                - condition: '{{ last_click_button.entity is string }}'
                - condition: '{{ last_click_button.entity | length > 2 }}'
                - condition: '{{ nspanel_event.component != "hw_bt_left" or hardware.buttons.left.entity
                    != relay01_entity }}'
                - condition: '{{ nspanel_event.component != "hw_bt_right" or hardware.buttons.right.entity
                    != relay02_entity }}'
                - &id014
                  alias: short_press-service_call
                  sequence:
                  - action: "{% if entity_domain in [\"cover\"]\n      and states(last_click_button.entity)
                      in [\"opening\", \"closing\"]\n      and state_attr(last_click_button.entity,
                      \"supported_features\") | int(0) | bitwise_and(4) == 0 %}\n
                      \ {{ entity_domain }}.stop_cover\n{% elif entity_domain in [\"light\",
                      \"switch\", \"cover\", \"input_boolean\", \"fan\", \"remote\"]
                      %}\n  {{ entity_domain }}.toggle\n{% elif entity_domain in [\"automation\"]
                      %}\n  {{ entity_domain }}.{{ domain_automation_button_action
                      if domain_automation_button_action is string else \"toggle\"}}\n{%
                      elif entity_domain in [\"button\", \"input_button\"] %}\n  {{
                      entity_domain }}.press\n{% elif entity_domain in [\"lock\"]
                      and states(last_click_button.entity) in [\"locked\"] %}\n  {{
                      entity_domain }}.unlock\n{% elif entity_domain in [\"lock\"]
                      and states(last_click_button.entity) in [\"unlocked\"] %}\n
                      \ {{ entity_domain }}.lock\n{% elif entity_domain in [\"scene\",
                      \"script\"] %}\n  {{ entity_domain }}.turn_on\n{% elif entity_domain
                      in [\"media_player\"] %}\n  {{ entity_domain }}.media_play_pause\n{%
                      else %}\n  homeassistant.update_entity\n{% endif %}\n"
                    data:
                      entity_id: '{{ last_click_button.entity }}'
                    continue_on_error: true
            - if:
              - '{{ entity_domain in ["media_player"] }}'
              - '{{ last_click_button is defined }}'
              - '{{ last_click_button.entity is defined }}'
              - '{{ last_click_button.entity is string }}'
              - '{{ last_click_button.entity | length > 2 }}'
              then:
              - delay:
                  milliseconds: '{{ media_player_update_delay }}'
              - action: homeassistant.update_entity
                data:
                  entity_id: '{{ last_click_button.entity }}'
                continue_on_error: true
          - alias: Buttons pages
            conditions:
            - '{{ nspanel_event.page in pages.buttonpages }}'
            sequence:
            - *id012
            - variables:
                last_click_button: "{{\n  buttons_pages.buttons\n  | selectattr(\"page\",
                  \"defined\")\n  | selectattr(\"page\", \"eq\", nspanel_event.page)\n
                  \ | selectattr(\"component\", \"defined\")\n  | selectattr(\"component\",
                  \"eq\", nspanel_event.component)\n  | selectattr(\"entity\", \"defined\")\n
                  \ | rejectattr(\"entity\", \"eq\", [])\n  | list\n}}\n"
            - condition: '{{ last_click_button | count > 0 }}'
            - variables:
                last_click_button: '{{ last_click_button | first }}'
            - condition: '{{ last_click_button is defined }}'
            - condition: '{{ last_click_button.entity is defined }}'
            - variables:
                entity_id: "{{\n  last_click_button.entity\n  if\n    last_click_button
                  is defined and\n    last_click_button.entity is defined and\n    last_click_button.entity
                  is string and\n    last_click_button.entity | length >= 3\n  else
                  None\n}}\n"
                overlap:
                  icon: "{{\n  last_click_button.icon\n  if\n    last_click_button.icon
                    is defined and\n    last_click_button.icon is string and\n    last_click_button.icon
                    | length > 0 and\n    last_click_button.icon is match \"mdi:\"
                    and\n    last_click_button.icon.split(\"mdi:\")[1] in all_icons\n
                    \ else\n    None\n}}\n"
                  name: '{{ last_click_button.name if last_click_button.name is defined
                    else None }}'
            - condition: '{{ entity_id is string and entity_id | length >= 3 }}'
            - *id005
            - choose:
              - alias: Long click
                conditions:
                - '{{ nspanel_event.command == "long_click" or entity_domain in ["alarm_control_panel",
                  "climate", "input_select", "media_player", "select", "water_heater"]
                  }}'
                - '{{ entity_domain in ["alarm_control_panel", "button", "climate",
                  "cover", "fan", "input_boolean", "input_button", "input_select",
                  "light", "media_player", "select", "switch", "water_heater"] }}'
                sequence:
                - variables:
                    back_page: '{{ nspanel_event.page }}'
                - *id013
              - alias: Short click
                conditions:
                - '{{ nspanel_event.command == "short_click" and entity_domain not
                  in ["alarm_control_panel", "climate", "input_select", "media_player",
                  "select", "water_heater"] }}'
                - '{{ entity_domain not in ["unknown", "person", "binary_sensor",
                  "sensor"] }}'
                sequence:
                - *id014
          - alias: Climate page
            conditions:
            - '{{ nspanel_event is defined }}'
            - '{{ nspanel_event.page is defined }}'
            - '{{ nspanel_event.page == pages.climate }}'
            sequence:
            - *id015
            - variables:
                last_click_button: '{{ climate_custom_buttons | selectattr("component",
                  "defined") | selectattr("component", "eq", nspanel_event.component)
                  | list }}'
            - condition: '{{ last_click_button | count > 0 }}'
            - variables:
                last_click_button: '{{ last_click_button | first }}'
                entity_domain: "{{\n  last_click_button.entity.split(\".\")[0] | default(\"unknown\")\n
                  \ if\n    last_click_button is defined and\n    last_click_button.entity
                  is defined and\n    last_click_button.entity is string and\n    last_click_button.entity
                  | length > 0 and\n    (\n      last_click_button.entity == \"embedded_climate\"
                  or\n      last_click_button.entity.split(\".\") | count == 2\n    )\n
                  \ else \"unknown\"\n}}\n"
            - choose:
              - alias: Long click
                conditions:
                - '{{ nspanel_event.command == "long_click" }}'
                sequence:
                - choose:
                  - conditions: '{{ nspanel_event.component == "button08" }}'
                    sequence: !input climate_button08_hold_custom_action
                  - conditions: '{{ nspanel_event.component == "button09" }}'
                    sequence: !input climate_button09_hold_custom_action
              - alias: Short click
                conditions:
                - '{{ nspanel_event.command == "short_click" }}'
                - '{{ entity_domain not in ["unknown", "person", "binary_sensor",
                  "sensor"] }}'
                sequence:
                - *id014
          - alias: Home page custom buttons
            conditions:
            - '{{ nspanel_event.page == pages.home }}'
            sequence:
            - variables:
                last_click_button: '{{ home_page.custom_buttons | selectattr("component",
                  "defined") | selectattr("component", "eq", nspanel_event.component)
                  | list }}'
            - condition: '{{ last_click_button is defined }}'
            - condition: '{{ last_click_button | count > 0 }}'
            - variables:
                last_click_button: '{{ last_click_button | first }}'
            - condition: '{{ last_click_button is defined }}'
            - condition: '{{ last_click_button.entity is defined }}'
            - alias: variable_entity_input
              variables:
                entity_id: '{{ last_click_button.entity }}'
                overlap:
                  icon: "{{\n  last_click_button.icon\n  if\n    last_click_button.icon
                    is defined and\n    last_click_button.icon is string and\n    last_click_button.icon
                    | length > 0 and\n    last_click_button.icon is match \"mdi:\"
                    and\n    last_click_button.icon.split(\"mdi:\")[1] in all_icons\n
                    \ else\n    None\n}}\n"
                  name: '{{ last_click_button.name if last_click_button.name is defined
                    else None }}'
            - *id016
            - condition: '{{ entity_id_valid }}'
            - if: "{{\n  entity_domain in [\"alarm_control_panel\", \"climate\", \"input_select\",
                \"media_player\", \"select\", \"water_heater\"] or\n  (entity_domain
                == \"cover\" and supported_features | bitwise_and(4) > 0) or\n  (entity_domain
                == \"fan\" and (supported_features | bitwise_and(1) > 0 or supported_features
                | bitwise_and(2) > 0)) or\n  (entity_domain == \"light\" and (color_mode_brightness
                or color_mode_color or color_mode_temp))\n}}\n"
              then:
              - variables:
                  back_page: '{{ pages.home }}'
              - *id005
              - *id013
              else:
              - *id014
      - alias: Versions mismatch
        conditions:
        - '{{ nspanel_event.type == "version"}}'
        sequence:
        - variables:
            nspanel_full_name: "{{\n  device_attr(nspanel_deviceid, \"name\")\n  ~
              ((\" (\" ~ nspanel_name ~ \")\")\n  if nspanel_name != device_attr(nspanel_deviceid,
              \"name\")\n  else \"\")\n}}"
            versions:
              blueprint: '{{ nspanel_event.blueprint | default("") }}'
              esphome: '{{ nspanel_event.esphome | default("") }}'
              tft: "{{\n  nspanel_event.tft | float(0)\n  if nspanel_event.tft is
                defined\n  else 0\n}}\n"
              tft_min: "{{\n  nspanel_event.min_tft_version | float(0)\n  if nspanel_event.min_tft_version
                is defined\n  else 0\n}}\n"
              blueprint_min: "{{\n  nspanel_event.min_blueprint_version | default(\"\")\n
                \ if nspanel_event.min_blueprint_version is defined\n  else \"\"\n}}\n"
            blueprint_reported_parts: "{{\n  versions.blueprint.split('.')\n  | map('int')\n
              \ | list\n  if versions.blueprint | length >= 8\n  and not is_number(versions.blueprint)\n
              \ else [0, 0, 0]\n}}"
            blueprint_min_parts: "{{\n  versions.blueprint_min.split('.')\n  | map('int')\n
              \ | list\n  if versions.blueprint_min | length >= 8\n  and not is_number(versions.blueprint_min)\n
              \ else [0, 0, 0]\n}}"
            blueprint_compatible: "{{\n  blueprint_reported_parts[0] > blueprint_min_parts[0]\n
              \ or (blueprint_reported_parts[0] == blueprint_min_parts[0]\n      and
              blueprint_reported_parts[1] > blueprint_min_parts[1])\n  or (blueprint_reported_parts[0]
              == blueprint_min_parts[0]\n      and blueprint_reported_parts[1] ==
              blueprint_min_parts[1]\n      and blueprint_reported_parts[2] >= blueprint_min_parts[2])\n}}"
            blueprint_behind_esphome_req: "{{\n  blueprint_min_parts[0] > blueprint_reported_parts[0]\n
              \ or (blueprint_min_parts[0] == blueprint_reported_parts[0]\n      and
              blueprint_min_parts[1] > blueprint_reported_parts[1])\n  or (blueprint_min_parts[0]
              == blueprint_reported_parts[0]\n      and blueprint_min_parts[1] ==
              blueprint_reported_parts[1]\n      and blueprint_min_parts[2] > blueprint_reported_parts[2])\n}}"
        - choose:
          - alias: All versions OK
            conditions:
            - "{{\n  versions.blueprint | length >= 8\n  and not is_number(versions.blueprint)\n}}"
            - '{{ versions.blueprint == blueprint_version }}'
            - '{{ blueprint_compatible }}'
            - '{{ versions.tft > 0 and versions.tft_min > 0 }}'
            - '{{ versions.tft >= versions.tft_min }}'
            sequence:
            - action: persistent_notification.dismiss
              data:
                notification_id: NSPanel_Easy_version_mismatch_{{ nspanel_name }}
              continue_on_error: true
          - alias: Blueprint version not detected
            conditions:
            - "{{\n  versions.blueprint | length < 8\n  or is_number(versions.blueprint)\n
              \ or versions.blueprint != blueprint_version\n}}"
            sequence:
            - action: persistent_notification.create
              data:
                notification_id: NSPanel_Easy_version_mismatch_{{ nspanel_name }}
                title: NSPanel Easy - Communication Issue
                message: "The ESPHome firmware is unable to verify the Blueprint version
                  for the NSPanel.\n  - Panel Details: **{{ nspanel_full_name }}**\n\n
                  \ - Reported Blueprint version: {{ versions.blueprint if versions.blueprint
                  | length > 0 else \"Unknown\" }}\n\n  - Current Blueprint version:
                  {{ blueprint_version }}\n\n  - Expected Blueprint version: {{ versions.blueprint_min
                  if versions.blueprint_min | length > 0 else \"Unknown\" }}\n\n\nTroubleshooting
                  steps and more information are available in the online documentation:
                  [Panel startup issues - Blueprint is not detected](https://github.com/edwardtfn/NSPanel-Easy/blob/main/docs/error_initializing.md#blueprint-is-not-detected).\n"
              continue_on_error: true
          - alias: Blueprint version mismatch
            conditions:
            - "{{\n  versions.blueprint | length >= 8\n  and not is_number(versions.blueprint)\n}}"
            - '{{ blueprint_behind_esphome_req }}'
            sequence:
            - action: persistent_notification.create
              data:
                notification_id: NSPanel_Easy_version_mismatch_{{ nspanel_name }}
                title: 'NSPanel Easy - Version mismatch: Blueprint'
                message: "Your NSPanel Easy Blueprint version is outdated.\n- Current
                  Blueprint version: {{ blueprint_version }}\n- Expected version:
                  {{ versions.blueprint_min }}, based on the panel **{{\n    device_attr(nspanel_deviceid,
                  \"name\") ~ ((\" - \" ~ nspanel_name) if nspanel_name != device_attr(nspanel_deviceid,
                  \"name\") else \"\") }}**.\n\n---\n**How to Resolve This Issue**\n1.
                  Navigate to your [Blueprint Dashboard](/config/blueprint/dashboard).\n2.
                  Locate the blueprint named \"**NSPanel Easy Configuration**\".\n3.
                  Click on the corresponding 3-dot menu.\n4. Choose \"**Re-import
                  blueprint**\".\n5. Select the \"**Re-import**\" button.\n6. Navigate
                  to [YAML configuration reloading dashboard](/developer-tools/yaml).\n7.
                  Select \"**Automations**\" to reload the automations.\n\n*For more
                  detailed instructions, please refer to the online documentation:
                  [How to Update Blueprint](https://github.com/edwardtfn/NSPanel-Easy/blob/main/docs/howto.md#update-blueprint).*\n"
              continue_on_error: true
          - alias: TFT is older than expected
            conditions:
            - '{{ versions.tft > 0 }}'
            - '{{ versions.tft_min > 0 }}'
            - '{{ versions.tft_min > versions.tft }}'
            sequence:
            - choose:
              - alias: TFT Upload add-on missing
                conditions:
                - '{{ nspanel_event.upload_tft_installed is defined }}'
                - '{{ not (nspanel_event.upload_tft_installed | bool) }}'
                sequence:
                - action: persistent_notification.create
                  data:
                    notification_id: NSPanel_Easy_version_mismatch_{{ nspanel_name
                      }}
                    title: 'NSPanel Easy - Version mismatch: Missing TFT upload add-on'
                    message: 'The TFT version on your NSPanel is outdated for the
                      panel **{{ nspanel_full_name }}**, and you don''t have installed
                      the add-on TFT Upload required to fix this.

                      - Current TFT version: {{ nspanel_event.tft }}

                      - Expected version: {{ versions.tft_min }}

                      ---

                      To resolve this issue, please flash your device including the
                      add-on Upload TFT. For instructions, please [click here](https://github.com/edwardtfn/NSPanel-Easy/blob/main/docs/addon_upload_tft.md).

                      '
                  continue_on_error: true
              - alias: TFT Upload auto-upload enabled
                conditions:
                - '{{ nspanel_event.upload_tft_installed is defined }}'
                - '{{ nspanel_event.upload_tft_installed | bool }}'
                - '{{ nspanel_event.upload_tft_auto is defined }}'
                - '{{ nspanel_event.upload_tft_auto | bool }}'
                sequence:
                - action: persistent_notification.create
                  data:
                    notification_id: NSPanel_Easy_version_mismatch_{{ nspanel_name
                      }}
                    title: 'NSPanel Easy - Version mismatch: TFT display'
                    message: 'The TFT version on your NSPanel is outdated for the
                      panel **{{ nspanel_full_name }}**.

                      - Current TFT version: {{ nspanel_event.tft }}

                      - Expected version: {{ versions.tft_min }}

                      ---

                      Your panel is set to auto-update the TFT. {%- if nspanel_event.upload_tft_wait_ms
                      is defined -%} The update will start approximately {{ (nspanel_event.upload_tft_wait_ms
                      | int / 1000) | round(0) | int }} seconds after boot. {%- endif
                      -%}

                      You can also press "**Update TFT Display**" on the [device page](/config/devices/device/{{
                      nspanel_deviceid }}) to start the update immediately.

                      If this message persists after the update completes, please
                      report an [issue on GitHub](https://github.com/edwardtfn/NSPanel-Easy/issues).

                      '
                  continue_on_error: true
              default:
              - action: persistent_notification.create
                data:
                  notification_id: NSPanel_Easy_version_mismatch_{{ nspanel_name }}
                  title: 'NSPanel Easy - Version mismatch: TFT display'
                  message: 'The TFT version on your NSPanel is outdated for the panel
                    **{{ nspanel_full_name }}**.

                    - Current TFT version: {{ nspanel_event.tft }}

                    - Expected version: {{ versions.tft_min }}

                    ---

                    **How to Resolve This Issue**

                    1. Navigate to the [device page](/config/devices/device/{{ nspanel_deviceid
                    }}).

                    2. In the "**Configuration**" section, find the option labeled
                    "**Update TFT Display - Model**".

                    3. Click "**Update TFT Display**" to initiate the update process.

                    4. Please wait patiently until your panel restarts, indicating
                    the update is complete.


                    *For more detailed instructions, please refer to the online documentation:
                    [How to Update TFT](https://github.com/edwardtfn/NSPanel-Easy/blob/main/docs/howto.md#update-tft).*

                    '
                continue_on_error: true
      - alias: Other events
        conditions:
        - '{{ nspanel_event.type == "generic" }}'
        sequence:
        - choose:
          - alias: light settings
            conditions:
            - '{{ nspanel_event.page == pages.light }}'
            - '{{ nspanel_event.component in ["rgb_color", "brightness_pct", "color_temp_kelvin"]
              }}'
            - '{{ nspanel_event.entity is defined and nspanel_event.entity is string
              and nspanel_event.entity | length > 0 }}'
            sequence:
            - action: light.turn_on
              data:
                entity_id: '{{ nspanel_event.entity }}'
                '{{ nspanel_event.component }}': '{{ nspanel_event.value }}'
              continue_on_error: true
          - alias: Jump to climate page
            conditions:
            - '{{ nspanel_event.page == pages.home }} '
            - '{{ nspanel_event.component == "climate" }}'
            - '{{ nspanel_event.value == "release" }}'
            - '{{ climate | length > 0 }} '
            sequence:
            - variables:
                entity_id: '{{ climate }}'
                back_page: '{{ pages.home }}'
            - *id005
            - *id013
  - alias: Automation reloaded
    conditions:
    - condition: trigger
      id:
      - automation_reloaded
      - ha_started
    sequence:
    - variables:
        nextion_inited: binary_sensor.{{ nspanel_name }}_nextion_display
    - delay: '{% set entities_list = states.binary_sensor | selectattr("entity_id",
        "search", "nextion_display") | map(attribute="entity_id") | list %} {{ (4
        * entities_list.index(nextion_inited)) if (entities_list | count > 0 and nextion_inited
        in entities_list) else 0 }}

        '
    - if: '{{ states.sensor | selectattr("entity_id", "eq", currentpage) | list |
        count > 0 }}'
      then:
      - action: persistent_notification.dismiss
        data:
          notification_id: NSPanel_Easy_current_page_missing_{{ nspanel_name }}
        continue_on_error: true
      else:
      - action: persistent_notification.create
        data:
          notification_id: NSPanel_Easy_current_page_missing_{{ nspanel_name }}
          title: NSPanel sensor unavailable
          message: "The sensor \"Current Page\" (`{{ currentpage }}`) is unavailable.\n-
            Panel: {{ device_attr(nspanel_deviceid, \"name\") ~ (\" (\" ~ nspanel_name
            ~ \")\") if nspanel_name != device_attr(nspanel_deviceid, \"name\") }}\n-
            Blueprint version: {{ blueprint_version }}\n- Sensor's expected entity_id:
            {{ currentpage }}\n\nHow to fix this:\n\n  1. Go to the [device page](/config/devices/device/{{
            nspanel_deviceid }})\n\n  2. Find the sensor \"Current page\" under the
            \"Sensors\" area (it might be in the \"sensors not shown\" group)\n\n
            \ 3. Enable the sensor\n\n  4. Wait a bit until the sensor starts providing
            a value (it shouldn't take more than half minute)\n\n  5. Go to [Developer
            Tools](/developer-tools/yaml) and click the button \"Automations\" to
            reload your automations\n"
        continue_on_error: true
    - *id017
    - choose:
      - conditions: '{{ pages.current == pages.home }}'
        sequence: *id018
      - conditions: '{{ pages.current in pages.buttonpages }}'
        sequence: *id019
      - conditions: '{{ pages.current in pages.entitypages }}'
        sequence: *id020
  - alias: Update button's entities
    conditions:
    - condition: trigger
      id: trigger_buttonpage_state
    - '{{ trigger.to_state.state not in enum.states.unknown }}'
    - condition: or
      conditions:
      - '{{ pages.current in pages.buttonpages }}'
      - '{{ pages.current in [pages.light, pages.cover, pages.climate, pages.fan,
        pages.alarm] }}'
      - '{{ detailed_entity | length > 0 and trigger.entity_id == states(detailed_entity)
        }}'
    sequence:
    - variables:
        detailed_entity_state: '{{ states(detailed_entity) if detailed_entity | length
          > 0 else "" }}'
    - choose:
      - alias: Alarm page
        conditions:
        - '{{ pages.current == pages.alarm }}'
        - '{{ trigger.entity_id is match "alarm_control_panel." }}'
        - '{{ trigger.entity_id == detailed_entity_state }}'
        sequence: *id021
      - alias: Button page
        conditions:
        - '{{ pages.current == pages.button }}'
        - '{{ trigger.entity_id.split(".") | count == 2 }}'
        - '{{ trigger.entity_id.split(".")[0] in ["button", "input_button"] }}'
        - '{{ trigger.entity_id == detailed_entity_state }}'
        sequence: *id022
      - alias: Buttons pages
