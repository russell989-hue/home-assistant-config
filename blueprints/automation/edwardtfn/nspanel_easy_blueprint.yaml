          description: Icon which should be displayed (Default mdi:email).
          default: mdi:email
          selector:
            icon: {}
        home_button04_icon_color01:
          name: Home page - Notification read - Icon color
          description: Icon color which should be displayed.
          default:
          - 200
          - 204
          - 200
          selector:
            color_rgb: {}
        home_button04_icon_color02:
          name: Home page - Notification unread - Icon color
          description: Icon color which should be displayed.
          default:
          - 248
          - 0
          - 0
          selector:
            color_rgb: {}
    screensaver_settings:
      name: Screensaver (optional)
      icon: mdi:sleep
      description: Select how your panel will behave while sleeping.
      collapsed: true
      input:
        screensaver_display_time:
          name: Screen saver - Display time
          description: 'Enable the display of time while sleeping (screensaver).


            **Important!**

            1. *Keeping the display always "on" may increase the temperature on your
            panel, requiring adjustments on the **Temperature correction** control
            to keep consistence with the environment temperature.*

            2. *Please set **Display Brightness Sleep** accordingly under the device''s
            page (Settings > Devices & Services > ESPHome) to have the text visible.*

            '
          default: false
          selector:
            boolean: {}
        screensaver_display_time_font_size:
          name: Screen saver - Display time font size
          description: 'Font size to be used when displaying the time while sleeping
            (screensaver).

            ***ATTENTION!!** Some fonts may be limited by unavailable language chars
            or space in the screen. Please fall back to the default size if you have
            issues.*

            '
          default: '6'
          selector:
            select:
              multiple: false
              options:
              - label: 72px (default)
                value: '6'
              - label: 112px
                value: '11'
              - label: 192px
                value: '12'
              sort: false
              custom_value: false
        screensaver_display_time_font_color:
          name: Screen saver - Display time font color
          description: Font color to be used when displaying the time while sleeping
            (screensaver).
          default:
          - 64
          - 64
          - 64
          selector:
            color_rgb: {}
        screensaver_background_color:
          name: Screen saver - Background color
          description: Background color to be used while sleeping (screensaver).
          default:
          - 0
          - 0
          - 0
          selector:
            color_rgb: {}
        wake_up_sensors:
          name: Wake-up sensors
          description: '`Optional`

            Select sensors to wake up the panel when the sensor turns `On`.

            **Important:** Requires `include_action_wake_up: true` in your panel''s
            ESPHome YAML substitutions.'
          default: []
          selector:
            entity:
              multiple: true
              filter:
              - domain:
                - binary_sensor
                device_class:
                - door
                - garage_door
                - lock
                - motion
                - occupancy
                - opening
                - smoke
                - sound
                - vibration
                - window
              reorder: false
    media_player_settings:
      name: Media player (optional)
      icon: mdi:movie-cog
      collapsed: true
      input:
        media_player_update_interval:
          name: Media player - Update interval
          description: 'Interval (msec) to call for an update from the media player
            entity while the Media Player page is open. Each poll forces Home Assistant
            to refresh the entity, which for polled integrations (Spotify, Sonos,
            etc.) means a real API call to the upstream service. Lower values improve
            responsiveness but increase load on both Home Assistant and the media
            service; higher values reduce load but the Media Player page can be laggy.

            '
          default: 5000
          selector:
            number:
              min: 500.0
              max: 60000.0
              unit_of_measurement: milliseconds
              step: 1.0
              mode: slider
        media_player_update_delay:
          name: Media player - Delay (msec) after entity updade call?
          default: 500
          selector:
            number:
              min: 0.0
              max: 5000.0
              unit_of_measurement: milliseconds
              step: 1.0
              mode: slider
    advanced_settings:
      name: Advanced settings (optional)
      icon: mdi:cogs
      collapsed: true
      input:
        value_hide_when_zero:
          name: Values - Hide when zero
          description: When enabled, entity states that round to `0` (and their icons)
            are hidden from the display. Only applies to numeric states.
          default: false
          selector:
            boolean: {}
        icon_color_fallback_on:
          name: Icon fallback color when state is "**ON**"
          description: '*General*

            *Which default color should be used for icons when the state is **ON**
            while a custom color is not selected and the domain does not provides
            a state-based color?*

            '
          default:
          - 200
          - 204
          - 200
          selector:
            color_rgb: {}
        icon_color_fallback_off:
          name: Icon fallback color when state is "**OFF**"
          description: '*General*

            *Which default color should be used fo icons when the state is **OFF**?*

            '
          default:
          - 92
          - 92
          - 92
          selector:
            color_rgb: {}
        button_back_font_size:
          name: Back/Close Button Icon Size
          description: '`Optional`

            Select the size of the icon displayed on the Back/Close button in the
            top-right corner of each page.'
          default: '8'
          selector:
            select:
              multiple: false
              options:
              - label: 24px
                value: '7'
              - label: 32px
                value: '8'
              - label: 48px
                value: '10'
              sort: false
              custom_value: false
        delay:
          name: Command Delay
          description: 'Small delay between sequential Home Assistant action calls
            to the panel. Helps ensure ordering when many calls are dispatched in
            quick succession. The Nextion-side command pacer handles display buffer
            protection, so this value can usually stay low. Increase only if you observe
            missing or out-of-order commands on busy networks.

            '
          default: 10
          selector:
            number:
              min: 0.0
              max: 25.0
              step: 1.0
              unit_of_measurement: milliseconds
              mode: box
        delay_boot:
          name: Command Delay During Boot
          description: 'Delay between sequential Home Assistant service calls to the
            panel during the boot sequence. Boot involves a large burst of commands
            (settings, icons, component initialization), so a slightly higher value
            than the runtime delay is a safe default. The default of 50 ms works well
            for most setups. Values above 100 ms are rarely needed.

            '
          default: 50
          selector:
            number:
              min: 0.0
              max: 250.0
              step: 1.0
              unit_of_measurement: milliseconds
              mode: box
        domain_automation_button_action:
          name: System settings - Button action for automation entities
          description: 'Select the button action when associated to `automation.xxx`
            entities.

            ***Toggle:** Enable/disable the automation (default).*

            ***Trigger:** Run the automation (ignoring conditions).*

            '
          default: toggle
          selector:
            select:
              multiple: false
              options:
              - label: Toggle (default)
                value: toggle
              - label: Trigger
                value: trigger
              sort: false
              custom_value: false
        device_name_override:
          name: Device Name Override (Optional)
          description: '**USE WITH CAUTION**

            Manually specify the device name used to construct entity IDs (e.g., `sensor.DEVICENAME_temperature`).

            This overrides the automatic device name detection. Only use if you know
            the exact device name used in your ESPHome configuration.

            **Requirements:** - Must match the ESPHome device name exactly (case-sensitive
            before sanitization) - Will be sanitized: special characters replaced
            with `_`, converted to lowercase - Leave empty to use automatic detection

            **Example:** If your ESPHome device is named `NSPanel Kitchen`, enter
            `NSPanel Kitchen` here. It will be converted to `nspanel_kitchen` for
            entity IDs.

            '
          default: ''
          selector:
            text:
              multiline: false
              multiple: false
              type: text
mode: parallel
max: 50
trigger_variables:
  nspanel_deviceid: !input nspanel_name
  device_name_override: !input device_name_override
  nspanel_entities: '{{ device_entities(nspanel_deviceid) }}'
  device_name: "{%- if device_name_override is string and device_name_override | length
    > 0 %}\n  {{ device_name_override | regex_replace(\"[^a-zA-Z0-9]\", \"_\") | regex_replace(\"_+\",
    \"_\") | lower }}\n{%- else %}\n  {%- set display_entities = nspanel_entities
    | selectattr(None, \"search\", \"_nextion_display\") | list %}\n  {%- if display_entities
    | count > 0 %}\n    {%- set entity_first = display_entities | first %}\n    {%-
    set entity_parts = entity_first.split(\".\") %}\n    {%- set entity_parts_last
    = entity_parts | list | last %}\n    {%- set name_parts = entity_parts_last.split(\"_nextion_display\")
    %}\n    {%- set name_parts_first = name_parts | first %}\n    {{ name_parts_first
    }}\n  {%- else %}\n    {{ nspanel_deviceid | default(\"nspanel\") | string | regex_replace(\"[^a-zA-Z0-9]\",
    \"_\") | regex_replace(\"_+\", \"_\") | lower }}\n  {%- endif %}\n{%- endif %}\n"
  device_name_sensor: "{{\n  nspanel_entities | selectattr(None, \"search\", \"sensor.*_device_name\")
    | list | last\n  if nspanel_entities | selectattr(None, \"search\", \"sensor.*_device_name\")
    | list | count > 0\n  else (\"sensor.\" ~ device_name ~ \"_device_name\")\n}}\n"
  relay01_entity: "{{\n  nspanel_entities | selectattr(None, \"search\", \"switch.*_relay_1\")
    | list | last\n  if nspanel_entities | selectattr(None, \"search\", \"switch.*_relay_1\")
    | list | count > 0\n  else (\"switch.\" ~ device_name ~ \"_relay_1\")\n}}\n"
  relay02_entity: "{{\n  nspanel_entities | selectattr(None, \"search\", \"switch.*_relay_2\")
    | list | last\n  if nspanel_entities | selectattr(None, \"search\", \"switch.*_relay_2\")
    | list | count > 0\n  else (\"switch.\" ~ device_name ~ \"_relay_2\")\n}}\n"
  currentpage: "{{\n  nspanel_entities | selectattr(None, \"search\", \"sensor.*_current_page\")
    | list | last\n  if nspanel_entities | selectattr(None, \"search\", \"sensor.*_current_page\")
    | list | count > 0\n  else (\"sensor.\" ~ device_name ~ \"_current_page\")\n}}\n"
  nspaneltemp: "{{\n  nspanel_entities | selectattr(None, \"search\", \"sensor.*_temperature\")
    | list | last\n  if nspanel_entities | selectattr(None, \"search\", \"sensor.*_temperature\")
    | list | count > 0\n  else (\"sensor.\" ~ device_name ~ \"_temperature\")\n}}\n"
  thermostat_embedded: "{{\n  nspanel_entities | selectattr(None, \"search\", \"climate.*_thermostat\")
    | list | last\n  if nspanel_entities | selectattr(None, \"search\", \"climate.*_thermostat\")
    | list | count > 0\n  else (\"climate.\" ~ device_name ~ \"_thermostat\")\n}}\n"
  utilities_line_reference:
    page01:
      main: !input utilities_page01_main_line_reference
      group01: !input utilities_page01_group01_line_reference
      group02: !input utilities_page01_group02_line_reference
      group03: !input utilities_page01_group03_line_reference
      group04: !input utilities_page01_group04_line_reference
      group05: !input utilities_page01_group05_line_reference
      group06: !input utilities_page01_group06_line_reference
  sun_state_list: "{{\n  (\n    states.sun\n    | map(attribute=\"state\")\n    |
    list\n  )\n  if states.sun | length > 0\n  else []\n}}\n"
  sun_is_up: "{{\n  sun_state_list | first == \"above_horizon\"\n  if sun_state_list
    | length > 0\n  else true\n}}\n"
