            - variables:
                climate_entity_id_valid: '{{ climate is string and climate is match
                  "climate." }}'
                climate_friendly_name: '{{ state_attr(climate, "friendly_name") if
                  climate_entity_id_valid else "" }}'
            - action: esphome.{{ nspanel_name }}_component_val
              data:
                page: mem
                id: is_climate
                val: '{{ 1 if climate_entity_id_valid else 0 }}'
              continue_on_error: true
            - *id003
            - alias: Climate friendly name
              if:
              - '{{ climate == thermostat_embedded }}'
              - '{{ climate_entity_id_valid }}'
              - '{{ state_attr(climate, "friendly_name") | string | length > 0 }}'
              then:
              - action: esphome.{{ nspanel_name }}_component_text_list
                data:
                  page: mem
                  id: addon_climate_friendly_name
                  txt_list:
                  - '{{ climate_friendly_name if climate_friendly_name is string else
                    "" }}'
                continue_on_error: true
              - *id003
            - alias: Embedded climate
              sequence:
              - action: esphome.{{ nspanel_name }}_component_val
                data:
                  page: mem
                  id: embedded_climate
                  val: '{{ 1 if climate == thermostat_embedded else 0 }}'
                continue_on_error: true
              - *id003
            - alias: Embedded indoor temperature
              sequence:
              - action: esphome.{{ nspanel_name }}_component_val
                data:
                  page: mem
                  id: embedded_indoor_temperature
                  val: '{{ 1 if embedded_indoor_temperature else 0 }}'
                continue_on_error: true
              - *id003
          - alias: Climate page
            sequence:
            - variables:
                climate_page_button_font_size: !input climate_page_button_font_size
            - alias: climate_page_button_font_size
              action: esphome.{{ nspanel_name }}_component_val
              data:
                page: climate
                id: button_font
                val: '{{ climate_page_button_font_size | int(8) }}'
              continue_on_error: true
            - *id003
          - alias: HW Buttons settings
            sequence:
            - action: esphome.{{ nspanel_name }}_component_color
              data:
                page: mem
                id: button_bar_color_on
                color: !input hw_buttons_bar_color_on
              continue_on_error: true
            - *id003
            - action: esphome.{{ nspanel_name }}_component_color
              data:
                page: mem
                id: button_bar_color_off
                color: !input hw_buttons_bar_color_off
              continue_on_error: true
            - *id003
            - action: esphome.{{ nspanel_name }}_component_val
              data:
                page: mem
                id: button_left
                val: "{{\n  hardware.buttons.left.bar_always_visible or\n  hardware.buttons.left.state_entity_is_valid
                  or\n  hardware.buttons.left.entity_is_valid\n}}\n"
              continue_on_error: true
            - *id003
            - action: esphome.{{ nspanel_name }}_component_val
              data:
                page: mem
                id: button_right
                val: "{{\n  hardware.buttons.right.bar_always_visible or\n  hardware.buttons.right.state_entity_is_valid
                  or\n  hardware.buttons.right.entity_is_valid\n}}\n"
              continue_on_error: true
            - *id003
            - alias: hw_buttons_bars_pages
              sequence:
              - variables:
                  hw_buttons_bars_pages: !input hw_buttons_bars_pages
              - action: esphome.{{ nspanel_name }}_component_val
                data:
                  page: mem
                  id: buttons_bars_pages
                  val: '{{ hw_buttons_bars_pages | map("int") | sum }}'
                continue_on_error: true
              - *id003
            - alias: Update Hardware buttons bars states
              sequence:
              - variables:
                  hw_btn_left_state: "{{ (states(hardware.buttons.left.state_entity)
                    | default(\"unavailable\")\n  if hardware.buttons.left.state_entity_is_valid\n
                    \ else (states(hardware.buttons.left.entity) | default(\"unavailable\")\n
                    \   if hardware.buttons.left.entity_is_valid else \"unavailable\"))
                    in enum.states.on }}\n"
                  hw_btn_right_state: "{{ (states(hardware.buttons.right.state_entity)
                    | default(\"unavailable\")\n  if hardware.buttons.right.state_entity_is_valid\n
                    \ else (states(hardware.buttons.right.entity) | default(\"unavailable\")\n
                    \   if hardware.buttons.right.entity_is_valid else \"unavailable\"))
                    in enum.states.on }}\n"
              - action: esphome.{{ nspanel_name }}_component_val
                data:
                  page: mem
                  id: hw_bt_left
                  val: '{{ 1 if hw_btn_left_state else 0 }}'
                continue_on_error: true
              - *id003
              - action: esphome.{{ nspanel_name }}_component_val
                data:
                  page: mem
                  id: hw_bt_right
                  val: '{{ 1 if hw_btn_right_state else 0 }}'
                continue_on_error: true
              - *id003
          - alias: Global settings - Decimal separator
            sequence:
            - action: esphome.{{ nspanel_name }}_component_text_list
              data:
                page: mem
                id: decimal_separator
                txt_list:
                - !input decimal_separator
              continue_on_error: true
            - *id003
            - action: esphome.{{ nspanel_name }}_component_text_list
              data:
                page: mem
                id: temp_unit
                txt_list:
                - !input temperature_unit
              continue_on_error: true
            - *id003
            - action: esphome.{{ nspanel_name }}_component_val
              data:
                page: mem
                id: button_back_font
                val: !input button_back_font_size
              continue_on_error: true
            - *id003
          - alias: Entity pages alignment
            sequence:
            - variables:
                entitypages_value_alignment: !input entitypages_value_alignment
            - action: esphome.{{ nspanel_name }}_component_val
              data:
                page: mem
                id: ent_value_xcen
                val: '{{ int(entitypages_value_alignment) if is_number(entitypages_value_alignment)
                  else 0 }}'
              continue_on_error: true
            - *id003
          - alias: Screensaver settings
            sequence:
            - variables:
                screensaver_display_time: !input screensaver_display_time
                screensaver_time_font: !input screensaver_display_time_font_size
            - action: esphome.{{ nspanel_name }}_component_val
              data:
                page: mem
                id: screensaver_display_time
                val: '{{ 1 if screensaver_display_time else 0 }}'
              continue_on_error: true
            - *id003
            - action: esphome.{{ nspanel_name }}_component_val
              data:
                page: mem
                id: screensaver_time_font
                val: '{{ int(screensaver_time_font) }}'
              continue_on_error: true
            - *id003
            - action: esphome.{{ nspanel_name }}_component_color
              data:
                page: mem
                id: screensaver_bco
                color: !input screensaver_background_color
              continue_on_error: true
            - *id003
            - action: esphome.{{ nspanel_name }}_component_color
              data:
                page: mem
                id: screensaver_pco
                color: !input screensaver_display_time_font_color
              continue_on_error: true
            - *id003
          - alias: Disable empty buttons pages
            repeat:
              for_each: '{{ pages.buttonpages }}'
              sequence:
              - action: esphome.{{ nspanel_name }}_command
                data:
                  cmd: "{% set ns = namespace(mask=0) %} {% for btn in buttons_pages.buttons\n
                    \     | selectattr(\"page\", \"eq\", repeat.item)\n      | selectattr(\"entity\",
                    \"defined\")\n      | rejectattr(\"entity\", \"eq\", []) %}\n
                    \ {% set slot = btn.component | replace(\"button\", \"\") | int
                    - 1 %}\n  {% set ns.mask = ns.mask + (2 ** slot) %}\n{% endfor
                    %} is_{{ repeat.item }}={{ ns.mask }}\n"
                continue_on_error: true
              - *id003
          - alias: Disable empty entity pages
            repeat:
              for_each: '{{ pages.entitypages }}'
              sequence:
              - action: esphome.{{ nspanel_name }}_command
                data:
                  cmd: "is_{{ repeat.item }}={{\n  1\n  if\n    entities_pages.entities\n
                    \   | selectattr(\"page\", \"defined\")\n    | selectattr(\"page\",
                    \"eq\", repeat.item)\n    | selectattr(\"entity\", \"defined\")\n
                    \   | rejectattr(\"entity\", \"eq\", [])\n    | list\n    | count
                    > 0\n  else 0\n}}\n"
                continue_on_error: true
              - *id003
          - alias: Entity pages button visibility
            action: esphome.{{ nspanel_name }}_component_val
            data:
              page: mem
              id: is_entitypages
              val: "{{\n  entities_pages.entities\n  | selectattr(\"entity\", \"defined\")\n
                \ | rejectattr(\"entity\", \"eq\", [])\n  | list\n  | count\n}}"
            continue_on_error: true
      - alias: NSPanel action call
        conditions:
        - '{{ nspanel_event.type == "action_call" }}'
        - '{{ nspanel_event.action is defined and nspanel_event.action is string and
          nspanel_event.action | length > 0 }}'
        - '{{ nspanel_event.action.split(".") | count == 2 }}'
        - '{{ nspanel_event.action.split(".")[0] | length > 0 and nspanel_event.action.split(".")[0]
          not in ["null", None] }}'
        - '{{ nspanel_event.action.split(".")[1] | length > 0 and nspanel_event.action.split(".")[1]
          not in ["null", None] }}'
        - '{{ nspanel_event.action | length > (2+nspanel_event.action.index("."))
          }}'
        - '{{ nspanel_event.action is not match "alarm_control_panel." }}'
        - '{{ nspanel_event.entity is defined and nspanel_event.entity is string and
          nspanel_event.entity | length > 0 }}'
        sequence:
        - if: '{{ nspanel_event.key is defined and nspanel_event.key is string and
            nspanel_event.key | length > 0 }}'
          then:
          - choose:
            - alias: climate.set_temperature
              conditions:
              - '{{ nspanel_event.action == "climate.set_temperature" }}'
              - '{{ nspanel_event.key in ["target_temp_high", "target_temp_low"] }}'
              sequence:
              - variables:
                  target_temp_low: "{{\n  nspanel_event.value\n  if nspanel_event.value
                    is defined and nspanel_event.key == \"target_temp_low\"\n  else
                    state_attr(nspanel_event.entity, \"target_temp_low\") | int(-999)\n}}\n"
                  target_temp_high: "{{\n  nspanel_event.value\n  if nspanel_event.value
                    is defined and nspanel_event.key == \"target_temp_high\"\n  else
                    state_attr(nspanel_event.entity, \"target_temp_high\") | int(-999)\n}}\n"
              - condition:
                - '{{ is_number(target_temp_low) and target_temp_low > -999 }}'
                - '{{ is_number(target_temp_high) and target_temp_high > -999 }}'
              - action: '{{ nspanel_event.action }}'
                data:
                  target_temp_low: '{{ target_temp_low }}'
                  target_temp_high: '{{ target_temp_high }}'
                target:
                  entity_id: '{{ nspanel_event.entity }}'
                continue_on_error: true
            - alias: fan.oscillate
              conditions:
              - '{{ nspanel_event.action == "fan.oscillate" }}'
              - '{{ nspanel_event.key == "oscillating" }}'
              sequence:
              - variables:
                  oscillating: '{{ state_attr(nspanel_event.entity, "oscillating")
                    | default(true) }}'
              - action: '{{ nspanel_event.action }}'
                data:
                  oscillating: '{{ true if oscillating is boolean and not oscillating
                    else false }}'
                target:
                  entity_id: '{{ nspanel_event.entity }}'
                continue_on_error: true
            - alias: fan.turn_on
              conditions:
              - '{{ nspanel_event.action == "fan.turn_on" }}'
              - '{{ nspanel_event.key == "percentage" }}'
              - '{{ nspanel_event.value is defined }}'
              sequence:
              - action: '{{ nspanel_event.action }}'
                data: {}
                target:
                  entity_id: '{{ nspanel_event.entity }}'
                continue_on_error: true
              - delay:
                  milliseconds: 100
              - variables:
                  percentage_srv: fan.set_percentage
              - action: '{{ percentage_srv }}'
                data:
                  percentage: '{{ nspanel_event.value }}'
                target:
                  entity_id: '{{ nspanel_event.entity }}'
                continue_on_error: true
            - alias: light.turn_on (rgb_color)
              conditions:
              - '{{ nspanel_event.action == "light.turn_on" }}'
              - '{{ nspanel_event.key == "rgb_color" }}'
              - '{{ nspanel_event.red is defined and nspanel_event.green is defined
                and nspanel_event.blue is defined }}'
              sequence:
              - action: '{{ nspanel_event.action }}'
                data:
                  rgb_color: '{{ [nspanel_event.red, nspanel_event.green, nspanel_event.blue]
                    }}'
                target:
                  entity_id: '{{ nspanel_event.entity }}'
                continue_on_error: true
            default:
            - condition:
              - '{{ nspanel_event.action is defined }}'
              - '{{ nspanel_event.key is defined }}'
              - '{{ nspanel_event.value is defined }}'
              - '{{ nspanel_event.entity is defined }}'
            - variables:
                call_data: '{{ {nspanel_event.key: nspanel_event.value} }}'
            - action: '{{ nspanel_event.action }}'
              data: '{{ call_data }}'
              target:
                entity_id: '{{ nspanel_event.entity }}'
              continue_on_error: true
          else:
          - condition:
            - '{{ nspanel_event.action is defined }}'
            - '{{ nspanel_event.entity is defined }}'
          - action: '{{ nspanel_event.action }}'
            target:
              entity_id: '{{ nspanel_event.entity }}'
            continue_on_error: true
        - delay:
            milliseconds: '{{ media_player_update_delay }}'
        - condition:
          - '{{ nspanel_event.entity is defined }}'
        - action: homeassistant.update_entity
          data:
            entity_id: '{{ nspanel_event.entity }}'
          continue_on_error: true
      - alias: Page changed
        conditions:
        - '{{ nspanel_event.type == "page_changed"}}'
        - '{{ nspanel_event.page is defined }}'
        sequence:
        - choose:
          - alias: Home page
            conditions: '{{ nspanel_event.page == pages.home }}'
            sequence: &id018
            - variables:
                page_constructor: true
            - &id043
              action: esphome.{{ nspanel_name }}_component_val
              data:
                page: mem
                id: weather_pic
                val: "{{\n  nextion.pic.weather[\n    states(weather_entity) | default(\"unavailable\")\n
                  \   if weather_entity is string and has_value(weather_entity)\n
                  \   else \"unavailable\"\n  ] | default(1)\n}}"
              continue_on_error: true
            - *id004
            - &id042
              alias: Home page - Outdoor temp
              continue_on_error: true
              sequence:
              - variables:
                  outdoortemp_tmp: !input outdoortemp
                  outdoor_temp_entity: "{% if outdoortemp_tmp is defined\n    and
                    outdoortemp_tmp is list\n    and (outdoortemp_tmp | count > 0)\n
                    \   and (outdoortemp_tmp[0] is string) %}\n  {{ outdoortemp_tmp[0]
                    }}\n{% elif outdoortemp_tmp is defined\n    and outdoortemp_tmp
                    is string\n    and outdoortemp_tmp | length > 0 %}\n  {{ outdoortemp_tmp
                    }}\n{% else %}\n  {{ \"\" }}\n{% endif %}\n"
                  outdoor_temp_entity_valid: "{{\n  outdoor_temp_entity is string
                    and\n  outdoor_temp_entity is match \"sensor.\"\n}}\n"
                  outdoor_temp: "{%- if outdoor_temp_entity_valid and has_value(outdoor_temp_entity)
                    -%}\n  {%- set with_units = states(outdoor_temp_entity, rounded=True,
                    with_unit=True) -%}\n  {%- set without_units = states(outdoor_temp_entity,
                    rounded=True, with_unit=False) -%}\n  {%- if with_units == without_units
                    or not is_number(without_units) -%}\n    {{ with_units }}\n  {%-
                    else -%}\n    {%- set unit = with_units.split(without_units)[1]
                    | trim -%}\n    {{ without_units ~ units_separator ~ unit }}\n
                    \ {%- endif -%}\n{%- elif weather_entity is string and\n          weather_entity.split(\".\")
                    | count == 2 and\n          weather_entity.split(\".\")[0] ==
                    \"weather\" -%}\n  {%- set temp_from_weather = state_attr(weather_entity,
                    \"temperature\") -%}\n  {%- if is_number(temp_from_weather) -%}\n
                    \   {{\n      (\n        (temp_from_weather | float)\n        |
                    round(0 if weather_temp_units in [\"F\", \"f\", \"°F\", \"°f\"]
                    else 1)\n      ) ~ units_separator ~ weather_temp_units\n    }}\n
                    \ {%- else -%}\n    {{ \"\" }}\n  {%- endif -%}\n{%- else -%}\n
                    \ {{ \"\" }}\n{%- endif -%}"
                  outdoor_temp_trimmed: "{%- if compact_unit_display -%}\n  {{ outdoor_temp
                    | trim }}\n{%- else -%}\n  {{ outdoor_temp | regex_replace('\\s+',
                    ' ') | trim }}\n{%- endif -%}"
              - condition: '{{ outdoor_temp_trimmed != '''' }}'
              - action: esphome.{{ nspanel_name }}_component_text_list
                data:
                  page: home
                  id: outdoor_temp
                  txt_list:
                  - '{{ outdoor_temp_trimmed }}'
                continue_on_error: true
              - *id004
            - &id041
              alias: Home page - Indoor temperature
              sequence:
              - variables:
                  home_indoor_temp_visible: !input home_indoor_temp_visible
              - if:
                - '{{ page_constructor is defined and page_constructor }}'
                then:
                - action: esphome.{{ nspanel_name }}_components_visibility
                  data:
                    page: home
                    ids:
                    - indr_temp
                    - indr_temp_icon
                    visible: "{{\n  home_indoor_temp_visible\n  if home_indoor_temp_visible
                      is defined\n  else false\n}}"
                  continue_on_error: true
                - *id004
              - condition:
                - '{{ home_indoor_temp_visible is defined and home_indoor_temp_visible
                  }}'
                - '{{ not embedded_indoor_temperature }}'
                - '{{ has_value(indoor_temperature_sensor) }}'
              - variables:
                  indoor_temp: "{%- if indoor_temperature_sensor.split(\".\")[0] ==
                    \"climate\" -%}\n  {%- set current_temp = state_attr(indoor_temperature_sensor,
                    \"current_temperature\") -%}\n  {%- if is_number(current_temp)
                    -%}\n    {%- set unit = state_attr(indoor_temperature_sensor,
                    \"temperature_unit\") -%}\n    {%- set unit = unit if unit is
                    string and unit | length > 0 else temperature_units -%}\n    {{
                    current_temp | round(1) ~ units_separator ~ unit }}\n  {%- else
                    -%}\n    {{ \"\" }}\n  {%- endif -%}\n{%- else -%}\n  {%- set
                    with_units = states(indoor_temperature_sensor, rounded=True, with_unit=True)
                    -%}\n  {%- set without_units = states(indoor_temperature_sensor,
                    rounded=True, with_unit=False) -%}\n  {%- if with_units == without_units
                    or not is_number(without_units) -%}\n    {{ with_units }}\n  {%-
                    else -%}\n    {%- set unit = with_units.split(without_units)[1]
                    | trim -%}\n    {{ without_units ~ units_separator ~ unit }}\n
                    \ {%- endif -%}\n{%- endif -%}"
                  indoor_temp_trimmed: "{%- if compact_unit_display -%}\n  {{ indoor_temp
                    | trim }}\n{%- else -%}\n  {{ indoor_temp | regex_replace('\\s+',
                    ' ') | trim }}\n{%- endif -%}"
              - condition: '{{ indoor_temp_trimmed != "" }}'
              - action: esphome.{{ nspanel_name }}_component_text_list
                data:
                  page: home
                  id: indr_temp
                  txt_list:
                  - '{{ indoor_temp_trimmed }}'
                continue_on_error: true
            - repeat:
                for_each: '{{ home_page.custom_buttons | list }}'
                sequence: &id040
                - variables:
                    custom_button_entity_id_is_valid: '{{ repeat.item.entity is defined
                      and repeat.item.entity is string and repeat.item.entity.split(".")
                      | count == 2 }}'
                    page_constructor: '{{ page_constructor is defined and page_constructor
                      }}'
                - condition: '{{ custom_button_entity_id_is_valid or page_constructor
                    }}'
                - if: '{{ custom_button_entity_id_is_valid }}'
                  then:
                  - variables:
                      entity_id: '{{ repeat.item.entity }}'
                      overlap:
                        icon: "{{\n  repeat.item.icon\n  if\n    repeat.item.icon
                          is defined and\n    repeat.item.icon is string and\n    repeat.item.icon
                          | length > 0 and\n    repeat.item.icon is match \"mdi:\"
                          and\n    repeat.item.icon.split(\"mdi:\")[1] in all_icons\n
                          \ else\n    None\n}}\n"
                  - *id005
                  - action: esphome.{{ nspanel_name }}_icon
                    data:
                      page: home
                      id: '{{ repeat.item.component }}'
                      icon: '{{ entity.icon if entity.icon is defined else all_icons.blank
                        }}'
                      icon_color: "{{\n  entity.icon_color\n  if entity.icon_color
                        is defined and entity.icon_color is list and entity.icon_color
                        | count == 3\n  else [0, 0, 0]\n}}\n"
                      visible: true
                    continue_on_error: true
                  else:
                  - action: esphome.{{ nspanel_name }}_icon
                    data:
                      page: home
                      id: '{{ repeat.item.component }}'
                      icon: '{{ all_icons.blank }}'
                      icon_color: '{{ [0, 0, 0] }}'
                      visible: false
                    continue_on_error: true
                - *id004
            - &id033
              if: '{{ (not embedded_climate) and climate is string and climate is
                match "climate." }}'
              then:
              - variables:
                  entity_id: '{{ climate }}'
                  overlap:
                    icon: '{{ None }}'
                    icon_color: '{{ None }}'
                    name: '{{ None }}'
              - *id005
              - condition: '{{ entity_id_valid }}'
              - variables:
                  hvac_action: '{{ state_attr(entity_id, "hvac_action") }}'
                  climate_chip_visibility: !input climate_chip_visibility
                  climate_chip_visible: "{{\n  entity_has_value and\n  climate_chip_visibility
                    != 'never' and\n  (\n    climate_chip_visibility == 'always' or\n
                    \   entity_state in [\"heating\", \"cooling\", \"drying\", \"fan_only\"]
                    or\n    (\n      entity_state not in [\"idle\", \"off\"] and\n
                    \     hvac_action in [\"heating\", \"cooling\", \"drying\", \"fan_only\"]\n
                    \   )\n  )\n}}"
              - action: esphome.{{ nspanel_name }}_icon
                data:
                  page: chips
                  id: chip_climate
                  icon: '{{ entity.icon if entity.icon is defined else "" }}'
                  icon_color: "{{\n  entity.icon_color\n  if climate_chip_visible
                    and entity.icon_color is defined\n  else [0, 0, 0]\n}}\n"
                  visible: true
                continue_on_error: true
              - *id004
            - repeat:
                for_each: "{{\n  chips\n  | selectattr(\"entity\", \"defined\")\n
                  \ | rejectattr(\"entity\", \"eq\", [])\n  | list\n}}\n"
                sequence:
                - &id032
                  if: '{{ repeat.item.entity is defined and repeat.item.entity is
                    string and repeat.item.entity.split(".") | count == 2 }}'
                  then:
                  - variables:
                      icon_color_rgb_valid: "{{\n  repeat.item.icon_color_rgb is defined
                        and\n  repeat.item.icon_color_rgb is list and\n  repeat.item.icon_color_rgb
                        | count == 3\n}}\n"
                      entity_id: '{{ repeat.item.entity }}'
                      overlap:
                        icon: "{{\n  repeat.item.icon\n  if\n    repeat.item.icon
                          is defined and\n    repeat.item.icon is string and\n    repeat.item.icon
                          | length > 0 and\n    repeat.item.icon is match \"mdi:\"
                          and\n    repeat.item.icon.split(\"mdi:\")[1] in all_icons\n
                          \ else\n    None\n}}\n"
                        icon_color: '{{ repeat.item.icon_color_rgb if icon_color_rgb_valid
                          else None }}'
                  - *id005
                  - condition: '{{ entity_has_value }}'
                  - variables:
                      entity_hvac_action: '{{ state_attr(entity_id, "hvac_action")
                        | default("") if entity_domain == "climate" else "unknown"
                        }}'
                      entity_state: "{{\n  (entity_hvac_action if entity_hvac_action
                        and entity_hvac_action not in enum.states.unknown else entity_state)\n
                        \ if entity_domain == \"climate\" else entity_state\n}}\n"
                      chip_visible: "{{\n  (\n    (not repeat.item.inverted) and\n
                        \   (\n      (entity_state in enum.states.on) or\n      (entity_domain
                        != \"climate\" and entity_domain in enum.states and entity_state
                        in enum.states[entity_domain].on) or\n      (entity_domain
                        == \"climate\" and entity_state in [\"heating\", \"cooling\",
                        \"drying\", \"fan_only\"])\n    )\n  ) or\n  (\n    (repeat.item.inverted)
                        and\n    (\n      (entity_state in enum.states.off) or\n      (entity_domain
                        in enum.states and entity_state in enum.states[entity_domain].off)
                        or\n      (entity_domain == \"climate\" and entity_state not
                        in [\"heating\", \"cooling\", \"drying\", \"fan_only\"])\n
                        \   )\n  )\n}}\n"
                  - condition: '{{ entity.icon is defined and entity.icon is string
                      and entity.icon | length > 0 }}'
                  - action: esphome.{{ nspanel_name }}_icon
                    data:
                      page: chips
                      id: '{{ repeat.item.component }}'
                      icon: '{{ entity.icon }}'
                      icon_color: "{% if icon_color_rgb_valid %}\n  {{ repeat.item.icon_color_rgb
                        }}\n{% elif entity.icon_color is defined and\n        entity.icon_color
                        is list and\n        entity.icon_color | count == 3 %}\n  {{
                        entity.icon_color }}\n{% else %}\n  [255, 255, 255]\n{% endif
                        %}\n"
                      visible: '{{ chip_visible }}'
                    continue_on_error: true
                  - *id004
            - repeat:
                for_each: "{{\n  home_page.entity_value\n  | selectattr(\"entity\",
                  \"defined\")\n  | rejectattr(\"entity\", \"eq\", \"\")\n  | rejectattr(\"entity\",
                  \"eq\", [])\n  | list\n}}\n"
                sequence:
                - &id008
                  if:
                  - '{{ repeat.item.entity is defined }}'
                  - '{{ repeat.item.entity is string }}'
                  - '{{ repeat.item.entity.split(".") | count == 2 }}'
                  then:
                  - variables:
                      entity_id: '{{ repeat.item.entity }}'
                      default_color: *id002
                      overlap:
                        icon: "{{\n  repeat.item.icon\n  if\n    repeat.item.icon
                          is defined and\n    repeat.item.icon is string and\n    repeat.item.icon
                          is match \"mdi:\" and\n    repeat.item.icon.split(\"mdi:\")[1]
                          in all_icons\n  else\n    None\n}}\n"
                  - *id005
                  - if: '{{ entity_has_value }}'
                    then:
                    - variables:
                        unit_of_measurement_raw: '{{ state_attr(entity_id, "unit_of_measurement")
                          | default("") }}'
                        unit_of_measurement: "{{\n  unit_of_measurement_raw\n  if
                          unit_of_measurement_raw and unit_of_measurement_raw is string
                          and unit_of_measurement_raw | length > 0\n  else \"\"\n}}\n"
                        value_is_zero: "{{\n  is_number(states(entity_id)) and\n  (states(entity_id,
                          rounded=true) | float == 0)\n}}\n"
                    - if: '{{ hide_if_zero is defined and hide_if_zero and value_is_zero
                        }}'
                      then:
                      - action: esphome.{{ nspanel_name }}_components_visibility
                        data:
                          page: '{{ repeat.item.page }}'
                          ids:
                          - '{{ repeat.item.component }}'
                          - '{{ repeat.item.component }}_icon'
                          visible: false
                        continue_on_error: true
                      else:
                      - if: '{{ entity.icon | length > 0 }}'
                        then:
                        - action: esphome.{{ nspanel_name }}_component_text_list
                          data:
                            page: '{{ repeat.item.page }}'
                            id: '{{ repeat.item.component }}_icon'
                            txt_list:
                            - '{{ entity.icon }}'
                          continue_on_error: true
                        - *id004
                      - alias: value_with_unit_and_translations
                        action: esphome.{{ nspanel_name }}_component_text_list
                        data:
                          page: '{{ repeat.item.page }}'
                          id: '{{ repeat.item.component }}'
                          txt_list: &id009
                          - "{{\n  (\n    (\n      states(entity_id, rounded=true)
                            ~ (\n        units_separator ~ unit_of_measurement\n        if
                            unit_of_measurement is string and unit_of_measurement
                            | length > 0\n        else \"\"\n      )\n    )\n    if
                            is_number(entity_state)\n    else state_translated(entity_id)\n
                            \ ) | regex_replace('\\s+', ' ') | trim\n  if entity_id_valid
                            and entity_has_value\n  else \"_{_unavailable_}_\"\n}}\n"
                        continue_on_error: true
                      - *id004
                      - action: esphome.{{ nspanel_name }}_components_visibility
                        data:
                          page: '{{ repeat.item.page }}'
                          ids:
                          - '{{ repeat.item.component }}'
                          - '{{ repeat.item.component }}_icon'
                          visible: true
                        continue_on_error: true
                    else:
                    - action: esphome.{{ nspanel_name }}_component_text_list
                      data:
                        page: '{{ repeat.item.page }}'
                        id: '{{ repeat.item.component }}'
                        txt_list:
                        - _{_unavailable_}_
                      continue_on_error: true
                    - *id004
                    - action: esphome.{{ nspanel_name }}_components_visibility
                      data:
                        page: '{{ repeat.item.page }}'
                        ids:
                        - '{{ repeat.item.component }}'
                        - '{{ repeat.item.component }}_icon'
                        visible: true
                      continue_on_error: true
                  - *id004
          - alias: Button pages
            conditions: '{{ nspanel_event.page in pages.buttonpages }}'
            sequence: &id019
            - &id012
              variables:
                event_page: '{{ nspanel_event.page if nspanel_event is defined and
                  nspanel_event.page is defined else pages.current }}'
                button_pages_icon_size: !input button_pages_icon_size
            - if: '{{ event_page in pages.buttonpages }}'
              then:
              - alias: Button pages label
                if: "{{\n  buttons_pages.labels[event_page] != None and\n  buttons_pages.labels[event_page]
                  != [] and\n  (buttons_pages.labels[event_page] | string) | length
                  > 0\n}}\n"
                then:
                - action: esphome.{{ nspanel_name }}_component_text_list
                  data:
                    page: ''
                    id: page_label
                    txt_list:
                    - '{{ buttons_pages.labels[event_page] | string }}'
                  continue_on_error: true
                - *id004
              - alias: Buttons page - Populate buttons
                repeat:
                  for_each: "{{\n  buttons_pages.buttons\n  | selectattr(\"page\",
                    \"defined\")\n  | selectattr(\"page\", \"eq\", event_page)\n  |
                    selectattr(\"entity\", \"defined\")\n  | rejectattr(\"entity\",
                    \"eq\", [])\n  | list\n}}\n"
                  sequence: &id023
                  - condition: '{{ repeat.item.entity is defined and repeat.item.entity
                      is string and repeat.item.entity | length > 0 }}'
                  - variables:
                      entity_id: '{{ repeat.item.entity }}'
                      overlap:
                        icon: "{{\n  repeat.item.icon\n  if\n    repeat.item.icon
                          is defined and\n    repeat.item.icon is string and\n    repeat.item.icon
                          | length > 0 and\n    repeat.item.icon is match \"mdi:\"
                          and\n    repeat.item.icon.split(\"mdi:\")[1] in all_icons\n
                          \ else\n    None\n}}\n"
                        icon_color: '{{ repeat.item.icon_color_rgb if repeat.item.icon_color_rgb
                          is defined else None }}'
                        name: '{{ repeat.item.name if repeat.item.name is defined
                          else None }}'
                  - *id005
                  - variables:
                      current_entity_state_available: '{{ entity_state not in ["unavailable"]
                        }}'
                      is_page_render: '{{ trigger.id != "trigger_buttonpage_state"
                        }}'
                      btn_state: "{{\n  (entity_state in enum.states.on and entity_domain
                        not in [\"automation\"])\n  or (entity_domain == \"climate\"
                        and entity_state != \"off\")\n  or (entity_domain in [\"automation\",
                        \"button\", \"input_button\", \"remote\", \"scene\", \"script\"]\n
                        \     and not is_page_render\n      and trigger.entity_id
                        == repeat.item.entity)\n}}\n"
                      btn_bri_txt: "{% if not has_value(entity_id) %} 0 {% elif entity_domain
                        == \"light\" and entity_state == \"on\" %}\n  {% set entity_brightness
                        = state_attr(entity_id, \"brightness\") %}\n  {% set entity_brightness_index
                        = entity_brightness/255 if entity_brightness and is_number(entity_brightness)
                        else 0 %}\n  {{ (entity_brightness_index*100) | round(0) }}%\n{%
                        elif entity_domain == \"fan\" and entity_state == \"on\" and
                        state_attr(entity_id, \"percentage\") | int(0) > 0 %}\n  {{
                        state_attr(entity_id, \"percentage\") | round(0, default=0)
                        }}%\n{% elif entity_domain == \"cover\" and entity_state in
                        [\"open\", \"opening\", \"closing\"] and is_number(state_attr(entity_id,
                        \"current_position\")) %}\n  {{ (state_attr(entity_id, \"current_position\")
                        | int(100)) | round(0) }}%\n{% elif entity_domain == \"climate\"
                        and is_number(state_attr(entity_id, 'current_temperature'))
                        %}\n  {% set current_temperature = state_attr(entity_id, 'current_temperature')
                        | float %}\n  {{\n    current_temperature\n    | round(\n
                        \     0 if current_temperature >= 100\n            or temperature_units
                        in [\"F\", \"f\", \"°F\", \"°f\", \"K\", \"k\"]\n      else
                        1)\n  }}{{ temperature_units }}\n{% else %} 0 {% endif %}\n"
                      btn_icon: "{{\n  entity.icon\n  if entity.icon is defined\n
                        \     and entity.icon is string\n      and entity.icon | length
                        > 0\n  else all_icons.unknown\n}}\n"
                      btn_label: "{{\n  entity.name\n  if entity.name is defined\n
                        \     and entity.name is string\n      and entity.name | length
                        > 0\n  else entity_id\n}}\n"
                      btn_icon_font: '{{ button_pages_icon_size if is_number(button_pages_icon_size)
                        else 8 }}'
                      btn_bri: '{{ btn_bri_txt if btn_bri_txt and btn_bri_txt != "0%"
                        else "" }}'
                  - action: esphome.{{ nspanel_name }}_button
                    data:
                      page: '{{ repeat.item.page }}'
                      id: '{{ repeat.item.component }}'
                      state: '{{ btn_state }}'
                      icon: '{{ btn_icon }}'
                      icon_color: "{{\n  entity.icon_color\n  if entity.icon_color
                        is defined\n      and entity.icon_color is list\n      and
                        entity.icon_color | count == 3\n  else [200, 200, 200]\n}}\n"
                      icon_font: '{{ btn_icon_font }}'
                      bri: '{{ btn_bri }}'
                      label: '{{ btn_label if is_page_render else "" }}'
                      is_page_render: '{{ is_page_render }}'
                    continue_on_error: true
                  - if:
                    - '{{ btn_state }}'
                    - '{{ entity_domain in ["automation", "button", "input_button",
                      "remote", "scene", "script"] }}'
                    - '{{ not is_page_render }}'
                    - '{{ trigger.entity_id == repeat.item.entity }}'
                    then:
                    - delay:
                        milliseconds: 800
                    - action: esphome.{{ nspanel_name }}_button
                      data:
                        page: '{{ repeat.item.page }}'
                        id: '{{ repeat.item.component }}'
                        state: false
                        icon: '{{ btn_icon }}'
                        icon_color:
                        - 128
                        - 128
                        - 128
                        icon_font: '{{ btn_icon_font }}'
                        bri: '{{ btn_bri }}'
                        label: ''
                        is_page_render: false
                      continue_on_error: true
                  - *id004
              - alias: Page buttons - Confirm value
                sequence:
                - variables:
                    confirm_list: "{{\n  buttons_pages.buttons\n  | selectattr(\"page\",
                      \"defined\")\n  | selectattr(\"page\", \"eq\", event_page)\n
                      \ | sort(attribute=\"component\")\n  | map(attribute=\"confirm\")\n
                      \ | list\n}}\n"
                    confirm_value: "{% set ns = namespace(decimal_value = 0, index
                      = 0) %} {% for confirm_item in confirm_list %}\n    {% if (confirm_item)
                      %}\n        {% set ns.decimal_value = ns.decimal_value + (2
                      ** ns.index) %}\n    {% endif %}\n    {% set ns.index = ns.index
                      + 1 %}\n{% endfor %} {{ ns.decimal_value }}\n"
                - action: esphome.{{ nspanel_name }}_component_val
                  data:
                    page: ''
                    id: confirm
                    val: '{{ confirm_value }}'
                  continue_on_error: true
                - *id004
          - alias: Light settings page
            conditions: '{{ nspanel_event.page == pages.light }}'
            sequence: &id027
            - &id006
              variables:
                entity_id: "{{\n  nspanel_event.entity\n  if nspanel_event is defined
                  and nspanel_event.entity is defined and nspanel_event.entity is
                  string and nspanel_event.entity | length > 1\n  else (\n    trigger.entity_id\n
                  \   if trigger.entity_id is defined\n    else (\n      trigger.event.data.entity_id\n
                  \     if trigger is defined and trigger.event is defined and trigger.event.data
                  is defined and trigger.event.data.entity_id is defined\n      else
                  \"\"\n    )\n  )\n}}\n"
                entity_id_valid: "{{\n  entity_id is defined and\n  entity_id is string
                  and\n  entity_id | length > 0 and\n  \".\" in entity_id and\n  states[entity_id]
                  is not none\n}}\n"
            - *id005
            - &id007
              alias: Fill title of entity details page
              if: '{{ entity is defined }}'
              then:
              - if:
                - '{{ entity.name is defined }}'
                - '{{ entity.name is string }}'
                - '{{ entity.name | length > 0 }}'
                then:
                - action: esphome.{{ nspanel_name }}_component_text_list
                  data:
                    page: ''
                    id: page_label
                    txt_list:
                    - '{{ entity.name }}'
                  continue_on_error: true
                - *id004
              - if:
                - '{{ entity.icon is defined }}'
