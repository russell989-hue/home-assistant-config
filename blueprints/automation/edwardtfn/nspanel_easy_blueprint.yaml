conditions:
- "{{\n  trigger.id in [\"automation_reloaded\", \"ha_started\", \"nspanel_event\"]
  or\n  (states(nextion_display_sensor) | default(false) and has_value(device_name_sensor))\n}}\n"
- '{{ trigger.id not in ["home_values_state"] or home_page_background_update or pages.current
  == pages.home }}

  '
- "{{\n  trigger.id not in [\"trigger_chip_state\"] or\n  home_page_background_update
  or\n  pages.current in [ pages.home, pages.screensaver ]\n}}\n"
- '{{ trigger.id != "utilities_page" or pages.current == pages.utilities }}

  '
- '{{ trigger.id != "trigger_entitypage_state" or pages.current in pages.entitypages
  }}

  '
- "{{\n  pages.current == pages.climate or\n  trigger.id not in [\"trigger_climatepage_value_state\",
  \"climate_button08_state\", \"climate_button09_state\"]\n}}\n"
- "{{\n  pages.current == pages.water_heater or\n  trigger.id not in [\"trigger_water_heater_page_value_state\"]\n}}\n"
- "{{\n  trigger.id != \"trigger_buttonpage_state\" or\n  pages.current in pages.buttonpages
  or\n  (\n    pages.current in [pages.alarm, pages.button, pages.climate, pages.cover,
  pages.fan,\n                      pages.light, pages.switch, pages.water_heater]
  and\n    trigger.entity_id is defined and\n    detailed_entity | length > 0 and\n
  \   trigger.entity_id == states(detailed_entity)\n  )\n}}\n"
- "{{\n  trigger.id != \"indoortemp_state\" or\n  ((home_page_background_update or
  pages.current == pages.home ) and not embedded_indoor_temperature)\n}}\n"
- condition: or
  conditions:
  - '{{ trigger.id != "home_custom_buttons" }}'
  - condition: and
    conditions:
    - '{{ home_page_background_update or pages.current == pages.home }}'
    - '{{ trigger.event is defined and trigger.event.data is defined }}'
    - '{{ trigger.event.data.entity_id is defined }}'
    - '{{ trigger.event.data.entity_id is not match "media_player." }}'
  - condition: and
    conditions:
    - '{{ home_page_background_update or pages.current == pages.home }}'
    - '{{ trigger.event is defined and trigger.event.data is defined }}'
    - '{{ trigger.event.data.new_state is defined and trigger.event.data.new_state.state
      is defined }}'
    - '{{ trigger.event.data.old_state is defined and trigger.event.data.old_state.state
      is defined }}'
    - '{{ trigger.event.data.new_state.state != trigger.event.data.old_state.state
      }}'
actions:
- alias: Global variables
  variables:
    nspanel_name: "{{\n  trigger.event.data.device_name\n  if\n    trigger is defined
      and\n    trigger.event is defined and\n    trigger.event.data is defined and\n
      \   trigger.event.data.device_name is defined and\n    trigger.event.data.device_name
      is string and trigger.event.data.device_name | length > 0\n  else\n    (\n      states(device_name_sensor)\n
      \     if has_value(device_name_sensor)\n      else device_name\n    )\n}}\n"
    esphome_version: "{%\n  set esphome_version_sensor =\n    nspanel_entities | selectattr(None,
      \"search\", \"sensor.*_esphome_version\") | list | last\n    if nspanel_entities
      | selectattr(None, \"search\", \"sensor.*_esphome_version\") | list | count
      > 0\n    else (\"sensor.\" ~ device_name ~ \"_esphome_version\")\n%} {{\n  version(trigger.event.data.esphome_version)\n
      \ if\n    trigger is defined and\n    trigger.event is defined and\n    trigger.event.data
      is defined and\n    trigger.event.data.esphome_version is defined and\n    trigger.event.data.esphome_version
      is string and trigger.event.data.esphome_version | length > 0\n  else\n    (\n
      \     version(states(esphome_version_sensor))\n      if has_value(esphome_version_sensor)\n
      \     else version(\"0.0.0\")\n    )\n}}\n"
