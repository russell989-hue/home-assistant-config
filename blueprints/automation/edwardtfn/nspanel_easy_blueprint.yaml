              - action: esphome.{{ nspanel_name }}_components_visibility
                data:
                  page: light
                  ids:
                  - color_button
                  - color_touch
                  visible: true
                continue_on_error: true
            - alias: Light effects
              if: '{{ supported_features | bitwise_and(4) > 0 }}'
              then:
              - variables:
                  current_effect_raw: '{{ state_attr(entity_id, "effect") }}'
                  current_effect: "{{\n  current_effect_raw | trim\n  if current_effect_raw
                    is defined and current_effect_raw is string and current_effect_raw
                    | length > 0\n  else \"\"\n}}"
              - if: '{{ nspanel_event is defined and nspanel_event.type == "page_changed"
