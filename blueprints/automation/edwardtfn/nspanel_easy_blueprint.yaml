                then:
                - action: esphome.{{ nspanel_name }}_components_visibility
                  data:
                    page: light
                    ids:
                    - effect_button
                    visible: true
                  continue_on_error: true
                - *id004
                - variables:
                    effect_list_raw_attr: '{{ state_attr(entity_id, "effect_list")
                      }}'
                    effect_list_raw: "{{\n  effect_list_raw_attr\n  if\n    effect_list_raw_attr
                      is defined and\n    effect_list_raw_attr is iterable and\n    effect_list_raw_attr
                      is not string\n  else []\n}}\n"
                    effect_list_truncated: "{%- if effect_list_raw | length <= 8 -%}\n
                      \ {%- if current_effect | length == 0 or current_effect in effect_list_raw
                      -%}\n    {{ effect_list_raw }}\n  {%- else -%}\n    {{ ([current_effect]
                      + (effect_list_raw | list))[:8] }}\n  {%- endif -%}\n{%- elif
                      current_effect | length == 0 or current_effect in effect_list_raw[:8]
                      -%}\n  {{ effect_list_raw[:8] }}\n{%- else -%}\n  {{ [current_effect]
                      + (effect_list_raw[:7] | reject(\"equalto\", current_effect)
