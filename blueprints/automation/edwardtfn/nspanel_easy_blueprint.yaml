                  id: power_button
                  color:
                  - 192
                  - 192
                  - 192
                continue_on_error: true
              - *id004
              - action: esphome.{{ nspanel_name }}_components_visibility
                data:
                  page: light
                  ids:
                  - temp_button
                  - temp_value_2
                  - temp_touch
                  visible: true
                continue_on_error: true
              - *id004
            - if: '{{ color_mode_color }}'
