            - *id004
            - action: esphome.{{ nspanel_name }}_component_text_list
              data:
                page: cover
                id: cover_value
                txt_list:
                - '{{ (state_attr(entity_id, "current_position") | int ) | round(0)
                  ~ units_separator ~ "%" }}'
              continue_on_error: true
            - *id004
            - variables:
                battery_attribute: '{{ state_attr(entity_id, "battery") | default("unavailable")
                  }}'
                battery_level: "{% if battery_attribute and battery_attribute not
                  in enum.states.unknown %}\n  {{ battery_attribute }}\n{% elif expand(device_entities(device_id(entity_id)))\n
                  \       | selectattr(\"attributes.device_class\", \"defined\")\n
                  \       | selectattr(\"attributes.device_class\", \"eq\", \"battery\")\n
                  \       | map(attribute=\"state\")\n        | map(\"float\", default=none)\n
                  \       | select(\"ne\", none)\n        | list\n        | count
                  > 0 %}\n  {{\n    expand(device_entities(device_id(entity_id)))\n
                  \   | selectattr(\"attributes.device_class\", \"defined\")\n    |
                  selectattr(\"attributes.device_class\", \"eq\", \"battery\")\n    |
                  map(attribute=\"state\")\n    | map(\"float\", default=none)\n    |
                  select(\"ne\", none)\n    | list\n    | first\n    | round(0)\n
                  \ }}\n{% elif has_value(entity_id | replace(\"cover.\",\"sensor.\")
                  ~ \"_battery\") %}\n  {{ states(entity_id | replace(\"cover.\",\"sensor.\")
                  ~ \"_battery\", rounded=true) | default(\"unavailable\") }}\n{%
                  elif has_value(entity_id | replace(\"cover.\",\"sensor.\") | replace(\"cover\",
                  \"battery\")) %}\n  {{ states(entity_id | replace(\"cover.\",\"sensor.\")
                  | replace(\"cover\", \"battery\"), rounded=true) | default(\"unavailable\")
                  }}\n{% else %} unavailable {% endif %}\n"
            - if: '{{ is_number(battery_level) }}'
              then:
              - variables:
                  battery_icon: "{% if battery_level >= 80 %}\n  battery-high\n{%
                    elif battery_level >= 40 %}\n  battery-medium\n{% elif battery_level
                    >= 15 %}\n  battery-low\n{% else %}\n  battery-outline\n{% endif
                    %}\n"
              - action: esphome.{{ nspanel_name }}_component_text_list
                data:
                  page: cover
                  id: battery_value
                  txt_list:
                  - '{{ battery_level ~ units_separator ~ "%" }}'
                continue_on_error: true
              - *id004
              - action: esphome.{{ nspanel_name }}_component_color
                data:
                  page: cover
                  id: battery_icon
                  color: '{{ nextion.color.grey_super_light }}'
                continue_on_error: true
              - *id004
              - action: esphome.{{ nspanel_name }}_component_text_list
                data:
                  page: cover
                  id: battery_icon
                  txt_list:
                  - '{{ all_icons[battery_icon] }}'
                continue_on_error: true
          - alias: Fan settings page
            conditions: '{{ nspanel_event.page == pages.fan }}'
            sequence: &id026
            - *id006
            - variables:
                fan:
                  supported_features: '{{ state_attr(entity_id, "supported_features")
                    | int(0) }}'
                  percentage: "{{\n  state_attr(entity_id, \"percentage\") | int(0)\n
                    \ if is_state(entity_id, 'on')\n  else 0\n}}\n"
                  steps: "{% set percentage_step = state_attr(entity_id, \"percentage_step\")
                    | float(0) %} {{\n  (100/percentage_step) | round(0) | int(0)\n
                    \ if percentage_step > 0\n  else 0\n}}\n"
            - *id005
            - *id007
            - if: '{{ fan.steps > 0 and fan.supported_features | bitwise_and(2) >
                0 }}'
              then:
              - action: esphome.{{ nspanel_name }}_component_text_list
                data:
                  page: fan
                  id: bt_oscillate
                  txt_list:
