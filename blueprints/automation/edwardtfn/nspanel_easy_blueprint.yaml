- condition: '{{ nspanel_name is defined }}'
- condition: '{{ nspanel_name is string }}'
- condition: '{{ nspanel_name | length > 0 }}'
- alias: Global anchor repository
  if: '{{ false }}'
  then:
  - &id004
    delay:
      milliseconds: !input delay
  - variables:
      entity_id: '{{ None }}'
      overlap:
        icon: '{{ None }}'
        icon_color: '{{ None }}'
        name: '{{ None }}'
  - &id005
    alias: Variable Entity
    variables:
      entity_id_valid: "{{\n  entity_id is defined and\n  entity_id is string and\n
        \ entity_id | length > 0 and\n  \".\" in entity_id and\n  states[entity_id]
        is not none\n}}\n"
      overlap_icon_valid: "{{\n  overlap is defined and\n  overlap.icon is defined
        and\n  overlap.icon is string and\n  overlap.icon | length > 0 and\n  overlap.icon
        is match \"mdi:\" and\n  overlap.icon.split(\":\")[1] in all_icons\n}}\n"
      overlap_icon_color_valid: '{{ overlap is defined and overlap.icon_color is defined
        and overlap.icon_color is list and overlap.icon_color | count == 3 }}'
      overlap_name_valid: '{{ overlap is defined and overlap.name is defined and overlap.name
        is string and overlap.name | length > 0 }}'
      entity_state: '{{ states(entity_id) | default("unknown") if entity_id_valid
        }}'
      entity_has_value: '{{ has_value(entity_id) if entity_id_valid }}'
      entity_domain: '{{ states[entity_id].domain if entity_id_valid }}'
      entity_icon: '{{ state_attr(entity_id, "icon") | default("") if entity_id_valid
        }}'
      entity_icon_valid: "{{\n  entity_icon is defined and\n  entity_icon is string
        and\n  entity_icon | length > 0 and\n  entity_icon is match \"mdi:\" and\n
        \ entity_icon.split(\":\")[1] in all_icons\n}}\n"
      entity_state_is_on: "{{\n  (\n    entity_state in enum.states.on or\n    (entity_domain
        in [\"input_number\", \"number\", \"sensor\"] and entity_has_value) or\n    (entity_domain
        in enum.states and entity_state in enum.states[entity_domain].on)\n  ) if
        entity_id_valid\n}}\n"
      entity_state_is_off: "{{\n  (not entity_state_is_on) and\n  (\n    entity_state
        in enum.states.off or\n    (\n      entity_domain in enum.states and\n      entity_state
        in enum.states[entity_domain].off\n    )\n  )\n  if entity_id_valid\n}}\n"
      entity_state_is_unknown: '{{ ((not entity_state_is_on) and (not entity_state_is_off))
        if entity_id_valid }}'
      entity_icon_color: "{%- if entity_id_valid -%}\n  {%- set default_color = overlap.icon_color
        if overlap_icon_color_valid else nextion.color.on -%}\n  {{ default_color
        if (not entity_state_is_off and not entity_state_is_unknown) else nextion.color.off
        }}\n{%- else -%}\n  {{ overlap.icon_color if overlap_icon_color_valid else
        [0, 0, 0] }}\n{%- endif -%}\n"
      entity_friendly_name: '{{ states[entity_id].name if entity_id_valid }}'
      entity_device_class: '{{ state_attr(entity_id, "device_class") | default("")
        if entity_id_valid else "" }}'
      entity:
        name: "{%- if entity_id_valid -%}\n  {{ overlap.name if overlap_name_valid
          else entity_friendly_name }}\n{%- endif -%}\n"
        icon: "{%- if entity_id_valid -%}\n  {%- set icon_domain = nextion.icon.domain[entity_domain]
          | default(all_icons.unknown) if entity_domain else all_icons.unknown -%}\n
          \ {#- Priority 1: Overlap icon -#}\n  {%- if overlap_icon_valid -%}\n    {{
          all_icons[overlap.icon.split(\":\")[1]] }}\n  {#- Priority 2: Domain-specific
          icon logic -#}\n  {%- elif entity_domain == \"climate\" -%}\n    {%- set
          entity_hvac_action = state_attr(entity_id, \"hvac_action\") | default(\"\")
          -%}\n    {%- set entity_climate_action = entity_hvac_action if entity_hvac_action
          and entity_hvac_action not in enum.states.unknown else entity_state -%}\n
          \   {%- if \"off\" in entity_climate_action -%}\n      {{ all_icons.thermostat
          }}\n    {%- elif \"heat_cool\" in entity_climate_action -%}\n      {{ all_icons.autorenew
          }}\n    {%- elif \"heating\" in entity_climate_action or \"heat\" in entity_climate_action
          -%}\n      {{ all_icons[\"thermometer-lines\"] }}\n    {%- elif \"cooling\"
          in entity_climate_action or \"cool\" in entity_climate_action -%}\n      {{
          all_icons.snowflake }}\n    {%- elif \"drying\" in entity_climate_action
          or \"dry\" in entity_climate_action -%}\n      {{ all_icons[\"water-percent\"]
          }}\n    {%- elif \"fan\" in entity_climate_action or \"fan_only\" in entity_climate_action
          -%}\n      {{ all_icons.fan }}\n    {%- elif \"auto\" in entity_climate_action
          -%}\n      {{ all_icons[\"refresh-auto\"] }}\n    {%- elif \"idle\" in entity_climate_action
          -%}\n      {{ all_icons.thermometer }}\n    {%- else -%}\n      {{ icon_domain
          }}\n    {%- endif -%}\n  {%- elif entity_domain == \"alarm_control_panel\"
          -%}\n    {%- if entity_state in [\"disarmed\", \"disarming\"] -%}\n      {{
          all_icons[\"shield-off-outline\"] }}\n    {%- elif entity_state == \"armed_home\"
          -%}\n      {{ all_icons[\"shield-home-outline\"] }}\n    {%- elif entity_state
          == \"armed_away\" -%}\n      {{ all_icons[\"shield-lock-outline\"] }}\n
          \   {%- elif entity_state == \"armed_night\" -%}\n      {{ all_icons[\"shield-moon-outline\"]
          }}\n    {%- elif entity_state == \"armed_vacation\" -%}\n      {{ all_icons[\"shield-airplane-outline\"]
          }}\n    {%- elif entity_state == \"armed_bypass\" -%}\n      {{ all_icons[\"shield-half-full\"]
          }}\n    {%- elif entity_state in [\"pending\", \"arming\"] -%}\n      {{
          all_icons[\"shield-outline\"] }}\n    {%- else -%}\n      {{ all_icons[\"shield-alert-outline\"]
          }}\n    {%- endif -%}\n  {%- elif entity_domain == \"lock\" -%}\n    {%-
          if entity_state == \"locked\" -%}\n      {{ all_icons[\"lock\"] }}\n    {%-
          elif entity_state == \"unlocked\" -%}\n      {{ all_icons[\"lock-open-variant\"]
          }}\n    {%- else -%}\n      {{ all_icons[\"lock-alert\"] }}\n    {%- endif
          -%}\n  {%- elif entity_domain == \"water_heater\" -%}\n    {%- set wh_mode
          = state_attr(entity_id, \"operation_mode\") | default(entity_state) -%}\n
          \   {%- set wh_icon_map = {\n      'off': all_icons[\"water-boiler-off\"],\n
          \     'on': all_icons[\"water-boiler\"],\n      'eco': all_icons.leaf,\n
          \     'electric': all_icons[\"lightning-bolt\"],\n      'gas': all_icons.fire,\n
          \     'heat_pump': all_icons[\"heat-pump\"],\n      'performance': all_icons[\"heat-wave\"],\n
          \     'high_demand': all_icons.speedometer\n    } -%}\n    {{ wh_icon_map.get(wh_mode,
          icon_domain) }}\n  {#- Priority 3: Entity's custom icon from state attribute
          -#}\n  {%- elif entity_icon_valid -%}\n    {{ all_icons[entity_icon.split(\":\")[1]]
          }}\n  {#- Priority 4: Device class icon -#}\n  {%- elif entity_device_class
          is string and\n      entity_device_class | length > 0 and\n      entity_domain
          in device_class_icons -%}\n    {%- set state_suffix = \"\" if entity_domain
          in [\"button\", \"event\", \"sensor\"] else (\"-\" + entity_state) -%}\n
          \   {%- set device_class_key = entity_device_class + state_suffix -%}\n
          \   {%- if device_class_key in device_class_icons[entity_domain] -%}\n      {{
          all_icons[device_class_icons[entity_domain][device_class_key]] }}\n    {%-
          else -%}\n      {{ icon_domain }}\n    {%- endif -%}\n  {#- Priority 5:
          Domain default -#}\n  {%- else -%}\n    {{ icon_domain }}\n  {%- endif -%}\n{%-
          endif -%}\n"
        icon_color: "{%- if entity_id_valid -%}\n  {%- if entity_domain == \"alarm_control_panel\"
          -%}\n    {%- if entity_state == \"disarmed\" -%}\n      {{ nextion.color.off
          }}\n    {%- elif entity_state in [\"armed_home\", \"armed_away\", \"armed_night\",
          \"armed_vacation\", \"armed_bypass\"] -%}\n      {{ nextion.color.green
          }}\n    {%- elif entity_state in [\"pending\", \"arming\", \"disarming\"]
          -%}\n      {{ nextion.color.amber }}\n    {%- elif entity_state == \"triggered\"
          -%}\n      {{ nextion.color.red }}\n    {%- else -%}\n      {{ entity_icon_color
          }}\n    {%- endif -%}\n  {%- elif entity_domain == \"climate\" -%}\n    {%-
          set entity_hvac_action = state_attr(entity_id, \"hvac_action\") | default(\"\")
          -%}\n    {%- set entity_climate_action = entity_hvac_action if entity_hvac_action
          and entity_hvac_action not in enum.states.unknown else entity_state -%}\n
          \   {%- if \"off\" in entity_climate_action -%}\n      {{ nextion.color.off
          }}\n    {%- elif \"heat_cool\" in entity_climate_action -%}\n      {{ nextion.color.amber
          }}\n    {%- elif \"heating\" in entity_climate_action or \"heat\" in entity_climate_action
          -%}\n      {{ nextion.color.deep_orange }}\n    {%- elif \"cooling\" in
          entity_climate_action or \"cool\" in entity_climate_action -%}\n      {{
          nextion.color.blue }}\n    {%- elif \"drying\" in entity_climate_action
          or \"dry\" in entity_climate_action -%}\n      {{ nextion.color.orange }}\n
          \   {%- elif \"fan\" in entity_climate_action or \"fan_only\" in entity_climate_action
          -%}\n      {{ nextion.color.cyan }}\n    {%- elif \"auto\" in entity_climate_action
          -%}\n      {{ nextion.color.green }}\n    {%- elif \"idle\" in entity_climate_action
          -%}\n      {{ nextion.color.off }}\n    {%- else -%}\n      {{ entity_icon_color
          }}\n    {%- endif -%}\n  {%- elif entity_domain == \"light\" -%}\n    {%-
          if entity_state != \"on\" -%}\n      {{ nextion.color.off }}\n    {%- else
          -%}\n      {%- set entity_rgb_color_attr = state_attr(entity_id, \"rgb_color\")
          | default(\"\") -%}\n      {%- if entity_rgb_color_attr is list and entity_rgb_color_attr
          | count == 3 -%}\n        {{ entity_rgb_color_attr }}\n      {%- else -%}\n
          \       {{ entity_icon_color }}\n      {%- endif -%}\n    {%- endif -%}\n
          \ {%- elif entity_domain == \"lock\" -%}\n    {%- if entity_state == \"locked\"
          -%}\n      {{ nextion.color.green }}\n    {%- elif entity_state == \"unlocked\"
          -%}\n      {{ nextion.color.red }}\n    {%- else -%}\n      {{ entity_icon_color
          }}\n    {%- endif -%}\n  {%- elif entity_domain == \"water_heater\" -%}\n
          \   {%- set wh_mode = state_attr(entity_id, \"operation_mode\") | default(entity_state)
          -%}\n    {%- set wh_color_map = {\n      'off': nextion.color.off,\n      'on':
          nextion.color.orange,\n      'eco': nextion.color.green,\n      'electric':
          nextion.color.amber,\n      'gas': nextion.color.deep_orange,\n      'heat_pump':
          nextion.color.blue,\n      'performance': nextion.color.red,\n      'high_demand':
          nextion.color.red\n    } -%}\n    {{ wh_color_map.get(wh_mode, entity_icon_color)
          }}\n  {%- else -%}\n    {{ entity_icon_color }}\n  {%- endif -%}\n{%- endif
          -%}\n"
- alias: Main choices
  choose:
  - alias: NSPanel event
    conditions:
    - condition: trigger
      id: nspanel_event
    - '{{ trigger is defined }}'
    - '{{ trigger.event is defined }}'
    - '{{ trigger.event.data is defined }}'
    sequence:
    - variables:
        nspanel_event: "{{\n  trigger.event.data\n  if\n    trigger is defined and\n
          \   trigger.event is defined and\n    trigger.event.data is defined\n  else
          none\n}}"
    - condition: '{{ nspanel_event is not none }}'
    - choose:
      - alias: Boot init
        conditions:
        - '{{ nspanel_event.type == "boot"}}'
        - '{{ nspanel_event.step is defined and nspanel_event.step in ["start", "timeout"]}}'
        sequence:
        - &id017
          sequence:
          - alias: Blueprint version
            sequence:
            - action: esphome.{{ nspanel_name }}_component_text_list
              data:
                page: mem
                id: ver_blueprint
                txt_list:
                - '{{ blueprint_version }}'
              continue_on_error: true
            - &id003
              delay:
                milliseconds: !input delay_boot
          - &id011
            variables:
              hw_button_left_entity: !input left_button_entity
              hw_button_left_state_entity: !input left_button_state_entity
              hw_button_right_entity: !input right_button_entity
              hw_button_right_state_entity: !input right_button_state_entity
              hardware:
                buttons:
                  left:
                    entity: '{{ hw_button_left_entity }}'
                    entity_is_valid: '{{ hw_button_left_entity is defined and hw_button_left_entity
                      is string and hw_button_left_entity.split(".") | count == 2
                      }}'
                    state_entity: '{{ hw_button_left_state_entity }}'
                    state_entity_is_valid: '{{ hw_button_left_state_entity is defined
                      and hw_button_left_state_entity is string and hw_button_left_state_entity.split(".")
                      | count == 2 }}

                      '
                    name: !input left_button_name
                    hold_select: !input left_button_hold_select
                    bar_always_visible: !input hw_button_bar_left_always_show
                  right:
                    entity: '{{ hw_button_right_entity }}'
                    entity_is_valid: '{{ hw_button_right_entity is defined and hw_button_right_entity
                      is string and hw_button_right_entity.split(".") | count == 2
                      }}'
                    state_entity: '{{ hw_button_right_state_entity }}'
                    state_entity_is_valid: '{{ hw_button_right_state_entity is defined
                      and hw_button_right_state_entity is string and hw_button_right_state_entity.split(".")
                      | count == 2 }}

                      '
                    name: !input right_button_name
                    hold_select: !input right_button_hold_select
                    bar_always_visible: !input hw_button_bar_right_always_show
          - variables:
              home_indoor_temp_icon: !input home_indoor_temp_icon
          - alias: DateTime
            sequence:
            - alias: DateTime on page home
              sequence:
              - alias: date_color
                action: esphome.{{ nspanel_name }}_component_color
                data:
                  page: mem
                  id: date_color
                  color: !input date_label_color
                continue_on_error: true
              - *id003
              - alias: time_color
                action: esphome.{{ nspanel_name }}_component_color
                data:
                  page: mem
                  id: time_color
                  color: !input time_label_color
                continue_on_error: true
              - *id003
              - alias: date_format
                action: esphome.{{ nspanel_name }}_component_text_list
                data:
                  page: mem
                  id: date_format
                  txt_list:
                  - !input date_format
                continue_on_error: true
              - *id003
              - alias: time_format
                action: esphome.{{ nspanel_name }}_component_text_list
                data:
                  page: mem
                  id: time_format
                  txt_list:
                  - !input time_format
                continue_on_error: true
              - *id003
          - alias: Localization - Units separator
            sequence:
            - alias: units_separator
              action: esphome.{{ nspanel_name }}_component_text_list
              data:
                page: mem
                id: units_separator
                txt_list:
                - '{{ units_separator }}'
              continue_on_error: true
            - *id003
          - alias: Home page
            sequence:
            - alias: climate_chip_visibility
              sequence:
              - variables:
                  climate_chip_visibility: !input climate_chip_visibility
              - action: esphome.{{ nspanel_name }}_component_val
                data:
                  page: mem
                  id: climate_chip_visibility
                  val: '{%- if climate_chip_visibility == ''always'' %}1 {%- elif
                    climate_chip_visibility == ''never'' %}2 {%- else %}0{%- endif
                    %}'
                continue_on_error: true
              - *id003
            - alias: chip_font
              action: esphome.{{ nspanel_name }}_component_val
              data:
                page: mem
                id: chip_font
                val: !input chip_font_size
              continue_on_error: true
            - *id003
            - alias: custom_buttons_font
              action: esphome.{{ nspanel_name }}_component_val
              data:
                page: mem
                id: custom_buttons_font
                val: !input custom_buttons_font_size
              continue_on_error: true
            - *id003
            - alias: outdoor_temp_font
              action: esphome.{{ nspanel_name }}_component_val
              data:
                page: mem
                id: outdoor_temp_font
                val: !input home_outdoor_temp_font
              continue_on_error: true
            - *id003
            - alias: Home page - Entities button
              sequence:
              - variables:
                  bt_entities_icon: !input home_button06_icon
              - alias: entities_pages_icon
                action: esphome.{{ nspanel_name }}_component_text_list
                data:
                  page: mem
                  id: entities_pages_icon
                  txt_list:
                  - "{{\n  all_icons[bt_entities_icon.split(\"mdi:\")[1]]\n  if bt_entities_icon
                    is string and bt_entities_icon.split(\"mdi:\")[1] in all_icons\n
                    \ else all_icons[\"format-list-bulleted-square\"]\n}}\n"
                continue_on_error: true
              - *id003
              - alias: entities_pages_icon_color
                action: esphome.{{ nspanel_name }}_component_color
                data:
                  page: mem
                  id: entities_pages_icon_color
                  color: !input home_button06_icon_color
                continue_on_error: true
              - *id003
            - alias: Home page - Utilities button
              sequence:
              - variables:
                  utilities_enabled: !input utilities_enabled
                  bt_utilities_icon: !input home_button08_icon
              - alias: home_bt_utilities
                action: esphome.{{ nspanel_name }}_icon
                data:
                  page: home
                  id: bt_utilities
                  icon: "{{\n  all_icons[bt_utilities_icon.split(\"mdi:\")[1]]\n  if
                    bt_utilities_icon is string and bt_utilities_icon.split(\"mdi:\")[1]
                    in all_icons\n  else all_icons.gauge\n}}\n"
                  icon_color: !input home_button08_icon_color
                  visible: '{{ utilities_enabled }}'
              - *id003
          - sequence:
            - variables:
                home_button04_icon_color01: !input home_button04_icon_color01
                bt_notific_icon_color: "{{\n  home_button04_icon_color01\n  if home_button04_icon_color01
                  is list and home_button04_icon_color01 | count == 3\n  else [200,
                  204, 200]\n}}\n"
            - action: esphome.{{ nspanel_name }}_component_color
              data:
                page: mem
                id: notification_icon_color_normal
                color: '{{ bt_notific_icon_color }}'
              continue_on_error: true
            - *id003
            - action: esphome.{{ nspanel_name }}_component_color
              data:
                page: mem
                id: notification_icon_color_unread
                color: !input home_button04_icon_color02
              continue_on_error: true
            - *id003
            - variables:
                bt_notific_icon: !input home_button04_icon
            - action: esphome.{{ nspanel_name }}_icon
              data:
                page: home
                id: bt_notific
                icon: "{{\n  all_icons[bt_notific_icon.split(\":\")[1]]\n  if bt_notific_icon
                  is string and bt_notific_icon.split(\":\")[1] in all_icons\n  else
                  all_icons.email\n}}\n"
                icon_color: '{{ bt_notific_icon_color }}'
                visible: false
              continue_on_error: true
            - *id003
          - alias: Home page - outdoor_temp
            sequence:
            - action: esphome.{{ nspanel_name }}_component_color
              data:
                page: home
                id: outdoor_temp
                color: !input home_outdoor_temp_label_color
              continue_on_error: true
            - *id003
          - alias: Home page - indr_temp
            sequence:
            - action: esphome.{{ nspanel_name }}_component_color
              data:
                page: home
                id: indr_temp
                color: !input home_indoor_temp_label_color
              continue_on_error: true
            - *id003
            - action: esphome.{{ nspanel_name }}_component_text_list
              data:
                page: home
                id: indr_temp_icon
                txt_list:
                - "{{\n  all_icons[home_indoor_temp_icon.split(\"mdi:\")[1]]\n  if
                  home_indoor_temp_icon.split(\"mdi:\") | count == 2 and home_indoor_temp_icon.split(\"mdi:\")[1]
                  in all_icons\n  else all_icons.thermometer\n}}\n"
              continue_on_error: true
            - *id003
            - action: esphome.{{ nspanel_name }}_component_color
              data:
                page: home
                id: indr_temp_icon
                color: !input home_indoor_temp_icon_color
              continue_on_error: true
            - *id003
          - alias: Home page - Values 01 - 04
            repeat:
              for_each: '{{ home_page.entity_value | list }}'
              sequence:
              - condition:
                - '{{ repeat.item.entity is defined }}'
                - '{{ repeat.item.entity is string }}'
                - '{{ repeat.item.entity.split(".") | count == 2 }}'
              - variables:
                  default_color: *id002
              - alias: Text color
                if:
                - '{{ repeat.item.label_color_rgb is defined }}'
                - '{{ repeat.item.label_color_rgb is list }}'
                - '{{ repeat.item.label_color_rgb | count == 3 }}'
                - '{{ repeat.item.label_color_rgb != default_color }}'
                then:
                - action: esphome.{{ nspanel_name }}_component_color
                  data:
                    page: home
                    id: '{{ repeat.item.component }}'
                    color: '{{ repeat.item.label_color_rgb }}'
                  continue_on_error: true
                - *id003
              - alias: Icon color
                if:
                - '{{ repeat.item.icon_color_rgb is defined }}'
                - '{{ repeat.item.icon_color_rgb is list }}'
                - '{{ repeat.item.icon_color_rgb | count == 3 }}'
                - '{{ repeat.item.icon_color_rgb != default_color }}'
                then:
                - action: esphome.{{ nspanel_name }}_component_color
                  data:
                    page: home
                    id: '{{ repeat.item.component }}_icon'
                    color: '{{ repeat.item.icon_color_rgb }}'
                  continue_on_error: true
                - *id003
              - alias: Icon
                if:
                - '{{ repeat.item.icon is defined }}'
                - '{{ repeat.item.icon is string }}'
                - '{{ repeat.item.icon is match "mdi:" }}'
                - '{{ repeat.item.icon.split("mdi:")[1] in all_icons }}'
                then:
                - action: esphome.{{ nspanel_name }}_component_text_list
                  data:
                    page: '{{ repeat.item.page }}'
                    id: '{{ repeat.item.component }}_icon'
                    txt_list:
                    - '{{ all_icons[repeat.item.icon.split("mdi:")[1]] }}'
                  continue_on_error: true
                - *id003
          - alias: NSPanel Left Button Name
            if: '{{ hardware.buttons.left.name | length > 0 }}'
            then:
            - action: esphome.{{ nspanel_name }}_component_color
              data:
                page: home
                id: left_bt_text
                color: !input left_button_color
              continue_on_error: true
            - *id003
            - action: esphome.{{ nspanel_name }}_component_text_list
              data:
                page: home
                id: left_bt_text
                txt_list:
                - '{{ hardware.buttons.left.name }}'
              continue_on_error: true
            - *id003
          - alias: NSPanel Right Button Name
            if: '{{ hardware.buttons.right.name | length > 0 }}'
            then:
            - action: esphome.{{ nspanel_name }}_component_color
              data:
                page: home
                id: right_bt_text
                color: !input right_button_color
              continue_on_error: true
            - *id003
            - action: esphome.{{ nspanel_name }}_component_text_list
              data:
                page: home
                id: right_bt_text
                txt_list:
                - '{{ hardware.buttons.right.name }}'
              continue_on_error: true
            - *id003
          - alias: QRcode
            sequence:
            - alias: qrcode_icon
              sequence:
              - variables:
                  bt_qrcode_icon: !input home_button05_icon
              - alias: qrcode_icon_action
                action: esphome.{{ nspanel_name }}_component_text_list
                data:
                  page: mem
                  id: qrcode_icon
                  txt_list:
                  - "{{\n  all_icons[bt_qrcode_icon.split(\"mdi:\")[1]]\n  if bt_qrcode_icon
                    is string and bt_qrcode_icon.split(\"mdi:\")[1] in all_icons\n
                    \ else all_icons[\"qrcode-scan\"]\n}}\n"
                continue_on_error: true
              - *id003
            - alias: qrcode_icon_color
              action: esphome.{{ nspanel_name }}_component_color
              data:
                page: mem
                id: qrcode_icon_color
                color: !input home_button05_icon_color
              continue_on_error: true
            - *id003
            - &id044
              alias: qrcode_update
              sequence:
              - variables:
                  qrcode_entity: !input qrcode_entity
                  qrcode_fallback_value: !input qrcode_value
                  qrcode_value: "{{\n  states(qrcode_entity, rounded=True, with_unit=True)\n
                    \ if\n    qrcode_entity is defined and\n    qrcode_entity is string
                    and\n    has_value(qrcode_entity)\n  else\n    qrcode_fallback_value\n}}\n"
              - alias: Call QR code action
                if: '{{ qrcode_value is defined and qrcode_value is string and qrcode_value
                  | length > 0 }}'
                then:
                - action: esphome.{{ nspanel_name }}_qrcode
                  data:
                    title: !input qrcode_label
                    qrcode: '{{ qrcode_value }}'
                    show: false
                  continue_on_error: true
                - *id003
          - alias: Relay settings
            sequence:
            - variables:
                relay1_icon: !input relay01_icon
                relay2_icon: !input relay02_icon
                relay1_local_control: '{{ hardware.buttons.left.entity == relay01_entity
                  }}'
                relay1_fallback: !input relay_1_local_fallback
                relay2_local_control: '{{ hardware.buttons.right.entity == relay02_entity
                  }}'
                relay2_fallback: !input relay_2_local_fallback
            - action: esphome.{{ nspanel_name }}_component_text_list
              data:
                page: mem
                id: relay1_icon
                txt_list:
                - "{{\n  all_icons[relay1_icon.split(\"mdi:\")[1]]\n  if relay1_icon.split(\"mdi:\")[1]
                  in all_icons\n  else all_icons[\"numeric-1-box-outline\"]\n}}\n"
              continue_on_error: true
            - *id003
            - action: esphome.{{ nspanel_name }}_component_text_list
              data:
                page: mem
                id: relay2_icon
                txt_list:
                - "{{\n  all_icons[relay2_icon.split(\"mdi:\")[1]]\n  if relay2_icon.split(\"mdi:\")[1]
                  in all_icons\n  else all_icons[\"numeric-2-box-outline\"]\n}}\n"
              continue_on_error: true
            - *id003
            - action: esphome.{{ nspanel_name }}_component_color
              data:
                page: mem
                id: relay1_icon_color
                color: !input relay01_icon_color
              continue_on_error: true
            - *id003
            - action: esphome.{{ nspanel_name }}_component_color
              data:
                page: mem
                id: relay2_icon_color
                color: !input relay02_icon_color
              continue_on_error: true
            - *id003
            - action: esphome.{{ nspanel_name }}_component_val
              data:
                page: mem
                id: relay_settings
                val: "{{\n  (relay1_local_control|int) +\n  (relay1_fallback|int *
                  2) +\n  (relay2_local_control|int * 16) +\n  (relay2_fallback|int
                  * 32)\n}}\n"
