- id: shadowfax_trip_start
  alias: 'Shadowfax: Trip Start Capture'
  mode: single
  triggers:
  - trigger: state
    entity_id: sensor.shadowfax_gear_selector
    from: Park
    not_to:
    - unavailable
    - unknown
    - Park
  actions:
  - action: input_datetime.set_datetime
    target:
      entity_id: input_datetime.shadowfax_trip_start_time
    data:
      timestamp: '{{ now().timestamp() }}'
  - action: input_number.set_value
    target:
      entity_id: input_number.shadowfax_trip_start_odometer
    data:
      value: '{{ states(''sensor.shadowfax_odometer'') }}'
  - action: input_number.set_value
    target:
      entity_id: input_number.shadowfax_trip_start_battery
    data:
      value: '{{ states(''sensor.shadowfax_battery_state_of_charge'') }}'
  - action: input_text.set_value
    target:
      entity_id: input_text.shadowfax_trip_start_location
    data:
      value: '{{ states(''device_tracker.shadowfax_location'') }}'
- id: shadowfax_trip_end
  alias: 'Shadowfax: Trip End Log'
  mode: single
  triggers:
  - trigger: state
    entity_id: sensor.shadowfax_gear_selector
    to: Park
    not_from:
    - unavailable
    - unknown
    - Park
  variables:
    start_odo: '{{ states(''input_number.shadowfax_trip_start_odometer'') | float(0)
      }}'
    end_odo: '{{ states(''sensor.shadowfax_odometer'') | float(0) }}'
    distance: '{{ (end_odo - start_odo) | round(1) }}'
    start_batt: '{{ states(''input_number.shadowfax_trip_start_battery'') | float(0)
      }}'
    end_batt: '{{ states(''sensor.shadowfax_battery_state_of_charge'') | float(0)
      }}'
    batt_used: '{{ (start_batt - end_batt) | round(1) }}'
    start_time: '{{ states(''input_datetime.shadowfax_trip_start_time'') }}'
    start_loc: '{{ states(''input_text.shadowfax_trip_start_location'') }}'
    end_loc: '{{ states(''device_tracker.shadowfax_location'') }}'
    duration_min: '{{ ((now() - strptime(start_time, ''%Y-%m-%d %H:%M:%S'')).total_seconds()
      / 60) | round(0) if start_time not in [''unknown'',''unavailable'',''''] else
      0 }}'
  conditions:
  - condition: template
    value_template: '{{ distance >= 0.3 and duration_min >= 2 }}'
  actions:
  - action: calendar.create_event
    target:
      entity_id: calendar.shadowfax_trips
    data:
      summary: '{{ start_loc }} → {{ end_loc }} ({{ distance }} mi)'
      description: 'Distance: {{ distance }} mi Duration: {{ duration_min }} min Avg
        speed: {{ (distance / (duration_min / 60)) | round(0) if duration_min > 0
        else 0 }} mph Battery: {{ start_batt }}% → {{ end_batt }}% (used {{ batt_used
        }}%) Odometer: {{ start_odo }} → {{ end_odo }} mi'
      start_date_time: '{{ start_time }}'
      end_date_time: '{{ now().strftime(''%Y-%m-%d %H:%M:%S'') }}'
