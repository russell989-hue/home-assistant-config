- id: llmvision_garage_ai
  alias: AI - Garage Camera Events
  description: 'Timeline-only AI summary of garage/back-pad motion. Created 2026-07-19;
    replaces the garage coverage of the never-firing ''AI Camera Events'' blueprint.
    Reworked 2026-07-20: SDM motion events arrive 15-25s late, so live stream_analyzer
    frames showed the empty aftermath. Now waits 20s then analyzes the last ~60s of
    the garage RING BUFFER via video_analyzer.'
  triggers:
  - trigger: state
    entity_id:
    - event.garage_camera_motion
  conditions:
  - condition: template
    value_template: '{{ this.attributes.last_triggered is none or (now() - this.attributes.last_triggered).total_seconds()
      > 300 }}'
  actions:
  - delay: 00:00:20
  - action: shell_command.check_clip
    data:
      cam: garage
      seconds: 70
  - action: llmvision.video_analyzer
    data:
      provider: 01KX6N0GA1SYFVHSKZDJ0S6N8S
      video_file: /media/garage_check.mp4
      max_frames: 12
      use_memory: true
      message: 'CAMERA CONTEXT: This camera watches the back parking pad and garage
        entrance behind a private Denver home. The concrete pad and rear walkway in
        the center belong to this home; the household trash, recycling and compost
        bins sit among the plants on the right; the paved public alley crosses the
        top of the frame. People at the bins or on the pad are on this property; people
        crossing the top of the frame are just passing through the public alley -
        say so and treat that as routine.


        These frames are from the last ~60 seconds of continuous footage from this
        camera, captured just after motion was detected. Your memory contains a labeled
        reference photo of this garage back pad in its normal empty state. Compare
        the frames with that reference and report only what is NEW or DIFFERENT. Ignore
        anything already present in the reference (bins, plants, fixtures) and ignore
        lighting or shadow differences alone.


        Describe the single most important NEW thing in ONE short sentence (max 12
        words), starting directly with the subject and action, e.g. "Person taking
        out the trash", "Car pulling onto the back pad", "Jogger passing through the
        alley". If nothing is new versus the reference, reply exactly: No activity.'
      include_filename: false
      max_tokens: 60
      store_in_timeline: true
      expose_images: true
      generate_title: true
    response_variable: garage_ai
  mode: single
  max_exceeded: silent
- id: google_home_package_mirror
  alias: Package - Mirror Google Home detection to Nick + persistent
  description: Created 2026-07-19. Google's package detection is exclusive to the
    Google Home app (not exposed via the SDM API), so this listens to Google Home
    notifications arriving on Brian's Z Flip via the companion app's Last Notification
    sensor. Requires that sensor to be enabled on the phone with com.google.android.apps.chromecast.app
    allow-listed.
  triggers:
  - trigger: state
    entity_id:
    - sensor.android_notification_phone_last_notification
    - sensor.brian_s_z_flip_7_last_notification
    attribute: post_time
  conditions:
  - condition: template
    value_template: '{{ trigger.to_state is not none and trigger.to_state.attributes.package
      == ''com.google.android.apps.chromecast.app'' }}'
  - condition: template
    value_template: '{{ ''package'' in ((trigger.to_state.attributes[''android.title'']
      | default('''')) ~ '' '' ~ (trigger.to_state.attributes[''android.text''] |
      default('''')) ~ '' '' ~ trigger.to_state.state) | lower }}'
  - condition: template
    value_template: '{{ this.attributes.last_triggered is none or (now() - this.attributes.last_triggered).total_seconds()
      > 120 }}'
  actions:
  - variables:
      gh_title: '{{ trigger.to_state.attributes[''android.title''] | default(''Package
        update'', true) }}'
      gh_body: '{{ trigger.to_state.attributes[''android.text''] | default(trigger.to_state.state,
        true) }}'
  - action: notify.mobile_app_nick_iphone
    data:
      title: "\U0001F4E6 {{ gh_title }}"
      message: '{{ gh_body }}'
      data:
        tag: doorbell-package
        group: cameras
  - action: persistent_notification.create
    data:
      title: "\U0001F4E6 {{ gh_title }} (Google Home)"
      message: '{{ gh_body }}'
  mode: single
  max_exceeded: silent
- id: llmvision_backyard_ai
  alias: AI - Backyard Camera Events
  description: 'Timeline-only AI summary of backyard motion. Created 2026-07-19 when
    the battery cam came back online. Reworked 2026-07-25: stream_analyzer produced
    ZERO timeline events across 34 motion triggers because the battery cam reports
    unavailable whenever it is asleep, so there was no live stream to analyze. The
    "Camera Event Recording" automation does successfully capture a 30s clip for the
    same events, so this now waits for that clip to finish and analyzes it with video_analyzer.
    Backyard has no continuous buffer (warm-only in keep_streams_alive), hence the
    event clip rather than the ring buffer used by the other three cameras.'
  triggers:
  - trigger: state
    entity_id:
    - event.backyard_camera_motion
  conditions:
  - condition: template
    value_template: '{{ this.attributes.last_triggered is none or (now() - this.attributes.last_triggered).total_seconds()
      > 300 }}'
  actions:
  - delay: 00:00:45
  - action: shell_command.check_clip
    data:
      cam: backyard
      seconds: 45
  - action: llmvision.video_analyzer
    data:
      provider: 01KX6N0GA1SYFVHSKZDJ0S6N8S
      video_file: /media/backyard_check.mp4
      max_frames: 12
      use_memory: true
      message: 'CAMERA CONTEXT: This camera watches the fenced private backyard of
        a Denver home. The back patio with a sliding glass door, grill and seating
        is on the left; a lawn with outdoor furniture fills the right; a wooden privacy
        fence with a gate runs across the back, with neighboring houses beyond it.
        Everything inside the fence is private property. People inside the yard are
        residents or guests unless clearly climbing the fence or forcing the gate.


        These frames are from a ~30 second clip recorded when motion was detected.
        Your memory contains a labeled reference photo of this backyard in its normal
        empty state. Compare the frames with that reference and report only what is
        NEW or DIFFERENT. Ignore lighting and shadow differences alone, and ignore
        furniture that has merely moved position.


        Describe the single most important NEW thing in ONE short sentence (max 12
        words), starting directly with the subject and action, e.g. "Person grilling
        on the patio", "Dog running across the lawn", "Person entering through the
        back gate". If nothing is new versus the reference, reply exactly: No activity.'
      include_filename: false
      max_tokens: 60
      store_in_timeline: true
      expose_images: true
      generate_title: true
    response_variable: backyard_ai
  mode: single
  max_exceeded: silent
- id: shadowfax_per_driver_trail
  alias: Shadowfax - Per-driver GPS trail
  description: Publishes Shadowfax GPS to per-driver MQTT trackers so the map shows
