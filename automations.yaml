        'speed') | default(0, true) }},\n \"drive_mode\": \"{{ state_attr('sensor.shadowfax_trip_data',
        'drive_mode') }}\"}"
- id: watchdog_z_flip_5_relay_offline
  alias: Watchdog - Z Flip 5 relay phone offline
  description: 'Created 2026-07-22: the Google Home notification relay (spare Z Flip
    5, "Android Notification Phone") silently stopped reporting to HA for ~23h after
    the 00:53 07-21 restart, killing Airbnb arrival detection. Alerts when the phone
    has not pushed a battery sensor update for 4 hours. The now() template trigger
    re-evaluates once per minute and fires once per offline episode.'
  triggers:
  - trigger: template
    value_template: "{{ states.sensor.android_notification_phone_battery_level is
      not none and\n   (now() - states.sensor.android_notification_phone_battery_level.last_updated).total_seconds()\n
      \  > 14400 }}"
  actions:
  - action: notify.mobile_app_brian_s_z_flip_7
    data:
      title: Relay phone offline
      message: 'The Z Flip 5 notification relay has not reported to HA for over 4
        hours (last update {{ states.sensor.android_notification_phone_battery_level.last_updated
        | as_local }}). Airbnb arrival detection via Google Home notifications is
        down. Check the phone: HA companion app connection, Wi-Fi, and whether it
        rebooted.'
      data:
        tag: relay-watchdog
        group: watchdog
  - action: persistent_notification.create
    data:
      notification_id: relay_phone_offline
      title: Relay phone offline
      message: The Z Flip 5 notification relay has not reported to HA for over 4 hours
        (last update {{ states.sensor.android_notification_phone_battery_level.last_updated
        | as_local }}). Airbnb arrival detection via Google Home notifications is
        down until it reconnects.
  mode: single
  max_exceeded: silent
- id: follow_me_lighting
  alias: 'Follow-Me Lighting: Brian'
  description: Turns on the lights in whichever room Bermuda reports Brian entering,
    and turns off the lights in the room he left (via his phone iBeacon). On/off switch
    is this automation's own enabled state — put automation.follow_me_lighting_brian
    on a dashboard and toggle it there; disabling it removes the trigger listener
    entirely. Primary Bedroom excluded both directions on request (someone else may
    still be in there).
  mode: queued
  triggers:
  - trigger: state
    entity_id: sensor.bermuda_e32fc30ca82d44629c46bf6e60ecd734_100_40004_area
    to:
  actions:
  - variables:
      excluded:
      - unknown
      - unavailable
      - Primary Bedroom
      to_area: '{{ trigger.to_state.attributes.get(''area_id'') if trigger.to_state
        is not none and trigger.to_state.state not in excluded else none }}'
      from_area: '{{ trigger.from_state.attributes.get(''area_id'') if trigger.from_state
        is not none and trigger.from_state.state not in excluded else none }}'
  - if: '{{ to_area is not none }}'
    then:
    - action: light.turn_on
      target:
        area_id: '{{ to_area }}'
  - if: '{{ from_area is not none }}'
    then:
    - action: light.turn_off
      target:
        area_id: '{{ from_area }}'
- id: proxmox_notification_relay
  alias: Proxmox notification relay
  description: 'Created 2026-07-25: four consecutive Proxmox backup failures (07-23
    22:30 through 07-25 00:43) went unnoticed for two days because the host cannot
    send mail - the ISP blocks outbound port 25, so 22 notification emails sat dead
    in the postfix queue. Proxmox now POSTs its notifications to this webhook instead
    of relying on SMTP. Severity arrives as info/notice/warning/error; warning and
    above also raise a persistent notification. The webhook is local_only and carries
    a random token, because /api/webhook is externally reachable via ha.northwoodscre.com.'
  triggers:
  - trigger: webhook
    webhook_id: proxmox_hV44yvKsE-wwr0zszM-Oh3Ziu9UuqP1U4ckj0F3gnYk
    allowed_methods:
    - POST
    local_only: true
  variables:
    sev: '{{ trigger.json.severity | default(''info'') }}'
    ptitle: '{{ trigger.json.title | default(''Proxmox notification'') }}'
    pmsg: '{{ trigger.json.message | default(''(no message body)'') }}'
  actions:
  - action: notify.mobile_app_brian_s_z_flip_7
    data:
      title: 'Proxmox: {{ ptitle }}'
      message: '{{ pmsg | truncate(600) }}'
      data:
        tag: proxmox-{{ sev }}
        group: proxmox
  - if:
    - condition: template
      value_template: '{{ sev in [''warning'', ''error''] }}'
    then:
    - action: persistent_notification.create
      data:
        notification_id: proxmox_{{ sev }}
        title: 'Proxmox: {{ ptitle }}'
        message: '{{ pmsg }}'
  mode: queued
  max: 10
- id: fstrim_thin_pool_reclaim
  alias: Reclaim thin pool (fstrim)
  description: 'Created 2026-07-25: nothing on this system ever issued TRIM, so the
    LVM thin volume backing VM 100 had grown to 189 GiB allocated for 56 GiB of real
    data. That tripled the nightly Proxmox backup (152 GB, 81 minutes) onto an SMR
    drive already running at roughly twice its rated annual workload; a single fstrim
    reclaimed ~123 GB. Runs daily at 10:00, deliberately far from the 04:00 backup:
    discards issued while vzdump holds the disk are silently dropped, and ext4 then
    marks those block groups already-trimmed, so a later fstrim reports success and
    reclaims nothing until the next reboot. If allocation ever drifts far above real
    usage again, check whether this ran during a backup.'
  triggers:
  - trigger: time
    at: '10:00:00'
  conditions: []
  actions:
  - action: shell_command.fstrim_data
    data: {}
  mode: single
  max_exceeded: silent
- id: watchdog_z_flip_5_relay_recovered
  alias: Watchdog - Z Flip 5 relay phone recovered
  description: 'Created 2026-07-25: watchdog_z_flip_5_relay_offline raised a mobile
    + persistent notification when the relay went quiet, but nothing ever cleared
    them - the persistent one stayed up indefinitely after the phone came back and
    had to be dismissed by hand (confirmed: watchdog fired 11:09 MDT 07-25, phone
    was reporting again while the notification still showed). This clears both when
    the phone recovers. The trigger is the exact inverse of the offline watchdog''s
    (< 14400 rather than > 14400): template triggers only fire on a false->true transition,
    and this template is true during normal operation, so it cannot fire on a reload
    or on an ordinary short reporting gap - only when the sensor comes back after
    a real 4h+ outage. Reuses tag relay-watchdog so the recovery push replaces the
    offline one in the notification shade instead of stacking.'
  triggers:
  - trigger: template
    value_template: "{{ states.sensor.android_notification_phone_battery_level is
      not none and\n   (now() - states.sensor.android_notification_phone_battery_level.last_updated).total_seconds()\n
      \  < 14400 }}"
  actions:
  - action: persistent_notification.dismiss
    data:
      notification_id: relay_phone_offline
  - action: notify.mobile_app_brian_s_z_flip_7
    data:
      title: Relay phone back online
      message: The Z Flip 5 notification relay is reporting to HA again (battery {{
        states('sensor.android_notification_phone_battery_level') }}%). Airbnb arrival
        detection via Google Home notifications is back up.
      data:
        tag: relay-watchdog
        group: watchdog
  mode: single
  max_exceeded: silent
- id: shadowfax_home_charging_accumulate
  alias: Shadowfax - accumulate home charging energy
  description: 'Credits home-charging energy LIVE during a session using a high-water
    mark. Energy is credited ONLY for SoC above the session max, which makes it immune
    to the sawtooth in sensor.shadowfax_battery_state_of_charge (drops ~0.5% then
    climbs back every ~1.5 min even parked/unplugged). DO NOT change this to sum positive
    deltas - that rectifies the noise and invented a phantom 41.343 kWh on 2026-07-27.
    DO NOT change it to credit only at session end either - that dumps a whole session
    into one hour bucket. Efficiency divisor 0.87 calibrated 2026-07-30 against the
    Rivian app: 31.1%->45.7% on a 130.19 kWh pack = 19.008 kWh into the battery vs
    21.9 kWh reported delivered at the wall = 86.8% efficient.'
  triggers:
  - trigger: state
    entity_id: binary_sensor.shadowfax_charging_status
    from: 'off'
    to: 'on'
    id: start
  - trigger: state
    entity_id: binary_sensor.shadowfax_charging_status
    from: 'on'
    to: 'off'
    for: 00:02:00
    id: stop
  - trigger: state
    entity_id: sensor.shadowfax_battery_state_of_charge
    id: progress
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: start
      - condition: state
        entity_id: device_tracker.shadowfax_location
        state:
        - Garage
        - home
      - condition: template
        value_template: '{{ states(''input_number.shadowfax_charge_session_start_soc'')
          | float(-1) < 0 }}'
      sequence:
      - action: input_number.set_value
        target:
          entity_id: input_number.shadowfax_charge_session_start_soc
        data:
          value: '{{ states(''sensor.shadowfax_battery_state_of_charge'') | float(0)
            | round(1) }}'
      - action: input_number.set_value
        target:
          entity_id: input_number.shadowfax_charge_session_max_soc
        data:
          value: '{{ states(''sensor.shadowfax_battery_state_of_charge'') | float(0)
            | round(1) }}'
    - conditions:
      - condition: trigger
        id: progress
      - condition: template
        value_template: '{{ states(''input_number.shadowfax_charge_session_max_soc'')
          | float(-1) >= 0 }}'
      - condition: template
        value_template: '{{ states(''sensor.shadowfax_battery_state_of_charge'') not
          in [''unknown'',''unavailable''] }}'
      - condition: template
        value_template: '{{ ((states(''sensor.shadowfax_battery_state_of_charge'')
          | float(0)) - (states(''input_number.shadowfax_charge_session_max_soc'')
          | float(0))) > 0 }}'
      sequence:
      - variables:
          gain: '{{ (states(''sensor.shadowfax_battery_state_of_charge'') | float(0))
            - (states(''input_number.shadowfax_charge_session_max_soc'') | float(0))
            }}'
          cap: '{{ states(''sensor.shadowfax_battery_capacity'') | float(130.19) }}'
      - condition: template
        value_template: '{{ gain > 0 and gain < 10 }}'
      - action: input_number.set_value
        target:
          entity_id: input_number.shadowfax_home_charging_total_kwh
        data:
          value: '{{ ((states(''input_number.shadowfax_home_charging_total_kwh'')
            | float(0)) + (gain / 100 * cap / 0.87)) | round(3) }}'
      - action: input_number.set_value
        target:
          entity_id: input_number.shadowfax_charge_session_max_soc
        data:
          value: '{{ states(''sensor.shadowfax_battery_state_of_charge'') | float(0)
            | round(1) }}'
    - conditions:
      - condition: trigger
        id: stop
      - condition: template
        value_template: '{{ states(''input_number.shadowfax_charge_session_start_soc'')
          | float(-1) >= 0 }}'
      sequence:
      - action: logbook.log
        data:
          name: Shadowfax charging
          message: session ended {{ states('input_number.shadowfax_charge_session_start_soc')
            }}% -> {{ states('input_number.shadowfax_charge_session_max_soc') }}%;
            running total {{ states('input_number.shadowfax_home_charging_total_kwh')
            }} kWh
      - action: input_number.set_value
        target:
          entity_id: input_number.shadowfax_charge_session_start_soc
        data:
          value: -1
      - action: input_number.set_value
        target:
          entity_id: input_number.shadowfax_charge_session_max_soc
        data:
          value: -1
  mode: queued
  max: 25
- id: envoy_spike_guard_alert
  alias: Envoy - spike guard rejection alert
  description: Fires when the raw Envoy daily-production sensor jumps by more than
    100 kWh in a single update - the lifetime-in-daily glitch signature (2026-05-08,
    2026-07-31). The guarded sensor absorbs it silently; this makes sure the device
    fault itself is not invisible.
  triggers:
  - trigger: state
    entity_id: sensor.envoy_202504003929_energy_production_today
  conditions:
  - condition: template
    value_template: '{{ trigger.from_state is not none and trigger.to_state is not
      none and trigger.from_state.state not in [''unknown'',''unavailable''] and trigger.to_state.state
      not in [''unknown'',''unavailable''] and ((trigger.to_state.state | float(0))
      - (trigger.from_state.state | float(0))) > 100 }}'
  actions:
  - action: notify.mobile_app_brian_s_z_flip_7
    data:
      title: Envoy glitch caught
      message: Raw solar sensor jumped {{ ((trigger.to_state.state | float(0)) - (trigger.from_state.state
        | float(0))) | round(0) }} kWh in one update ({{ trigger.from_state.state
        }} -> {{ trigger.to_state.state }}). The guarded sensor rejected it; Energy
        dashboard is unaffected. No action needed - this confirms the guard is working.
  - action: persistent_notification.create
    data:
      title: Envoy spike rejected
      notification_id: envoy_spike_guard
      message: '{{ now().strftime(''%Y-%m-%d %H:%M'') }}: raw jumped {{ ((trigger.to_state.state
        | float(0)) - (trigger.from_state.state | float(0))) | round(0) }} kWh; guard
        absorbed it.'
  mode: single
- id: cardperks_statement_drop_folder
  alias: 'CardPerks: import statements dropped in the folder'
