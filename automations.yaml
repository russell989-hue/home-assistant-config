    data:
      message: "{%- set alerts = state_attr('sensor.nws_alerts_gps_REDACTED_nws_alerts_alerts',
        'Alerts') or [] -%}\n        {%- set keywords = ['Thunderstorm', 'Hail', 'Tornado',
        'Severe', 'Wind Advisory', 'Winter Storm', 'Blizzard', 'Ice Storm', 'Flood',
        'Special Weather Statement'] -%}\n        {%- set matched = alerts | selectattr('Event',
        'defined') | selectattr('Event', 'search', keywords | join('|'), true) | list
        -%}\n        {%- set zones = state_attr('device_tracker.shadowfax_location',
        'in_zones') or [] -%}\n        {%- set sfx = '✅ Shadowfax is in the garage.'
        if 'zone.garage' in zones else ('⚠️ Shadowfax is at home but not in the garage.'
        if 'zone.home' in zones or 'zone.front_door' in zones else ('❗ Shadowfax is
        on the street — exposed.' if 'zone.street' in zones else '\U0001F6A8 Shadowfax
        is away from home!')) -%}\n\n        {%- for alert in matched %}\n        ⚠️
        {{ alert.Event }}\n        {{ alert.Headline | title }}\n        {%- if 'HAZARD...'
        in alert.Description %}\n        ⚡ Hazard: {{ alert.Description.split('HAZARD...')[1].split('\\n')[0]
        | trim | capitalize }}\n        {%- endif %}\n        \n        {% endfor
        %}\n        {{ sfx }}"
      title: '⚠️ Weather Alert:'
    target:
      entity_id:
      - notify.brian_s_z_flip_7
      - notify.galaxy_watch8_classic_qfxz
      - notify.iphone_2
      - notify.office_ipad
  - action: notify.persistent_notification
    data:
      message: "{%- set alerts = state_attr('sensor.nws_alerts_gps_REDACTED_nws_alerts_alerts',
        'Alerts') or [] -%}\n        {%- set keywords = ['Thunderstorm', 'Hail', 'Tornado',
        'Severe', 'Wind Advisory', 'Winter Storm', 'Blizzard', 'Ice Storm', 'Flood',
        'Special Weather Statement'] -%}\n        {%- set matched = alerts | selectattr('Event',
        'defined') | selectattr('Event', 'search', keywords | join('|'), true) | list
        -%}\n        {%- set zones = state_attr('device_tracker.shadowfax_location',
        'in_zones') or [] -%}\n        {%- set sfx = '✅ Shadowfax is in the garage.'
        if 'zone.garage' in zones else ('⚠️ Shadowfax is at home but not in the garage.'
        if 'zone.home' in zones or 'zone.front_door' in zones else ('❗ Shadowfax is
        on the street — exposed.' if 'zone.street' in zones else '\U0001F6A8 Shadowfax
        is away from home!')) -%}\n\n        {%- for alert in matched %}\n        ⚠️
        {{ alert.Event }}\n        {{ alert.Headline | title }}\n        {%- if 'HAZARD...'
        in alert.Description %}\n        ⚡ Hazard: {{ alert.Description.split('HAZARD...')[1].split('\\n')[0]
        | trim | capitalize }}\n        {%- endif %}\n        \n        {% endfor
        %}\n        {{ sfx }}"
      title: '⚠️ Weather Alert:'
    metadata: {}
