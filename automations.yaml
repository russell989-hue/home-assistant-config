- id: '1778962057533'
  alias: NWS Alerts
  description: ''
  triggers:
  - trigger: state
    entity_id: sensor.nws_alerts_gps_REDACTED_nws_alerts_alerts
  conditions:
  - condition: template
    value_template: '{% set alerts = state_attr(''sensor.nws_alerts_gps_REDACTED_nws_alerts_alerts'',
      ''alerts'') or [] %} {% set keywords = [''Thunderstorm'', ''Hail'', ''Tornado'',
      ''Severe'', ''Wind Advisory'', ''Winter Storm'', ''Blizzard'', ''Ice Storm'',
      ''Flood''] %} {{ alerts | selectattr(''event'', ''defined'') | selectattr(''event'',
      ''search'', keywords | join(''|'')) | list | count > 0 }}'
  actions:
  - action: notify.send_message
    target:
      entity_id:
      - notify.brian_s_z_flip_7
      - notify.galaxy_watch8_classic_qfxz
      - notify.iphone_2
      - notify.office_ipad
    data:
      title: '⚠️ Weather Alert:'
      message: "{%- set alerts = state_attr('sensor.nws_alerts_gps_REDACTED_nws_alerts_alerts',
        'alerts') or [] -%}\n{%- set keywords = ['Thunderstorm', 'Hail', 'Tornado',
        'Severe', 'Wind Advisory', 'Winter Storm', 'Blizzard', 'Ice Storm', 'Flood']
        -%}\n{%- set matched = alerts | selectattr('event', 'defined') | selectattr('event',
        'search', keywords | join('|')) | map(attribute='event') | list -%}\n{%- set
        zones = state_attr('device_tracker.shadowfax_location', 'in_zones') or []
        -%}\n{%- set sfx = '✅ Shadowfax is in the garage — protected.' if 'zone.garage'
        in zones else ('⚠️ Shadowfax is at home but not in the garage.' if 'zone.home'
        in zones or 'zone.front_door' in zones else ('❗ Shadowfax is on the street
        — exposed.' if 'zone.street' in zones else '\U0001F6A8 Shadowfax is away from
        home!')) -%}\n⚠️ NWS issued: {{ matched | join(', ') }}\n{{ sfx }}"
  - action: notify.persistent_notification
    metadata: {}
    data:
      title: '⚠️ Weather Alert:'
      message: "{%- set alerts = state_attr('sensor.nws_alerts_gps_REDACTED_nws_alerts_alerts',
        'alerts') or [] -%}\n{%- set keywords = ['Thunderstorm', 'Hail', 'Tornado',
        'Severe', 'Wind Advisory', 'Winter Storm', 'Blizzard', 'Ice Storm', 'Flood']
        -%}\n{%- set matched = alerts | selectattr('event', 'defined') | selectattr('event',
        'search', keywords | join('|')) | map(attribute='event') | list -%}\n{%- set
        zones = state_attr('device_tracker.shadowfax_location', 'in_zones') or []
        -%}\n{%- set sfx = '✅ Shadowfax is in the garage — protected.' if 'zone.garage'
        in zones else ('⚠️ Shadowfax is at home but not in the garage.' if 'zone.home'
        in zones or 'zone.front_door' in zones else ('❗ Shadowfax is on the street
        — exposed.' if 'zone.street' in zones else '\U0001F6A8 Shadowfax is away from
        home!')) -%}\n⚠️ NWS issued: {{ matched | join(', ') }}\n{{ sfx }}"
  mode: single
- id: '1778966311414'
  alias: Weather - Morning Forecast Alert
  description: ''
