  conditions:
  - condition: template
    value_template: '{% set alerts = state_attr(''sensor.nws_alerts_gps_REDACTED_nws_alerts_alerts'',
      ''Alerts'') or [] %} {% set keywords = [''Thunderstorm'', ''Hail'', ''Tornado'',
      ''Severe'', ''Wind Advisory'', ''Winter Storm'', ''Blizzard'', ''Ice Storm'',
      ''Flood'', ''Special Weather Statement''] %} {{ alerts | selectattr(''Event'',
