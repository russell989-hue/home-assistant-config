- id: trash_schedule_check
  alias: Trash Schedule - Check Tomorrow
  description: 'Sunday evening: check what''s being picked up Monday'
  triggers:
  - trigger: time
    at: '18:00:00'
  conditions:
  - condition: time
    weekday:
    - sun
  actions:
  - action: calendar.get_events
    target:
      entity_id: calendar.trash_recycling
    data:
      duration:
        hours: 48
    response_variable: agenda
  - variables:
      event_title: '{{ agenda[''calendar.trash_recycling''].events[0].summary | default('''')
        | lower }}

        '
  - action: input_boolean.turn_{{ 'on' if 'trash' in event_title else 'off' }}
    target:
      entity_id: input_boolean.rubbish
  - action: input_boolean.turn_{{ 'on' if 'recycle' in event_title else 'off' }}
    target:
      entity_id: input_boolean.recycle
  - action: input_boolean.turn_{{ 'on' if 'compost' in event_title else 'off' }}
    target:
      entity_id: input_boolean.compost
  - action: input_boolean.turn_{{ 'on' if 'large item' in event_title else 'off' }}
    target:
      entity_id: input_boolean.large_item
