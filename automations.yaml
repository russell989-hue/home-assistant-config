- alias: 'Basement: Sync occupancy boolean from smart sensor'
  trigger:
  - platform: state
    entity_id: binary_sensor.basement_guest_present
  action:
  - choose:
    - conditions:
      - condition: state
        entity_id: binary_sensor.basement_guest_present
        state: 'on'
      sequence:
      - service: input_boolean.turn_on
        target:
          entity_id: input_boolean.basement_airbnb_occupancy
    - conditions:
      - condition: state
        entity_id: binary_sensor.basement_guest_present
        state: 'off'
      sequence:
      - service: input_boolean.turn_off
        target:
          entity_id: input_boolean.basement_airbnb_occupancy
  mode: single
  id: 02c3b822751a4dbeb24246e44f67893d
