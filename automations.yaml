- id: doorbell_popup_ipads
  alias: 'Doorbell: front door popup on iPads'
  description: When the doorbell rings, show the front door live view on the Living
    Room and Office iPads for 30 seconds. Requires those browsers to be registered
    in Browser Mod with IDs living_room_ipad and office_ipad.
  triggers:
  - trigger: state
    entity_id:
    - event.doorbell_chime
    - event.front_door_ding
    not_from:
    - unknown
    - unavailable
    not_to:
    - unknown
    - unavailable
  conditions: []
  actions:
  - action: browser_mod.popup
    data:
      browser_id:
      - Office ipad
      - Office Desktop App
      title: Front Door
      size: wide
      timeout: 30000
      timeout_action: close
      content:
        type: custom:webrtc-camera
        url: doorbell
  mode: single
  max_exceeded: silent
- id: llmvision_doorbell_ai
  alias: AI - Doorbell Motion Summary
  description: 'Reworked 2026-07-20: SDM motion events arrive 15-25s late, so live
    stream_analyzer frames showed the empty aftermath. Now waits 20s then analyzes
    the last ~60s of the doorbell RING BUFFER via video_analyzer, same pattern as
    the Airbnb side-door automation.'
  triggers:
  - trigger: state
    entity_id:
    - event.doorbell_motion
    - event.doorbell_chime
    - event.front_door_motion
    - event.front_door_ding
  conditions:
  - condition: template
    value_template: "{{ this.attributes.last_triggered is none or\n   (now() - this.attributes.last_triggered).total_seconds()
      > 120 }}"
  actions:
  - delay: 00:00:20
  - action: shell_command.check_clip
    data:
      cam: doorbell
      seconds: 70
  - action: llmvision.video_analyzer
    data:
      provider: 01KX6N0GA1SYFVHSKZDJ0S6N8S
      video_file: /media/doorbell_check.mp4
      max_frames: 12
      use_memory: true
      message: 'CAMERA CONTEXT: This is the front door camera of a private Denver
        home. It looks straight down the home''s own front entrance walkway - a narrow
        concrete path between this house and the neighbor''s white modern building,
        with a wooden privacy fence and landscaping on the right, ending at the street
        sidewalk in the distance. A doormat sits at the bottom of the frame. This
        walkway is NOT an alley - always refer to it as the front door, front walkway,
        or sidewalk. People moving toward the camera are approaching the front door;
        people moving away are heading out to the street.


        These frames are from the last ~60 seconds of continuous footage from this
        camera, captured just after motion was detected. Your memory contains a labeled
        reference photo of this front door walkway in its normal empty state. Compare
        the frames with that reference and report only what is NEW or DIFFERENT. Ignore
        lighting and shadow differences alone. IMPORTANT: a package, box, envelope,
        or bag left on or near the doormat or walkway that is not in the reference
        counts as important activity even if no person is visible - report it, e.g.
        "Package left on the doormat".


        You are writing a phone notification about front door camera activity. Only
        the first few words are visible, so lead with the single most important fact.
        Reply with ONE short sentence (max 12 words). Never start with filler like
        "The image shows", "A sequence of", or "There is" - start directly with the
        subject and action, e.g. "Amazon driver leaving a package", "Two visitors
        ringing the doorbell", "Package left on the doormat". Focus on people, deliveries,
        and vehicles. If nothing is new versus the reference, reply exactly: No activity.'
      include_filename: false
      max_tokens: 60
      store_in_timeline: true
      expose_images: true
      generate_title: true
    response_variable: doorbell_ai
  - variables:
      doorbell_key_frame: '{{ (doorbell_ai.key_frame | default('''')).replace(''/media'',
        ''/media/local'') }}'
      snap_token: '{{ now().timestamp() | int }}{{ range(100000, 999999) | random
        }}'
  - condition: template
    value_template: '{{ not (doorbell_ai.response_text | trim | lower).startswith(''no
      activity'') }}'
  - action: notify.mobile_app_brian_s_z_flip_7
    data:
      title: '{{ doorbell_ai.title | default(''Front Door'', true) }}'
      message: '{{ doorbell_ai.response_text }}'
      data:
        image: '{{ doorbell_key_frame }}'
        clickAction: '{{ doorbell_key_frame }}'
        url: '{{ doorbell_key_frame }}'
        tag: doorbell-ai
        group: cameras
        alert_once: true
        actions:
        - action: URI
          title: Live View
          uri: /mobile-test/cameras
  - action: shell_command.cache_snapshot
    data:
      src: '{{ doorbell_ai.key_frame }}'
      name: doorbell
      token: '{{ snap_token }}'
  - action: persistent_notification.create
    data:
      title: '{{ doorbell_ai.title | default(''Front Door'', true) }}'
      message: '{{ doorbell_ai.response_text }}


        ![snapshot](/local/notif/doorbell_{{ snap_token }}.jpg)


        [View camera](/zenobia-home/camera-doorbell)'
  - if:
    - condition: template
      value_template: '{{ [''package'', ''deliver'', ''parcel'', ''courier'', ''amazon'',
        ''fedex'', ''usps'', ''dhl'', ''ups '', ''dropping off''] | select(''in'',
        ((doorbell_ai.title | default('''')) ~ '' '' ~ doorbell_ai.response_text ~
        '' '') | lower) | list | count > 0 }}'
    then:
    - action: notify.mobile_app_nick_iphone
      data:
        title: Package at the front door
        message: '{{ doorbell_ai.response_text }}'
        data:
          image: '{{ doorbell_key_frame }}'
          tag: doorbell-package
          group: cameras
  mode: single
  max_exceeded: silent
- id: llmvision_airbnb_door_tracking
  alias: AI - Airbnb Guest Door Tracking
  description: 'Reworked 2026-07-20 after a missed guest departure: SDM motion events
    arrive 15-25s late, so live-stream analysis saw empty frames. Now waits 20s then
    analyzes the last ~45s of the side_door RING BUFFER (the only source that reliably
    contains the person). Also triggers from Google Home person notifications via
    the phone relay, which often beat the SDM event.'
  triggers:
  - trigger: state
    entity_id: event.side_door_camera_motion
    id: sdm
  - trigger: state
    entity_id:
    - sensor.android_notification_phone_last_notification
    - sensor.brian_s_z_flip_7_last_notification
    attribute: post_time
    id: gh
  conditions:
  - condition: template
    value_template: '{{ trigger.id != ''gh'' or (trigger.to_state is not none and
      trigger.to_state.attributes.package == ''com.google.android.apps.chromecast.app''
      and ''side'' in ((trigger.to_state.attributes[''android.title''] | default(''''))
      ~ '' '' ~ (trigger.to_state.attributes[''android.text''] | default(''''))) |
      lower and ''person'' in ((trigger.to_state.attributes[''android.title''] | default(''''))
      ~ '' '' ~ (trigger.to_state.attributes[''android.text''] | default(''''))) |
      lower) }}'
  actions:
  - delay: 00:00:20
  - action: shell_command.check_clip
    data:
      cam: side_door
      seconds: 55
  - action: llmvision.video_analyzer
    data:
      provider: 01KX6N0GA1SYFVHSKZDJ0S6N8S
      video_file: /media/side_door_check.mp4
      max_frames: 12
      message: 'CAMERA CONTEXT: This overhead camera watches the side yard of a private
        Denver home. A concrete walkway runs along the bottom of the frame; a wooden
        fence and AC units fill the middle. CRITICAL GEOMETRY: the Airbnb guest door
        itself is NOT visible in the frame - it sits below the bottom-right corner,
        reached by a recessed stairwell that appears only as the dark band along the
        bottom-right edge. Anyone using the door must descend into or climb out of
        that dark recess. The walkway is a semi-public path: neighbors and passersby
        regularly walk through without using the door. Refer to it as the side door
        or side walkway.


        This is the last ~45 seconds of continuous footage after motion was detected.
        Judge what the person DID across the frame sequence:

        ENTERING = the person moves to the dark recessed entry at the bottom-right
        and descends or disappears into it (they do not walk out of frame along the
        walkway).

        LEAVING = the person first appears climbing out of that dark recessed entry,
        then walks away along the walkway.

        PASSING = the person walks along the walkway and leaves the frame at an edge
        without stopping at or entering the recessed entry.

        UNCLEAR = no person is visible, or you cannot tell.

        A person standing at the recessed entry, reaching down into it, or lingering
        over it is USING the door area - classify by their direction of travel, not
        as PASSING. Reply with exactly two lines: line 1 is one word only - ENTERING,
        LEAVING, PASSING, or UNCLEAR. Line 2 is one short factual sentence describing
        what happened.'
      include_filename: false
      max_tokens: 80
      store_in_timeline: true
      expose_images: true
      generate_title: true
    response_variable: door_ai
  - variables:
      lock_recent: '{{ (as_timestamp(now()) - as_timestamp(states.sensor.side_door_operator.last_changed))
        < 180 }}'
      door_ai_key_frame: '{{ (door_ai.key_frame | default('''')).replace(''/media'',
        ''/media/local'') }}'
      door_ai_detail: '{% set lines = door_ai.response_text.split(''\n'') | map(''trim'')
        | reject(''eq'', '''') | list %} {{- (lines[1] if lines | length > 1 else
        '''') | trim }}'
      snap_token: '{{ now().timestamp() | int }}{{ range(100000, 999999) | random
        }}'
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ (door_ai.response_text | trim | upper).startswith(''ENTERING'')
          }}'
      sequence:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.airbnb_guest_vision_says
      - if:
        - condition: template
          value_template: '{{ not lock_recent }}'
        then:
        - action: input_boolean.turn_on
          target:
            entity_id: input_boolean.airbnb_guest_downstairs
      - action: notify.mobile_app_brian_s_z_flip_7
        data:
          title: Airbnb - Guest arrived
          message: '{{ door_ai_detail if door_ai_detail else ''Guest entered through
            the side door.'' }}'
          data:
            image: '{{ door_ai_key_frame }}'
            clickAction: '{{ door_ai_key_frame }}'
            url: '{{ door_ai_key_frame }}'
            tag: airbnb-door
            group: cameras
            actions:
            - action: URI
              title: Live View
              uri: /airbnb-dashboard
      - action: shell_command.cache_snapshot
        data:
          src: '{{ door_ai.key_frame }}'
          name: side_door
          token: '{{ snap_token }}'
      - action: persistent_notification.create
        data:
          title: Airbnb - Guest arrived
          message: '{{ door_ai_detail if door_ai_detail else ''Guest entered through
            the side door.'' }}


            ![snapshot](/local/notif/side_door_{{ snap_token }}.jpg)


            [View camera](/zenobia-home/camera-side-door)'
    - conditions:
      - condition: template
        value_template: '{{ (door_ai.response_text | trim | upper).startswith(''LEAVING'')
          }}'
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.airbnb_guest_vision_says
      - if:
        - condition: template
          value_template: '{{ not lock_recent }}'
        then:
        - action: input_boolean.turn_off
          target:
            entity_id: input_boolean.airbnb_guest_downstairs
      - action: notify.mobile_app_brian_s_z_flip_7
        data:
          title: Airbnb - Guest left
          message: '{{ door_ai_detail if door_ai_detail else ''Guest exited through
            the side door.'' }}'
          data:
            image: '{{ door_ai_key_frame }}'
            clickAction: '{{ door_ai_key_frame }}'
            url: '{{ door_ai_key_frame }}'
            tag: airbnb-door
            group: cameras
            actions:
            - action: URI
              title: Live View
              uri: /airbnb-dashboard
      - action: shell_command.cache_snapshot
        data:
          src: '{{ door_ai.key_frame }}'
          name: side_door
          token: '{{ snap_token }}'
      - action: persistent_notification.create
        data:
          title: Airbnb - Guest left
          message: '{{ door_ai_detail if door_ai_detail else ''Guest exited through
            the side door.'' }}


            ![snapshot](/local/notif/side_door_{{ snap_token }}.jpg)


            [View camera](/zenobia-home/camera-side-door)'
  mode: single
  max_exceeded: silent
- id: camera_event_recording
  alias: Camera Event Recording (15-day history)
  description: 'Reworked 2026-07-26. Cameras WITH a continuous buffer (doorbell, side_door,
    garage) now have their saved clip CUT FROM THAT BUFFER instead of recorded via
    camera.record. Evidence: on 07-26 side_door saw 10 SDM motion events and camera.record
    produced 1 clip, while the buffer-sourced AI handled 8 of the same 10 - camera.record
    must negotiate a second Nest session against an already contended go2rtc stream
    and usually loses (a manual probe took 50s for an 8s recording). Its lookback
    is also a no-op here (lookback=20 measured a 0.77s contribution), so clips used
    to start AFTER the person arrived, given Nest''s 15-25s event latency. Cutting
    from the buffer gives real lookback: wait 30s, take 60s, yielding roughly T-30s..T+30s.
    Cameras WITHOUT a buffer (backyard, alley) keep camera.record unchanged. Output
    path, filename convention and format are identical, so archive_recordings.sh and
    the Office PC pull are unaffected.'
  mode: parallel
  max: 10
  triggers:
  - trigger: state
    entity_id:
    - event.doorbell_motion
    - event.doorbell_chime
    - event.side_door_camera_motion
    - event.garage_camera_motion
    - event.alley_motion
    - event.backyard_camera_motion
  variables:
    cam_map:
      event.doorbell_motion: camera.doorbell_snapshot
      event.doorbell_chime: camera.doorbell_snapshot
      event.side_door_camera_motion: camera.side_door_snapshot
      event.garage_camera_motion: camera.garage_snapshot
      event.alley_motion: camera.alley_live_view
      event.backyard_camera_motion: camera.backyard_snapshot
    folder_map:
      event.doorbell_motion: doorbell
      event.doorbell_chime: doorbell
      event.side_door_camera_motion: side_door
      event.garage_camera_motion: garage
      event.alley_motion: alley
      event.backyard_camera_motion: backyard
    rec_file: /media/recordings/{{ folder_map[trigger.entity_id] }}/{{ now().strftime('%Y-%m-%d_%H-%M-%S')
      }}.mp4
  actions:
  - choose:
    - alias: Buffered cameras - cut the saved clip from the continuous ring buffer
      conditions:
      - condition: template
        value_template: '{{ folder_map[trigger.entity_id] in [''doorbell'', ''side_door'',
          ''garage''] }}'
      sequence:
      - delay: 00:00:20
      - action: shell_command.event_clip
        data:
          cam: '{{ folder_map[trigger.entity_id] }}'
          seconds: 70
          out: '{{ rec_file }}'
      - action: shell_command.trim_clip
        data:
          f: '{{ rec_file }}'
    default:
    - action: camera.record
      target:
        entity_id: '{{ cam_map[trigger.entity_id] }}'
      data:
        filename: '{{ rec_file }}'
        duration: 30
        lookback: 20
  - action: shell_command.fix_recording
    data:
      f: '{{ rec_file }}'
