- id: f80691550f284240a3ecce6d5eb22c45
  alias: 'Airbnb: Lock says guest inside'
  description: Reworked 2026-07-25. The door lock is now the PRIMARY presence signal
    and LLM Vision is only a fallback. A guest keypad code (operator format "MM/DD
    Name", e.g. "07/23 Katie") can only be entered from outside, so it proves arrival.
    "Manual Lock" is the interior thumbturn, so it proves someone is inside. Both
    set the boolean and stamp the inside-signal time that the decay automation reads.
  mode: single
  triggers:
  - trigger: state
    entity_id: sensor.side_door_operator
  conditions:
  - condition: state
    entity_id: calendar.zenobia_airbnb
    state: 'on'
  - condition: template
    value_template: '{% set s = trigger.to_state.state if trigger.to_state else ''''
      %} {{ s == ''Manual Lock'' or (s | regex_match(''^\\d{2}/\\d{2}\\s'')) }}'
  actions:
  - action: input_datetime.set_datetime
    target:
      entity_id: input_datetime.basement_last_inside_signal
    data:
      datetime: '{{ now().strftime(''%Y-%m-%d %H:%M:%S'') }}'
  - action: input_boolean.turn_on
    target:
      entity_id: input_boolean.airbnb_guest_downstairs
- id: 56a9a577389244b3a89d33efea82336d
  alias: 'Airbnb: Lock says guest left'
  description: '"One-Touch Lock" is the exterior lock button - a deliberate lock-behind-you,
    so it means departure. Note it fired exactly ONCE in the 8 weeks to 2026-07-25,
    so it cannot carry departure on its own; the decay automation does most of that
    work. "Manual Unlock" is deliberately NOT used here - it only means the door was
    opened from inside, and guests routinely do that and stay (observed 2026-07-23
    19:39).'
  mode: single
  triggers:
  - trigger: state
    entity_id: sensor.side_door_operator
    to: One-Touch Lock
  conditions:
  - condition: state
    entity_id: calendar.zenobia_airbnb
    state: 'on'
  actions:
  - action: input_datetime.set_datetime
    target:
      entity_id: input_datetime.basement_last_outside_signal
    data:
      datetime: '{{ now().strftime(''%Y-%m-%d %H:%M:%S'') }}'
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.airbnb_guest_downstairs
- id: 6293266aca9b46568620c131ee4a139a
  alias: 'Airbnb: Motion corroborates guest inside'
  description: Downstairs occupancy while booked is independent proof the guest is
    in. Refreshes the inside-signal stamp so the decay clock restarts.
  mode: single
  triggers:
  - trigger: state
    entity_id: binary_sensor.downstairs_occupancy
    to: 'on'
  conditions:
  - condition: state
    entity_id: calendar.zenobia_airbnb
    state: 'on'
  actions:
  - action: input_datetime.set_datetime
    target:
      entity_id: input_datetime.basement_last_inside_signal
    data:
      datetime: '{{ now().strftime(''%Y-%m-%d %H:%M:%S'') }}'
  - action: input_boolean.turn_on
    target:
      entity_id: input_boolean.airbnb_guest_downstairs
- id: 02c3b822751a4dbeb24246e44f67893d
  alias: 'Airbnb: Presence decay / booking end'
  description: Locks prove presence but not absence, so departure is inferred. Clears
    the guest boolean when there has been no inside signal and no downstairs occupancy
    for the confidence window - 3h normally, 10h during the 22:00-09:00 sleep window
    - which is the same decay the old binary_sensor.basement_guest_present template
    used. Also clears immediately when the booking ends.
  mode: single
  triggers:
  - trigger: time_pattern
    minutes: /15
    id: tick
  - trigger: state
    entity_id: calendar.zenobia_airbnb
    to: 'off'
    id: booking_end
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: booking_end
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.airbnb_guest_downstairs
    - conditions:
      - condition: state
        entity_id: input_boolean.airbnb_guest_downstairs
        state: 'on'
      - condition: state
        entity_id: binary_sensor.downstairs_occupancy
        state: 'off'
      - condition: template
        value_template: '{% set hour = now().hour %} {% set window = 10 if (hour >=
          22 or hour < 9) else 3 %} {% set inside = as_timestamp(states(''input_datetime.basement_last_inside_signal''))
          | float(0) %} {% set motion = as_timestamp(states.binary_sensor.downstairs_occupancy.last_changed)
          | float(0) %} {% set newest = [inside, motion] | max %} {{ (as_timestamp(now())
          - newest) / 3600 > window }}'
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.airbnb_guest_downstairs
