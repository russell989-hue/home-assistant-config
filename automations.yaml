  conditions: []
  actions:
  - action: weather.get_forecasts
    target:
      entity_id: weather.home
    data:
      type: hourly
    response_variable: hourly_forecast
  - condition: template
    value_template: '{% set bad = [''lightning'', ''lightning-rainy'', ''hail'', ''exceptional'',
      ''pouring'', ''hurricane'', ''tornado''] %} {% set forecast = hourly_forecast[''weather.home''][''forecast''][:12]
      %} {{ forecast | selectattr(''condition'', ''in'', bad) | list | count > 0 }}'
  - action: notify.send_message
    target:
      entity_id: notify.brian_s_z_flip_7
    data:
      title: "\U0001F329️ Severe Weather Forecast Today"
      message: "{%- set bad = ['lightning', 'lightning-rainy', 'hail', 'exceptional',
        'pouring', 'hurricane', 'tornado'] -%}\n{%- set forecast = hourly_forecast['weather.home']['forecast'][:12]
