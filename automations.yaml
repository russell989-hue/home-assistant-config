- id: doorbell_popup_ipads
  alias: 'Doorbell: front door popup on iPads'
  description: When the doorbell rings, show the front door live view on the Living
    Room and Office iPads for 30 seconds. Requires those browsers to be registered
    in Browser Mod with IDs living_room_ipad and office_ipad.
  triggers:
  - trigger: state
    entity_id:
    - event.doorbell_chime
    - event.front_door_ding
    not_from:
    - unknown
    - unavailable
    not_to:
    - unknown
    - unavailable
  conditions: []
  actions:
  - action: browser_mod.popup
    data:
      browser_id:
      - Office ipad
      - Office Desktop App
      title: Front Door
      size: wide
      timeout: 30000
      timeout_action: close
      content:
        type: custom:webrtc-camera
        url: doorbell
  mode: single
  max_exceeded: silent
- id: llmvision_doorbell_ai
  alias: AI - Doorbell Motion Summary
  mode: single
  max_exceeded: silent
  triggers:
  - trigger: state
    entity_id:
    - event.doorbell_motion
    - event.doorbell_chime
  conditions:
  - condition: template
    value_template: "{{ this.attributes.last_triggered is none or\n   (now() - this.attributes.last_triggered).total_seconds()
      > 120 }}"
  actions:
  - action: llmvision.stream_analyzer
    data:
      provider: 01KX6N0GA1SYFVHSKZDJ0S6N8S
      image_entity:
      - camera.doorbell_snapshot
      duration: 5
      max_frames: 5
      message: Briefly summarize what is happening at the front door. Focus on people,
        deliveries, and vehicles.
      include_filename: false
      max_tokens: 200
      store_in_timeline: true
      expose_images: true
      generate_title: true
    response_variable: doorbell_ai
  - action: notify.mobile_app_brian_s_z_flip_7
    data:
      title: Front Door
      message: '{{ doorbell_ai.response_text }}'
- id: llmvision_airbnb_door_tracking
  alias: AI - Airbnb Guest Door Tracking
  mode: single
  max_exceeded: silent
  triggers:
  - trigger: state
    entity_id: event.side_door_camera_motion
  actions:
  - action: llmvision.stream_analyzer
    data:
      provider: 01KX6N0GA1SYFVHSKZDJ0S6N8S
      image_entity:
      - camera.side_door_snapshot
      duration: 8
      max_frames: 8
      message: 'This is the exterior camera at an Airbnb guest entrance door. A person
        triggered motion. Based on the sequence of frames, determine if the person
        ENTERED the house (approached and went in through the door) or LEFT the house
        (came out of the door and walked away). Reply with exactly two lines: line
        1 is one word only - ENTERING, LEAVING, or UNCLEAR. Line 2 is one short factual
        sentence describing what happened.'
      include_filename: false
      max_tokens: 80
      store_in_timeline: true
      expose_images: true
      generate_title: true
    response_variable: door_ai
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ (door_ai.response_text | trim | upper).startswith(''ENTERING'')
          }}'
      sequence:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.airbnb_guest_downstairs
      - action: notify.mobile_app_brian_s_z_flip_7
        data:
          title: Airbnb
          message: Guest arrived - entered through the side door.
    - conditions:
      - condition: template
        value_template: '{{ (door_ai.response_text | trim | upper).startswith(''LEAVING'')
          }}'
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.airbnb_guest_downstairs
      - action: notify.mobile_app_brian_s_z_flip_7
        data:
          title: Airbnb
          message: Guest left - exited through the side door.
- id: camera_event_recording
  alias: Camera Event Recording (15-day history)
  mode: parallel
  max: 10
  triggers:
  - trigger: state
    entity_id:
    - event.doorbell_motion
    - event.doorbell_chime
    - event.side_door_camera_motion
    - event.garage_camera_motion
    - event.alley_motion
    - event.backyard_camera_motion
  variables:
    cam_map:
      event.doorbell_motion: camera.doorbell_snapshot
      event.doorbell_chime: camera.doorbell_snapshot
      event.side_door_camera_motion: camera.side_door_snapshot
      event.garage_camera_motion: camera.garage_snapshot
      event.alley_motion: camera.alley_live_view
      event.backyard_camera_motion: camera.backyard_snapshot
    folder_map:
      event.doorbell_motion: doorbell
      event.doorbell_chime: doorbell
      event.side_door_camera_motion: side_door
      event.garage_camera_motion: garage
      event.alley_motion: alley
      event.backyard_camera_motion: backyard
    rec_file: /media/recordings/{{ folder_map[trigger.entity_id] }}/{{ now().strftime('%Y-%m-%d_%H-%M-%S')
      }}.mp4
  actions:
  - action: camera.record
    target:
      entity_id: '{{ cam_map[trigger.entity_id] }}'
    data:
      filename: '{{ rec_file }}'
      duration: 30
      lookback: 4
  - action: shell_command.fix_recording
    data:
      f: '{{ rec_file }}'
- id: recordings_nightly_archive
  alias: Recordings - Nightly Archive to Office PC
  triggers:
  - trigger: time
    at: 02:00:00
  actions:
  - action: shell_command.archive_recordings
    response_variable: arch
  - if:
    - condition: template
      value_template: '{{ (arch | default({''returncode'': 0})).returncode | default(0)
        != 0 }}'
    then:
    - action: persistent_notification.create
      data:
        notification_id: recordings_archive_failed
        title: Recording Archive Failed
