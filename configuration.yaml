    name: Speakeasy — Show Other Lights
    icon: mdi:lightbulb-multiple

  living_room_show_media:
    name: Living Room — Show Media Controls
    icon: mdi:cast


input_number:
  shadowfax_trip_start_odometer:
    name: "Shadowfax Trip Start Odometer"
    min: 0
    max: 999999
    step: 0.1
    mode: box

  shadowfax_trip_start_battery:
    name: "Shadowfax Trip Start Battery"
    min: 0
    max: 100
    step: 0.1
    mode: box

  decrement:
    name: Decrement Helper
    min: 0
    max: 100
    step: 1
    icon: mdi:minus

  increment:
    name: Increment Helper
    min: 0
    max: 100
    step: 1
    icon: mdi:plus


input_text:
  shadowfax_trip_start_location:
    name: "Shadowfax Trip Start Location"
    max: 100

  set_value:
    name: Set Value Helper
    max: 255
    icon: mdi:form-textbox


light:
  - platform: group
    name: Speakeasy All Cans
    unique_id: speakeasy_all_cans
    entities:
      - light.tz3210_dwzfzfjc_ts0505b
      - light.tz3210_dwzfzfjc_ts0505b_2
