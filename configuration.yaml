# Loads default set of integrations. Do not remove.
default_config:
## AUTO FIND ENTITIES
ssdp:
# provides predictions of what entities the user is most likely to interact with. This is used in the frontend to surface the most relevant entities to the user.
usage_prediction:

##Over the air updates allowed for zigby devices
zha:
  zigpy_config:
    ota:
      otau_directory: /config/zigpy_ota # Keep this for local files
      extra_providers:
        - type: sonoff

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes
  extra_module_url:
    - /hacsfiles/Bubble-Card/bubble-pop-up-fix.js
    - /hacsfiles/material-you-utilities/material-you-utilities.min.js
    - /cardperks/static/fonts.js

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml


input_select:
  shadowfax_map_lookback:
    name: "Shadowfax Map Lookback"
    icon: mdi:map-clock
    options:
      - "3 hours"
      - "12 hours"
      - "24 hours"
      - "3 days"
      - "7 days"
    initial: "24 hours"

mqtt:
  device_tracker:
    - name: "Shadowfax Brian"
      unique_id: shadowfax_driver_brian
      state_topic: "shadowfax/brian/state"
      json_attributes_topic: "shadowfax/brian/attributes"
      icon: mdi:car-side
    - name: "Shadowfax Nick"
      unique_id: shadowfax_driver_nick
      state_topic: "shadowfax/nick/state"
      json_attributes_topic: "shadowfax/nick/attributes"
      icon: mdi:car-sports

template:
  - switch:
      - name: "Follow-Me Lighting"
        unique_id: follow_me_lighting_switch
        icon: mdi:walk
        # Watch-friendly proxy: Wear OS favorites can't show automation entities,
        # so this switch mirrors/controls the automation's enabled state.
        state: "{{ is_state('automation.follow_me_lighting_brian', 'on') }}"
        turn_on:
          - action: automation.turn_on
            target:
              entity_id: automation.follow_me_lighting_brian
        turn_off:
          - action: automation.turn_off
            target:
              entity_id: automation.follow_me_lighting_brian
  - binary_sensor:
      - name: "MA Queue Active"
        unique_id: ma_queue_active
        icon: mdi:playlist-music
        state: >
          {{ state_attr('media_player.living_room_sonos', 'active_queue') is not none
             or state_attr('media_player.office_sonos', 'active_queue') is not none
             or state_attr('media_player.jbl_ma510_ce9841_4', 'active_queue') is not none }}
  - sensor:
      - name: "AirBnB Guest"
        unique_id: airbnb_guest_status
        state: "{{ 'Home' if is_state('input_boolean.airbnb_guest_downstairs', 'on') else 'Out' }}"
        icon: "{{ 'mdi:account' if is_state('input_boolean.airbnb_guest_downstairs', 'on') else 'mdi:account-arrow-right' }}"
  - binary_sensor:
      - name: "Basement Guest Present"
        unique_id: basement_guest_present
        device_class: occupancy
        icon: >
          {{ 'mdi:account-check' if this.state == 'on' else 'mdi:account-off' }}
        state: >
          {% if not is_state('calendar.zenobia_airbnb', 'on') %}
            false
          {% else %}
            {% set now_ts = as_timestamp(now()) %}

            {% set inside_ts = as_timestamp(states('input_datetime.basement_last_inside_signal')) | float(0) %}
            {% set outside_ts = as_timestamp(states('input_datetime.basement_last_outside_signal')) | float(0) %}
            {% set hours_since_inside = ((now_ts - inside_ts) / 3600) | float(999) %}
            {% set hours_since_outside = ((now_ts - outside_ts) / 3600) | float(999) %}

            {% set motion_active = is_state('binary_sensor.downstairs_occupancy', 'on') %}
            {% set motion_ts = as_timestamp(states.binary_sensor.downstairs_occupancy.last_changed) | float(0) %}
            {% set hours_since_motion = ((now_ts - motion_ts) / 3600) | float(999) %}

            {% set hour = now().hour %}
            {% set is_sleep_window = (hour >= 22) or (hour < 9) %}
            {% set confidence_hours = 10 if is_sleep_window else 3 %}

            {% if motion_active %}
              true
            {% elif outside_ts > inside_ts and outside_ts > 0 and hours_since_outside < 24 %}
              false
            {% elif inside_ts > outside_ts and hours_since_inside < confidence_hours %}
              true
            {% elif hours_since_motion < confidence_hours %}
              true
            {% else %}
              false
            {% endif %}
          {% endif %}

        attributes:
          booking_active: "{{ is_state('calendar.zenobia_airbnb', 'on') }}"
          hours_since_inside: >
            {% set ts = as_timestamp(states('input_datetime.basement_last_inside_signal')) | float(0) %}
            {{ ((as_timestamp(now()) - ts) / 3600) | round(1) }}
          hours_since_outside: >
            {% set ts = as_timestamp(states('input_datetime.basement_last_outside_signal')) | float(0) %}
            {{ ((as_timestamp(now()) - ts) / 3600) | round(1) }}
          hours_since_motion: >
            {% set m = states.binary_sensor.downstairs_occupancy %}
            {{ ((as_timestamp(now()) - as_timestamp(m.last_changed) | float(0)) / 3600) | round(1) }}
          sleep_window_active: "{{ (now().hour >= 22) or (now().hour < 9) }}"
          confidence_window_hours: "{{ 10 if ((now().hour >= 22) or (now().hour < 9)) else 3 }}"
          last_decisive_signal: >
            {% set inside_ts = as_timestamp(states('input_datetime.basement_last_inside_signal')) | float(0) %}
            {% set outside_ts = as_timestamp(states('input_datetime.basement_last_outside_signal')) | float(0) %}
            {% if outside_ts > inside_ts %}outside{% elif inside_ts > 0 %}inside{% else %}none{% endif %}

  - trigger:
      - trigger: time
        at: "00:00:00"
      - trigger: homeassistant
        event: start
    action:
      - action: calendar.get_events
        target:
          entity_id: calendar.trash_recycling
        data:
          duration:
            days: 180
        response_variable: agenda
    sensor:
      - name: "Next Large Item Pickup"
        unique_id: next_large_item_pickup
        icon: mdi:sofa
        state: >
          {% set events = agenda['calendar.trash_recycling'].events | default([]) %}
          {% set ns = namespace(found='None scheduled') %}
          {% for event in events %}
            {% if 'large item' in (event.summary | default('') | lower) and ns.found == 'None scheduled' %}
              {% set ns.found = as_datetime(event.start).strftime('%b %-d') %}
            {% endif %}
          {% endfor %}
          {{ ns.found }}

  # --- SECTION 1: TRIGGER-BASED SENSORS (Location & Trip Data) ---
  - trigger:
      - platform: state
        entity_id: device_tracker.shadowfax_location
    condition:
      - condition: template
        value_template: >
          {{ states('sensor.shadowfax_active_driver') != 'None' or 
             states('sensor.shadowfax_gear_status') != 'park' }}
    sensor:
      - name: "Shadowfax Trip Data"
        unique_id: shadowfax_trip_data
        state: "{{ states('sensor.shadowfax_active_driver') }}"
        attributes:
          latitude: "{{ state_attr('device_tracker.shadowfax_location', 'latitude') }}"
          longitude: "{{ state_attr('device_tracker.shadowfax_location', 'longitude') }}"
          speed: "{{ state_attr('device_tracker.shadowfax_location', 'speed') | float(0) }}"
          drive_mode: "{{ states('sensor.shadowfax_drive_mode') }}"

  # --- SECTION 2: STATE-BASED SELECTS (Seat Controls) ---
  - select:
      - name: "Driver Seat Combined"
        unique_id: driver_seat_combined
        options: "{{ ['Off', 'Heat 1', 'Heat 2', 'Heat 3', 'Cool 1', 'Cool 2', 'Cool 3'] }}"
        state: >
          {% set h = states('select.shadowfax_seat_front_left_heat') %}
          {% set v = states('select.shadowfax_seat_front_left_vent') %}
          {% if h != 'Off' and 'Level' in h %} Heat {{ h.split('_')[1] }}
          {% elif v != 'Off' and 'Level' in v %} Cool {{ v.split('_')[1] }}
          {% else %} Off {% endif %}
        select_option:
          - action: select.select_option
            target:
              entity_id: [select.shadowfax_seat_front_left_heat, select.shadowfax_seat_front_left_vent]
            data: { option: "Off" }
          - action: select.select_option
            target:
              entity_id: >
                {% if 'Heat' in option %} select.shadowfax_seat_front_left_heat
                {% elif 'Cool' in option %} select.shadowfax_seat_front_left_vent
                {% endif %}
            data:
              option: "{{ 'Level_' ~ option.split(' ')[1] if ' ' in option else 'Off' }}"

      - name: "Passenger Seat Combined"
        unique_id: passenger_seat_combined
        options: "{{ ['Off', 'Heat 1', 'Heat 2', 'Heat 3', 'Cool 1', 'Cool 2', 'Cool 3'] }}"
        state: >
          {% set h = states('select.shadowfax_seat_front_right_heat') %}
          {% set v = states('select.shadowfax_seat_front_right_vent') %}
          {% if h != 'Off' and 'Level' in h %} Heat {{ h.split('_')[1] }}
          {% elif v != 'Off' and 'Level' in v %} Cool {{ v.split('_')[1] }}
          {% else %} Off {% endif %}
        select_option:
          - action: select.select_option
            target:
              entity_id: [select.shadowfax_seat_front_right_heat, select.shadowfax_seat_front_right_vent]
            data: { option: "Off" }
          - action: select.select_option
            target:
              entity_id: >
                {% if 'Heat' in option %} select.shadowfax_seat_front_right_heat
                {% elif 'Cool' in option %} select.shadowfax_seat_front_right_vent
                {% endif %}
            data:
              option: "{{ 'Level_' ~ option.split(' ')[1] if ' ' in option else 'Off' }}"

      - name: "Rear Left Seat Combined"
        unique_id: rear_left_seat_combined
        options: "{{ ['Off', 'Heat 1', 'Heat 2', 'Heat 3'] }}"
        state: >
          {% set h = states('select.shadowfax_seat_rear_left_heat') %}
          {{ 'Heat ' ~ h.split('_')[1] if h != 'Off' and 'Level' in h else 'Off' }}
        select_option:
          - action: select.select_option
            target:
              entity_id: select.shadowfax_seat_rear_left_heat
            data:
              option: "{{ 'Level_' ~ option.split(' ')[1] if ' ' in option else 'Off' }}"

      - name: "Rear Right Seat Combined"
        unique_id: rear_right_seat_combined
        options: "{{ ['Off', 'Heat 1', 'Heat 2', 'Heat 3'] }}"
        state: >
          {% set h = states('select.shadowfax_seat_rear_right_heat') %}
          {{ 'Heat ' ~ h.split('_')[1] if h != 'Off' and 'Level' in h else 'Off' }}
        select_option:
          - action: select.select_option
            target:
              entity_id: select.shadowfax_seat_rear_right_heat
            data:
              option: "{{ 'Level_' ~ option.split(' ')[1] if ' ' in option else 'Off' }}"

      - name: "Steering Wheel Combined"
        unique_id: steering_wheel_combined
        options: "{{ ['Off', 'On'] }}"
        state: "{{ states('switch.shadowfax_steering_wheel_heat') | capitalize }}"
        select_option:
                - choose:
                    - conditions: "{{ option == 'On' }}"
                      sequence:
                        - action: switch.turn_on
                          target:
                            entity_id: switch.shadowfax_steering_wheel_heat
                    - conditions: "{{ option == 'Off' }}"
                      sequence:
                        - action: switch.turn_off
                          target:
                            entity_id: switch.shadowfax_steering_wheel_heat

  # -------------------------------------------------------------------
  # 1) Weather condition → mdi icon (simple, non-triggered)
  # -------------------------------------------------------------------
  - sensor:
      - name: "Weather Condition Icon"
        unique_id: weather_condition_icon
        state: >
          {% set condition = states('weather.forecast_home_2') | lower %}
          {% if condition in ['sunny', 'clear'] %}
            mdi:weather-sunny
          {% elif condition == 'clear-night' %}
            mdi:weather-night
          {% elif condition in ['partlycloudy', 'partly cloudy'] %}
            mdi:weather-partly-cloudy
          {% elif condition == 'cloudy' %}
            mdi:weather-cloudy
          {% elif condition in ['rainy', 'rain'] %}
            mdi:weather-rainy
          {% elif condition == 'pouring' %}
            mdi:weather-pouring
          {% elif condition == 'windy' %}
            mdi:weather-windy
          {% elif condition in ['fog', 'foggy'] %}
            mdi:weather-fog
          {% elif condition in ['snow', 'snowy'] %}
            mdi:weather-snowy
          {% elif condition == 'snowy-rainy' %}
            mdi:weather-snowy-rainy
          {% elif condition == 'hail' %}
            mdi:weather-hail
          {% elif condition == 'lightning' %}
            mdi:weather-lightning
          {% elif condition == 'lightning-rainy' %}
            mdi:weather-lightning-rainy
          {% elif condition == 'windy-variant' %}
            mdi:weather-windy-variant
          {% elif condition == 'exceptional' %}
            mdi:alert-circle-outline
          {% else %}
            mdi:weather-cloudy-alert
          {% endif %}

  # -------------------------------------------------------------------
  # 2) Active Notification Count
  # -------------------------------------------------------------------
  - sensor:
      - name: "Active Notification Count"
        unique_id: active_notification_count
        icon: mdi:bell
        state: >
          {% set ns = namespace(count=0) %}

          {# Front door lock battery low — currently 10%, urgent #}
          {% if states('sensor.front_door_battery_2') | float(100) < 20 %}
            {% set ns.count = ns.count + 1 %}
          {% endif %}

          {# Other locks battery low #}
          {% if states('sensor.side_door_battery') | float(100) < 20 %}
            {% set ns.count = ns.count + 1 %}
          {% endif %}
          {% if states('sensor.side_door_battery_2') | float(100) < 20 %}
            {% set ns.count = ns.count + 1 %}
          {% endif %}

          {# Any door unlocked when nobody's home #}
          {% if states('zone.home') | int(0) == 0 %}
            {% if is_state('lock.front_door', 'unlocked')
                  or is_state('lock.side_door', 'unlocked')
                  or is_state('lock.side_door_2', 'unlocked') %}
              {% set ns.count = ns.count + 1 %}
            {% endif %}
          {% endif %}

          {# Trash / recycle reminder is on #}
          {% if is_state('input_boolean.rubbish', 'on') %}
            {% set ns.count = ns.count + 1 %}
          {% endif %}
          {% if is_state('input_boolean.recycle', 'on') %}
            {% set ns.count = ns.count + 1 %}
          {% endif %}

          {# Washer or dryer running #}
          {% if is_state('sensor.ge_washer_d828c9a07203_d828c9a07203_laundry_machine_state', 'Run') %}
            {% set ns.count = ns.count + 1 %}
          {% endif %}
          {% if is_state('sensor.ge_dryer_av102747g_av102747g_laundry_machine_state', 'Run') %}
            {% set ns.count = ns.count + 1 %}
          {% endif %}

          {# Washer or dryer just finished — end-of-cycle binary sensors #}
          {% if is_state('binary_sensor.ge_washer_d828c9a07203_d828c9a07203_laundry_end_of_cycle', 'on') %}
            {% set ns.count = ns.count + 1 %}
          {% endif %}
          {% if is_state('binary_sensor.ge_dryer_av102747g_av102747g_laundry_end_of_cycle', 'on') %}
            {% set ns.count = ns.count + 1 %}
          {% endif %}

          {# Ghost's litter box needs emptying #}
          {% if is_state('binary_sensor.petkit_puramax_wastebin_filled', 'on') %}
            {% set ns.count = ns.count + 1 %}
          {% endif %}

          {# Ghost's litter low #}
          {% if states('sensor.petkit_puramax_litter_level') | float(100) < 20 %}
            {% set ns.count = ns.count + 1 %}
          {% endif %}

          {# Smart spray liquid low #}
          {% if states('sensor.air_smart_spray_liquid_level') | float(100) < 15 %}
            {% set ns.count = ns.count + 1 %}
          {% endif %}

          {# Shadowfax low charge #}
          {% if states('sensor.shadowfax_battery_state_of_charge') | float(100) < 25 %}
            {% set ns.count = ns.count + 1 %}
          {% endif %}

          {# Internet down #}
          {% if is_state('binary_sensor.be5000_wan_status', 'off') %}
            {% set ns.count = ns.count + 1 %}
          {% endif %}

          {# Any battery-powered phone / iPad below 25% (one bump per device) #}
          {% if states('sensor.brians_ipad_783_battery_level') | float(100) < 25 %}
            {% set ns.count = ns.count + 1 %}
          {% endif %}
          {% if states('sensor.office_ha_display_battery_level') | float(100) < 25 %}
            {% set ns.count = ns.count + 1 %}
          {% endif %}

          {{ ns.count }}
        attributes:
          alerts: >
            {% set ns = namespace(items=[]) %}
            {% if states('sensor.front_door_battery_2') | float(100) < 20 %}
              {% set ns.items = ns.items + ['Front door lock battery low (' ~ states('sensor.front_door_battery_2') ~ '%)'] %}
            {% endif %}
            {% if states('sensor.side_door_battery') | float(100) < 20 %}
              {% set ns.items = ns.items + ['Side door lock battery low (' ~ states('sensor.side_door_battery') ~ '%)'] %}
            {% endif %}
            {% if states('sensor.side_door_battery_2') | float(100) < 20 %}
              {% set ns.items = ns.items + ['Side door keypad battery low (' ~ states('sensor.side_door_battery_2') ~ '%)'] %}
            {% endif %}
            {% if states('zone.home') | int(0) == 0 %}
              {% if is_state('lock.front_door', 'unlocked')
                    or is_state('lock.side_door', 'unlocked')
                    or is_state('lock.side_door_2', 'unlocked') %}
                {% set ns.items = ns.items + ['A door is unlocked and nobody is home'] %}
              {% endif %}
            {% endif %}
            {% if is_state('input_boolean.rubbish', 'on') %}
              {% set ns.items = ns.items + ['Trash night — take bins out'] %}
            {% endif %}
            {% if is_state('input_boolean.recycle', 'on') %}
              {% set ns.items = ns.items + ['Recycling night — take bins out'] %}
            {% endif %}
            {% if is_state('sensor.ge_washer_d828c9a07203_d828c9a07203_laundry_machine_state', 'Run') %}
              {% set ns.items = ns.items + ['Washer running'] %}
            {% endif %}
            {% if is_state('sensor.ge_dryer_av102747g_av102747g_laundry_machine_state', 'Run') %}
              {% set ns.items = ns.items + ['Dryer running'] %}
            {% endif %}
            {% if is_state('binary_sensor.ge_washer_d828c9a07203_d828c9a07203_laundry_end_of_cycle', 'on') %}
              {% set ns.items = ns.items + ['Washer finished — unload it'] %}
            {% endif %}
            {% if is_state('binary_sensor.ge_dryer_av102747g_av102747g_laundry_end_of_cycle', 'on') %}
              {% set ns.items = ns.items + ['Dryer finished — unload it'] %}
            {% endif %}
            {% if is_state('binary_sensor.petkit_puramax_wastebin_filled', 'on') %}
              {% set ns.items = ns.items + ['Litter box waste bin full'] %}
            {% endif %}
            {% if states('sensor.petkit_puramax_litter_level') | float(100) < 20 %}
              {% set ns.items = ns.items + ['Litter level low (' ~ states('sensor.petkit_puramax_litter_level') ~ '%)'] %}
            {% endif %}
            {% if states('sensor.air_smart_spray_liquid_level') | float(100) < 15 %}
              {% set ns.items = ns.items + ['Smart spray liquid low'] %}
            {% endif %}
            {% if states('sensor.shadowfax_battery_state_of_charge') | float(100) < 25 %}
              {% set ns.items = ns.items + ['Shadowfax charge low (' ~ states('sensor.shadowfax_battery_state_of_charge') ~ '%)'] %}
            {% endif %}
            {% if is_state('binary_sensor.be5000_wan_status', 'off') %}
              {% set ns.items = ns.items + ['Internet is down'] %}
            {% endif %}
            {% if states('sensor.brians_ipad_783_battery_level') | float(100) < 25 %}
              {% set ns.items = ns.items + ["Brian's iPad battery low (" ~ states('sensor.brians_ipad_783_battery_level') ~ '%)'] %}
            {% endif %}
            {% if states('sensor.office_ha_display_battery_level') | float(100) < 25 %}
              {% set ns.items = ns.items + ['Office display battery low (' ~ states('sensor.office_ha_display_battery_level') ~ '%)'] %}
            {% endif %}
            {{ ns.items }}

  # -------------------------------------------------------------------
  # 3) Hourly + Daily Weather Forecast (TRIGGER-BASED — needs HA restart)
  # -------------------------------------------------------------------
  - trigger:
      - platform: time_pattern
        minutes: /15
      - platform: homeassistant
        event: start

    action:
      - action: weather.get_forecasts
        target:
          entity_id: weather.forecast_home_2
        data:
          type: hourly
        response_variable: forecast_hourly
      - action: weather.get_forecasts
        target:
          entity_id: weather.forecast_home_2
        data:
          type: daily
        response_variable: forecast_daily

    sensor:
      - name: "Hourly Weather Data"
        unique_id: hourly_weather_data
        state: >
          {% if forecast_hourly['weather.forecast_home_2'].forecast is defined
                and forecast_hourly['weather.forecast_home_2'].forecast | length > 0 %}
            {{ as_local(strptime(forecast_hourly['weather.forecast_home_2'].forecast[0].datetime,
                                 '%Y-%m-%dT%H:%M:%S%z')) }}
          {% else %}
            unknown
          {% endif %}
        attributes:
          forecast_data: >
            {% if forecast_hourly['weather.forecast_home_2'].forecast is defined
                  and forecast_hourly['weather.forecast_home_2'].forecast | length > 0 %}
              {{ forecast_hourly['weather.forecast_home_2'].forecast[0] }}
            {% else %}
              {}
            {% endif %}
          forecasts: >
            {{ forecast_hourly['weather.forecast_home_2'].forecast
               if forecast_hourly['weather.forecast_home_2'].forecast is defined
               else [] }}

      - name: "Daily Weather Data"
        unique_id: daily_weather_data
        state: >
          {% if forecast_daily['weather.forecast_home_2'].forecast is defined
                and forecast_daily['weather.forecast_home_2'].forecast | length > 0 %}
            {{ as_local(strptime(forecast_daily['weather.forecast_home_2'].forecast[0].datetime,
                                 '%Y-%m-%dT%H:%M:%S%z')) }}
          {% else %}
            unknown
          {% endif %}
        attributes:
          forecast_data: >
            {% if forecast_daily['weather.forecast_home_2'].forecast is defined
                  and forecast_daily['weather.forecast_home_2'].forecast | length > 0 %}
              {{ forecast_daily['weather.forecast_home_2'].forecast[0] }}
            {% else %}
              {}
            {% endif %}
          forecasts: >
            {{ forecast_daily['weather.forecast_home_2'].forecast
               if forecast_daily['weather.forecast_home_2'].forecast is defined
               else [] }}

  # -------------------------------------------------------------------
  # 4) Camera Last-Activity Status sensors
  # -------------------------------------------------------------------
  - sensor:

      - name: "Doorbell Camera Status"
        unique_id: doorbell_camera_status
        state: >-
          {% set last = states.event.doorbell_motion.state if states.event.doorbell_motion is not none else None %}
          {% if last in [None, 'unknown', 'unavailable'] %}
            No recent activity
          {% else %}
            {% set t = as_timestamp(last) %}
            {% if t %}
              {% set diff = as_timestamp(now()) - t %}
              {% set h = (diff // 3600) | int %}
              {% set m = ((diff % 3600) / 60) | int %}
              {% if h > 0 %}{{ h }}h {{ m }}m ago
              {% else %}{{ m }}m ago{% endif %}
            {% else %}
              No recent activity
            {% endif %}
          {% endif %}

      - name: "Front Door Ding Status"
        unique_id: front_door_ding_status
        state: >-
          {% set last = states.event.front_door_ding.state if states.event.front_door_ding is not none else None %}
          {% if last in [None, 'unknown', 'unavailable'] %}
            No recent activity
          {% else %}
            {% set t = as_timestamp(last) %}
            {% if t %}
              {% set diff = as_timestamp(now()) - t %}
              {% set h = (diff // 3600) | int %}
              {% set m = ((diff % 3600) / 60) | int %}
              {% if h > 0 %}{{ h }}h {{ m }}m ago
              {% else %}{{ m }}m ago{% endif %}
            {% else %}
              No recent activity
            {% endif %}
          {% endif %}

      # NSPanel temperature mirror — bypasses embedded_indoor_temperature shortcut
      # for proper °F string display on panel home page
      - name: "Office Panel Temperature F"
        unique_id: office_panel_temp_f
        unit_of_measurement: "°F"
        device_class: temperature
        state_class: measurement
        state: "{{ states('sensor.office_light_switch_temperature') | float | round(1) }}"

  # -------------------------------------------------------------------
  # 5) Doorbell popup helper — auto-off binary sensor
  # -------------------------------------------------------------------
  - trigger:
      - platform: state
        entity_id: event.doorbell_ding
    binary_sensor:
      - name: "Doorbell Recently Rang"
        unique_id: doorbell_recently_rang
        device_class: occupancy
        state: "on"
        auto_off: "00:01:00"
  - sensor:
      - name: "Shadowfax Home Charging Energy"
        unique_id: shadowfax_home_charging_energy
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
        icon: mdi:ev-station
        # Rivian's own charging sensors (charging_speed, charging_energy_delivered,
        # charging_time_elapsed, ...) NEVER report a numeric value for this vehicle -
        # verified 2026-07-26: 26/26 recorded states were unknown/unavailable even
        # while binary_sensor.shadowfax_charging_status was on. So home-charging
        # energy is derived from SoC delta x pack capacity / 0.90 AC efficiency,
        # accumulated by automation.shadowfax_home_charging_accumulate.
        state: "{{ states('input_number.shadowfax_home_charging_total_kwh') | float(0) | round(3) }}"
        availability: "{{ states('input_number.shadowfax_home_charging_total_kwh') not in ['unknown', 'unavailable'] }}"
  - sensor:
      - name: "HVAC Power"
        unique_id: hvac_power_estimate
        unit_of_measurement: "kW"
        device_class: power
        state_class: measurement
        icon: mdi:hvac
        # Estimated, not measured. 1.45 kW per compressor, from the MEDIAN of 731
        # natural on/off transitions mined from 7 days of recorder history on
        # 2026-07-31 (upstairs n=294 median 1444 W, main_floor n=437 median 1447 W;
        # IQR ~1300-1675 W both, i.e. fixed-speed units, not variable capacity).
        # Median rather than mean because the Airbnb dryer contaminates some steps.
        # Blower-only ("fan") periods are NOT counted - measured under ~200 W and
        # never resolved above noise - so this reads slightly LOW.
        # HEATING IS GAS: this counts only cooling, so it correctly reads ~0 in winter.
        # It does miss the blower during heat cycles (few hundred W) - same low bias.
        state: >
          {{ ((1.45 if is_state_attr('climate.upstairs_thermostat', 'hvac_action', 'cooling') else 0)
            + (1.45 if is_state_attr('climate.main_floor', 'hvac_action', 'cooling') else 0)) | round(3) }}
        availability: >
          {{ states('climate.upstairs_thermostat') not in ['unknown','unavailable']
             and states('climate.main_floor') not in ['unknown','unavailable'] }}
  - sensor:
      - name: "Shadowfax Speed (driving)"
        unique_id: shadowfax_speed_driving
        unit_of_measurement: "mph"
        device_class: speed
        state_class: measurement
        icon: mdi:speedometer
        # The raw sensor.shadowfax_speed writes ~14.4k rows/day and 93.7% of those
        # are while the car is PARKED (measured 2026-07-31: 94,426 of 100,805 rows
        # over 7 days, with the car in use only 5.1% of the time). This gated copy
        # pins to 0 when parked so the recorder only sees real driving data, and
        # the raw sensor is excluded from the recorder.
        state: >
          {% if is_state('binary_sensor.shadowfax_in_use_state', 'on') %}
            {{ states('sensor.shadowfax_speed') | float(0) | round(1) }}
          {% else %}0{% endif %}
        availability: "{{ states('sensor.shadowfax_speed') not in ['unknown','unavailable'] }}"
  - sensor:
      - name: "Home Power"
        unique_id: home_power_total
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        icon: mdi:home-lightning-bolt
        # Total house draw = solar production + grid demand.
        # The Xcel demand sensor is SIGNED (negative = exporting), so this sum is
        # the true consumption regardless of which way the meter is spinning.
        # NOTE: includes the downstairs Airbnb unit - it shares the meter and has
        # no separate monitoring.
        state: >
          {{ ((states('sensor.envoy_202504003929_current_power_production') | float(0)) * 1000
             + (states('sensor.xcel_itron_5_instantaneous_demand_value') | float(0))) | round(0) }}
        availability: >
          {{ states('sensor.envoy_202504003929_current_power_production') not in ['unknown','unavailable']
             and states('sensor.xcel_itron_5_instantaneous_demand_value') not in ['unknown','unavailable'] }}
  - trigger:
      - trigger: state
        entity_id: sensor.envoy_202504003929_energy_production_today
    sensor:
      - name: "Solar Production Today (guarded)"
        unique_id: solar_production_today_guarded
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
        icon: mdi:solar-power-variant
        # DELTA ACCUMULATOR guard for the Envoy production sensor, which has
        # twice injected phantom MWh by reporting its lifetime total in the
        # daily field (2026-05-08, 2026-07-31) - and since 07-31 has STOPPED
        # resetting at midnight entirely (it is now effectively a lifetime
        # counter). Absolute values are therefore untrustworthy in both
        # directions; only the increments are real. This sensor adds each
        # positive delta below 10 kWh (physical max is ~6.2 kWh/h at full
        # clip) and ignores everything else: upward jumps of thousands are
        # rejected, resets add nothing. Monotonic forever.
        # KNOWN LIMIT: if HA is down >~90 min in peak sun, the single catch-up
        # delta on reconnect may exceed 10 kWh and be rejected (undercount).
        # The Energy dashboard reads THIS sensor, not the raw one.
        state: >
          {% set acc = this.state | float(0) if this is defined else 0 %}
          {% set prev = trigger.from_state.state | float(none) if trigger.from_state is not none else none %}
          {% set cur = trigger.to_state.state | float(none) if trigger.to_state is not none else none %}
          {% if prev is none or cur is none %}
            {{ acc | round(3) }}
          {% else %}
            {% set d = cur - prev %}
            {% if 0 < d < 10 %}{{ (acc + d) | round(3) }}{% else %}{{ acc | round(3) }}{% endif %}
          {% endif %}







