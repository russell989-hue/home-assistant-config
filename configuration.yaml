influxdb:
  host: localhost
  port: 8086
  database: shadowfaxdb
  include:
    entities:
      - sensor.shadowfax_trip_data
      - sensor.shadowfax_battery_state_of_charge
      - sensor.shadowfax_odometer
      
input_datetime:
  shadowfax_trip_start_time:
    name: "Shadowfax Trip Start Time"
    has_date: true
    has_time: true
    icon: mdi:car-clock

  basement_last_inside_signal:
    name: "Basement Last Inside Signal"
    has_date: true
    has_time: true
    icon: mdi:door-closed-lock

  basement_last_outside_signal:
    name: "Basement Last Outside Signal"
    has_date: true
    has_time: true
    icon: mdi:door-open

shell_command:
  cleanup_recordings: find /media/recordings -type f -name '*.mp4' -mtime +15 -delete
  save_last_recording: 'mkdir -p /media/saved && f=$(ls -t /media/recordings/{{ camera }}/*.mp4 2>/dev/null | head -1) && cp "$f" "/media/saved/{{ camera }}_$(basename $f)"'
  keep_streams_alive: /config/scripts/keep_streams_alive.sh
  archive_recordings: sh /config/scripts/archive_recordings.sh
  fix_recording: nohup sh /config/scripts/fix_recording.sh '{{ f }}' >/dev/null 2>&1 &
  batch_fix_recordings: nohup sh /config/scripts/batch_fix_recordings.sh >/dev/null 2>&1 &
  # --- JBL MA510 IP Control ---
  jbl_power_on:        "python3 /config/scripts/jbl_ma510.py power_on"
  jbl_power_off:       "python3 /config/scripts/jbl_ma510.py power_off"
  jbl_mute_on:         "python3 /config/scripts/jbl_ma510.py mute_on"
  jbl_mute_off:        "python3 /config/scripts/jbl_ma510.py mute_off"
  jbl_input_tv:        "python3 /config/scripts/jbl_ma510.py input_tv"
  jbl_input_hdmi1:     "python3 /config/scripts/jbl_ma510.py input_hdmi1"
  jbl_input_hdmi2:     "python3 /config/scripts/jbl_ma510.py input_hdmi2"
  jbl_input_hdmi3:     "python3 /config/scripts/jbl_ma510.py input_hdmi3"
  jbl_input_hdmi4:     "python3 /config/scripts/jbl_ma510.py input_hdmi4"
  jbl_input_optical:   "python3 /config/scripts/jbl_ma510.py input_optical"
  jbl_input_coax:      "python3 /config/scripts/jbl_ma510.py input_coax"
  jbl_input_bt:        "python3 /config/scripts/jbl_ma510.py input_bt"
  jbl_input_network:   "python3 /config/scripts/jbl_ma510.py input_network"
  jbl_surr_native:     "python3 /config/scripts/jbl_ma510.py surr_native"
  jbl_surr_stereo20:   "python3 /config/scripts/jbl_ma510.py surr_stereo20"
  jbl_surr_allstereo:  "python3 /config/scripts/jbl_ma510.py surr_allstereo"
  jbl_surr_plii:       "python3 /config/scripts/jbl_ma510.py surr_plii"
  jbl_dialog_on:       "python3 /config/scripts/jbl_ma510.py dialog_on"
  jbl_dialog_off:      "python3 /config/scripts/jbl_ma510.py dialog_off"
  jbl_dolby_movie:     "python3 /config/scripts/jbl_ma510.py dolby_movie"
  jbl_dolby_music:     "python3 /config/scripts/jbl_ma510.py dolby_music"
  jbl_dolby_off:       "python3 /config/scripts/jbl_ma510.py dolby_off"
  jbl_volume:          "python3 /config/scripts/jbl_ma510.py volume {{ volume }}"
  jbl_vol_up:   "python3 /config/scripts/jbl_ma510.py vol_up"
  jbl_vol_down: "python3 /config/scripts/jbl_ma510.py vol_down"
  jbl_nav_up:    "python3 /config/scripts/jbl_ma510.py nav_up"
  jbl_nav_down:  "python3 /config/scripts/jbl_ma510.py nav_down"
  jbl_nav_left:  "python3 /config/scripts/jbl_ma510.py nav_left"
  jbl_nav_right: "python3 /config/scripts/jbl_ma510.py nav_right"
  jbl_nav_ok:    "python3 /config/scripts/jbl_ma510.py nav_ok"
  jbl_nav_menu:  "python3 /config/scripts/jbl_ma510.py nav_menu"
  jbl_nav_back:  "python3 /config/scripts/jbl_ma510.py nav_back"

command_line:
  # --- JBL MA510 State Sensors ---
  - sensor:
      name: "JBL Power"
      unique_id: jbl_ma510_power
      command: "python3 /config/scripts/jbl_ma510.py power_status 2>/dev/null || echo unavailable"
      scan_interval: 30
  - sensor:
      name: "JBL Input"
      unique_id: jbl_ma510_input
      command: "python3 /config/scripts/jbl_ma510.py input_status 2>/dev/null || echo unavailable"
      scan_interval: 30
  - sensor:
      name: "JBL Volume"
      unique_id: jbl_ma510_volume
      command: "python3 /config/scripts/jbl_ma510.py volume_status 2>/dev/null || echo unavailable"
      scan_interval: 30
  - sensor:
      name: "JBL Mute"
      unique_id: jbl_ma510_mute
      command: "python3 /config/scripts/jbl_ma510.py mute_status 2>/dev/null || echo unavailable"
      scan_interval: 30
  - sensor:
      name: "JBL Surround"
      unique_id: jbl_ma510_surround
      command: "python3 /config/scripts/jbl_ma510.py surr_status 2>/dev/null || echo unavailable"
      scan_interval: 30

homeassistant:
  allowlist_external_dirs:
    - "/config"
    - "/media"


# Material You Utilities configuration panel (color picker)
panel_custom:
  - name: material-you-panel
    url_path: material-you-configuration
    sidebar_title: Material You
    sidebar_icon: mdi:palette
    module_url: /hacsfiles/material-you-utilities/material-you-utilities.min.js
    
recorder:
  purge_keep_days: 7
  exclude:
    domains:
      - update        # 123 update trackers, no history value
      - button
      - image
    entity_globs:
      - sensor.*_browser_*        # browser_mod chatter
      - sensor.*_last_update_trigger
      - sensor.sun_next_*
      - sensor.*_lqi              # zigbee mesh noise
      - sensor.*_rssi

# and make the quieter logging permanent (already active until restart):
logger:
  default: warning
