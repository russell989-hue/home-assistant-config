  shadowfax_charge_session_max_soc:
    name: "Shadowfax Charge Session Max SoC"
    # Highest SoC seen so far in the OPEN session. -1 = no session.
    # Energy is credited only for SoC ABOVE this high-water mark, which is what
    # makes the accumulator immune to the sensor's sawtooth (dips credit nothing).
    min: -1
