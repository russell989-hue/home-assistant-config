homeassistant:
  allowlist_external_dirs:
    - "/config"
    - "/media"


# Material You Utilities configuration panel (color picker)
panel_custom:
  - name: material-you-panel
    url_path: material-you-configuration
    sidebar_title: Material You
    sidebar_icon: mdi:palette
    module_url: /hacsfiles/material-you-utilities/material-you-utilities.min.js
    
recorder:
  purge_keep_days: 30
  exclude:
    entities:
      - sensor.android_notification_phone_active_notification_count  # attrs >16KB, recorder refuses them anyway
      - media_player.office  # HASS.Agent desktop, ~41k rows/day even while PAUSED (republishes on interval)
      - media_player.br_desktop  # HASS.Agent desktop, ~19k rows/day, same behaviour
      - sensor.shadowfax_speed  # 93.7% of its 14.4k rows/day are while PARKED; use sensor.shadowfax_speed_driving
      - sensor.shadowfax_bearing        # compass heading, ~14.4k rows/day, never used
      - sensor.shadowfax_altitude       # ~14.4k rows/day, never used
    domains:
      - update        # 123 update trackers, no history value
      - button
      - image
    entity_globs:
      - sensor.*_browser_*        # browser_mod chatter
      - sensor.*_last_update_trigger
      - sensor.sun_next_*
      - sensor.*_lqi              # zigbee mesh noise
      - sensor.*_rssi
      - sensor.shadowfax_bluetooth_module_failure_status_*  # constant "dtc_not_set", ~4-6k rows/day each
      - sensor.system_monitor_*_pressure_*                  # 7 entities x ~5k rows/day, no diagnostic value kept
      - sensor.xcel_itron_5_*_timeperiodstart               # bare timestamps, ~10.7k rows/day each

# and make the quieter logging permanent (already active until restart):
logger:
  default: warning
  logs:
    # nest_legacy dumps multi-line trait diffs on every poll (~2k lines/day)
    custom_components.nest_legacy.pynest: error
    custom_components.nest_legacy.coordinator: error  # camera-event poll hits dead legacy gRPC endpoint (2026-07-24)
    google_nest_sdm.event_media: error  # 400 INVALID_ARGUMENT event-media pre-fetch noise (2026-07-24)
